<div id="game">

</div>
</div>

</div>

<script>
const square=document.getElementById("square");
const start=document.getElementById("start");
const end=document.getElementById("end");
const score=document.getElementById("score");
const info=document.getElementById("info");
const finalScore=document.getElementById("finalScore");

let x=innerWidth/2;
let y=innerHeight/2;
let vx=0;
let vy=0;
let pointerX=-1000;
let pointerY=-1000;
let playing=false;
let startTime=0;
let lastTime=0;

function place(){
square.style.left=x+"px";
square.style.top=y+"px"
}

function startGame(){
start.style.display="none";
end.style.display="none";
playing=true;
startTime=performance.now();
lastTime=startTime;
x=innerWidth/2;
y=innerHeight/2;
vx=0;
vy=0;
pointerX=-1000;
pointerY=-1000;
info.textContent="Approche ton doigt du carré...";
place();
requestAnimationFrame(loop)
}

function stopGame(){
playing=false;
let t=(performance.now()-startTime)/1000;
finalScore.textContent=t.toFixed(1)+" secondes";
end.style.display="flex"
}

function loop(now){
if(!playing)return;

let dt=Math.min((now-lastTime)/1000,.035);
lastTime=now;

let dx=x-pointerX;
let dy=y-pointerY;
let dist=Math.sqrt(dx*dx+dy*dy);

if(dist<230){

let force=(230-dist)/230;

if(dist>1){
vx+=(dx/dist)*force*1500*dt;
vy+=(dy/dist)*force*1500*dt
}

info.textContent="Il te fuit !";
}else{
info.textContent="Approche ton doigt du carré...";
}

let maxSpeed=470;
let speed=Math.sqrt(vx*vx+vy*vy);

if(speed>maxSpeed){
vx=vx/speed*maxSpeed;
vy=vy/speed*maxSpeed
}

x+=vx*dt;
y+=vy*dt;

vx*=Math.pow(.08,dt);
vy*=Math.pow(.08,dt);

let half=29;

if(x<half){
x=half;
vx=Math.abs(vx)*.85
}
if(x>innerWidth-half){
x=innerWidth-half;
vx=-Math.abs(vx)*.85
}
if(y<75+half){
y=75+half;
vy=Math.abs(vy)*.85
}
if(y>innerHeight-half){
y=innerHeight-half;
vy=-Math.abs(vy)*.85
}

place();

score.textContent=
"Temps : "+((now-startTime)/1000).toFixed(1)+" s";

requestAnimationFrame(loop)
}

function pointer(e){
const p=e.touches?e.touches[0]:e;
pointerX=p.clientX;
pointerY=p.clientY
}

document.addEventListener("touchstart",pointer,{passive:false});
document.addEventListener("touchmove",pointer,{passive:false});
document.addEventListener("mousemove",pointer);

document.addEventListener("touchend",function(){
pointerX=-1000;
pointerY=-1000
});

addEventListener("resize",function(){
x=Math.min(x,innerWidth-29);
y=Math.min(y,innerHeight-29);
place()
});

place();
</script>

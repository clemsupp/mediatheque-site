
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PARTICLES — Satisfying 07</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#090b0f;
  --panel:#11151c;
  --line:#252b35;
  --text:#f4f5f7;
  --muted:#858d9a;
}
body{
  background:var(--bg);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
  overflow:hidden;
  height:100dvh;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}
canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}
.top{
  position:fixed;
  top:20px;
  left:20px;
  right:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:5;
  pointer-events:none;
}
.brand{pointer-events:auto}
.brand h1{
  font-size:19px;
  letter-spacing:4px;
  font-weight:800;
}
.brand p{
  color:var(--muted);
  font-size:10px;
  letter-spacing:2px;
  margin-top:5px;
}
.back{
  pointer-events:auto;
  color:white;
  text-decoration:none;
  border:1px solid var(--line);
  background:#11151c;
  padding:11px 16px;
  border-radius:10px;
  font-size:12px;
  font-weight:700;
}
.panel{
  position:fixed;
  z-index:5;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:min(540px,calc(100% - 28px));
  padding:17px;
  background:rgba(17,21,28,.96);
  border:1px solid var(--line);
  border-radius:17px;
}
.panel-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}
.panel-title strong{
  font-size:12px;
  letter-spacing:2px;
}
.status{
  color:#aeb6c2;
  font-size:10px;
}
.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.control label{
  display:flex;
  justify-content:space-between;
  color:#aeb6c2;
  font-size:11px;
  margin-bottom:9px;
}
.control label span{color:white}
input[type=range]{
  width:100%;
  accent-color:white;
  height:4px;
}
.buttons{
  display:flex;
  gap:8px;
  margin-top:16px;
}
button{
  flex:1;
  padding:11px 8px;
  border:1px solid var(--line);
  background:#1a202a;
  color:white;
  border-radius:9px;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
}
button:active{background:#303946}
button.primary{
  background:white;
  color:#090b0f;
  border-color:white;
}
.stats{
  display:flex;
  justify-content:space-between;
  margin-top:14px;
  padding-top:12px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:10px;
}
.stats b{color:white;font-weight:600}
.hint{
  position:fixed;
  top:48%;
  left:50%;
  transform:translate(-50%,-50%);
  color:#69717d;
  font-size:11px;
  letter-spacing:2px;
  text-align:center;
  pointer-events:none;
  opacity:.7;
}
@media(max-width:480px){
  .top{top:14px;left:14px;right:14px}
  .brand h1{font-size:16px}
  .panel{bottom:12px;padding:14px}
  .buttons button{font-size:10px}
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="top">
  <div class="brand">
    <h1>PARTICLES</h1>
    <p>SATISFYING EXPERIENCE 07</p>
  </div>
  <a class="back" href="/">← MENU</a>
</div>

<div class="hint" id="hint">MOVE YOUR FINGER</div>

<div class="panel">
  <div class="panel-title">
    <strong>PARTICLE CONTROL</strong>
    <span class="status" id="status">● ACTIVE</span>
  </div>

  <div class="controls">
    <div class="control">
      <label>Quantité <span id="countValue">350</span></label>
      <input id="count" type="range" min="80" max="700" value="350" step="10">
    </div>
    <div class="control">
      <label>Vitesse <span id="speedValue">1.0</span></label>
      <input id="speed" type="range" min="1" max="30" value="10">
    </div>
    <div class="control">
      <label>Taille <span id="sizeValue">2</span></label>
      <input id="size" type="range" min="1" max="5" value="2">
    </div>
    <div class="control">
      <label>Force <span id="forceValue">1.0</span></label>
      <input id="force" type="range" min="1" max="30" value="10">
    </div>
  </div>

  <div class="buttons">
    <button class="primary" id="pause">PAUSE</button>
    <button id="repel">REPULSION</button>
    <button id="attract">ATTRACTION</button>
    <button id="reset">RESET</button>
  </div>

  <div class="stats">
    <span>PARTICULES : <b id="total">350</b></span>
    <span>FPS : <b id="fps">60</b></span>
    <span>MODE : <b id="mode">REPULSION</b></span>
  </div>
</div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d",{alpha:false});

let W=0,H=0,DPR=1;
let particles=[];
let running=true;
let mode="repel";
let pointer={x:-1000,y:-1000,active:false};
let amount=350;
let speed=1;
let size=2;
let force=1;
let lastTime=0;
let fpsFrames=0;
let fpsTime=0;
let currentFPS=60;
let adaptiveLimit=700;

function resize(){
  W=window.innerWidth;
  H=window.innerHeight;
  DPR=Math.min(window.devicePixelRatio||1,1.5);
  canvas.width=Math.floor(W*DPR);
  canvas.height=Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener("resize",resize);
resize();

function createParticle(){
  return {
    x:Math.random()*W,
    y:Math.random()*H,
    vx:(Math.random()-.5)*.5,
    vy:(Math.random()-.5)*.5,
    radius:.5+Math.random()*.8
  };
}

function createParticles(){
  particles=[];
  amount=Math.min(amount,adaptiveLimit);
  for(let i=0;i<amount;i++)particles.push(createParticle());
  updateStats();
}

function updateStats(){
  document.getElementById("total").textContent=particles.length;
  document.getElementById("countValue").textContent=particles.length;
}

function update(){
  const forcePower=force*.055;
  const speedPower=speed*.045;

  for(let i=0;i<particles.length;i++){
    const p=particles[i];

    if(pointer.active){
      const dx=pointer.x-p.x;
      const dy=pointer.y-p.y;
      const distSq=dx*dx+dy*dy;

      if(distSq<18000&&distSq>1){
        const dist=Math.sqrt(distSq);
        const strength=(1-dist/Math.sqrt(18000))*forcePower;
        const direction=mode==="repel"?-1:1;

        p.vx+=(dx/dist)*strength*direction;
        p.vy+=(dy/dist)*strength*direction;
      }
    }

    p.vx*=.985;
    p.vy*=.985;

    p.x+=p.vx*speedPower;
    p.y+=p.vy*speedPower;

    if(p.x<0){p.x=0;p.vx=Math.abs(p.vx)}
    if(p.x>W){p.x=W;p.vx=-Math.abs(p.vx)}
    if(p.y<0){p.y=0;p.vy=Math.abs(p.vy)}
    if(p.y>H){p.y=H;p.vy=-Math.abs(p.vy)}
  }
}

function draw(){
  ctx.fillStyle="#090b0f";
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle="#ffffff";

  for(let i=0;i<particles.length;i++){
    const p=particles[i];
    ctx.beginPath();
    ctx.arc(p.x,p.y,size*p.radius,0,Math.PI*2);
    ctx.fill();
  }
}

function loop(time){
  requestAnimationFrame(loop);

  if(!running)return;

  if(time-lastTime<15)return;
  lastTime=time;

  update();
  draw();

  fpsFrames++;
  if(time-fpsTime>=1000){
    currentFPS=fpsFrames;
    fpsFrames=0;
    fpsTime=time;
    document.getElementById("fps").textContent=currentFPS;

    if(currentFPS<40&&adaptiveLimit>150){
      adaptiveLimit=Math.max(150,adaptiveLimit-50);
      if(particles.length>adaptiveLimit){
        particles.length=adaptiveLimit;
        updateStats();
      }
    }
  }
}

requestAnimationFrame(loop);
createParticles();

function setPointer(e){
  pointer.x=e.clientX;
  pointer.y=e.clientY;
  pointer.active=true;
  document.getElementById("hint").style.opacity="0";
}

canvas.addEventListener("pointermove",setPointer);
canvas.addEventListener("pointerdown",e=>{
  setPointer(e);
  pointer.active=true;
});
canvas.addEventListener("pointerleave",()=>{
  pointer.active=false;
});
canvas.addEventListener("pointerup",()=>{
  pointer.active=false;
});

document.getElementById("count").addEventListener("input",e=>{
  amount=Number(e.target.value);
  document.getElementById("countValue").textContent=amount;
  createParticles();
});

document.getElementById("speed").addEventListener("input",e=>{
  speed=Number(e.target.value)/10;
  document.getElementById("speedValue").textContent=speed.toFixed(1);
});

document.getElementById("size").addEventListener("input",e=>{
  size=Number(e.target.value);
  document.getElementById("sizeValue").textContent=size;
});

document.getElementById("force").addEventListener("input",e=>{
  force=Number(e.target.value)/10;
  document.getElementById("forceValue").textContent=force.toFixed(1);
});

document.getElementById("pause").onclick=()=>{
  running=!running;
  document.getElementById("pause").textContent=running?"PAUSE":"REPRENDRE";
  document.getElementById("status").textContent=running?"● ACTIVE":"● PAUSE";
};

document.getElementById("repel").onclick=()=>{
  mode="repel";
  document.getElementById("mode").textContent="REPULSION";
};

document.getElementById("attract").onclick=()=>{
  mode="attract";
  document.getElementById("mode").textContent="ATTRACTION";
};

document.getElementById("reset").onclick=()=>{
  createParticles();
  pointer.active=false;
};

document.addEventListener("visibilitychange",()=>{
  if(document.hidden)pointer.active=false;
});
</script>
</body>
</html>

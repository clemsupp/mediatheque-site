<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js";

/* =========================================================
   AIM RUSH — COMPLETE GAME ENGINE
========================================================= */

const WEAPONS = [
  {id:"pistol",name:"RUSH PISTOL",art:"🔫",description:"A balanced starter weapon.",price:0,power:1,rate:1,interval:330,automatic:false,color:0x65f5ac},
  {id:"pulse",name:"PULSE BLASTER",art:"⚡",description:"A fast energy blaster.",price:1800,power:1.1,rate:1.6,interval:170,automatic:true,color:0x61a5ff},
  {id:"nova",name:"NOVA CANNON",art:"💠",description:"Heavy damage with precise shots.",price:5200,power:2,rate:.75,interval:650,automatic:false,color:0xb28aff},
  {id:"storm",name:"STORM X",art:"🌩️",description:"Extremely fast automatic firing.",price:9500,power:1.35,rate:2.4,interval:115,automatic:true,color:0xffd166},
  {id:"phantom",name:"PHANTOM",art:"👾",description:"A powerful precision weapon.",price:18000,power:2.5,rate:1.35,interval:260,automatic:false,color:0xff718b},
  {id:"quantum",name:"QUANTUM",art:"🔮",description:"The ultimate energy weapon.",price:35000,power:3.5,rate:2,interval:150,automatic:true,color:0x9aabff}

const UPGRADES = [
  {id:"damage",name:"ENERGY OUTPUT",desc:"Deal more damage to targets and bosses.",base:500,max:20},
  {id:"fire",name:"FIRE CONTROL",desc:"Shoot faster with every upgrade.",base:700,max:15},
  {id:"focus",name:"PRECISION SYSTEM",desc:"Increase precision and score bonuses.",base:900,max:15},
  {id:"reward",name:"COIN MULTIPLIER",desc:"Earn more coins from every target.",base:1200,max:20},
  {id:"xp",name:"XP BOOSTER",desc:"Earn additional experience.",base:1000,max:20},
  {id:"stability",name:"AIM STABILITY",desc:"Reduce visual aiming sensitivity.",base:800,max:10}
];

const SHOP_ITEMS = [
  {id:"skin_green",name:"NEON GREEN",type:"skin",art:"🟢",price:500,desc:"A luminous green theme.",color:"#65f5ac"},
  {id:"skin_blue",name:"CYBER BLUE",type:"skin",art:"🔵",price:800,desc:"A cool blue theme.",color:"#61a5ff"},
  {id:"skin_purple",name:"VOID PURPLE",type:"skin",art:"🟣",price:1200,desc:"A mysterious purple theme.",color:"#b28aff"},
  {id:"skin_gold",name:"GOLD RUSH",type:"skin",art:"🟡",price:2500,desc:"An exclusive golden theme.",color:"#ffd166"},
  {id:"effect_spark",name:"SPARK BURST",type:"effect",art:"✨",price:900,desc:"Bright impact particles.",color:"#ffffff"},
  {id:"effect_plasma",name:"PLASMA HIT",type:"effect",art:"💥",price:1600,desc:"A colourful impact effect.",color:"#b28aff"},
  {id:"effect_fire",name:"STAR BURST",type:"effect",art:"🌟",price:2200,desc:"A special star effect.",color:"#ffd166"},
  {id:"cross_dot",name:"MICRO DOT",type:"crosshair",art:"⊙",price:300,desc:"A minimalist crosshair.",color:"#65f5ac"},
  {id:"cross_plus",name:"PRECISION PLUS",type:"crosshair",art:"＋",price:500,desc:"A clean precision crosshair.",color:"#61a5ff"},
  {id:"cross_circle",name:"TARGET RING",type:"crosshair",art:"◎",price:750,desc:"A circular aiming reticle.",color:"#ffd166"}
];

const DEFAULT_CONFIG = {
  coinsPerKill:15,
  xpPerKill:10,
  duration:60,
  spawnRate:1200
};

function freshSave(){
  return {
    name:"PLAYER",coins:0,xp:0,level:1,
    kills:0,shots:0,hits:0,games:0,best:0,
    bestStreak:0,streak:0,totalCoinsEarned:0,
    weapon:"pistol",ownedWeapons:["pistol"],
    upgrades:{damage:0,fire:0,focus:0,reward:0,xp:0,stability:0},
    ownedItems:[],
    equippedSkin:"skin_green",
    equippedEffect:"effect_spark",
    equippedCrosshair:"cross_dot",
    history:[],achievements:[],
    dailyDate:"",dailyProgress:{kills:0,games:0,score:0},
    config:{...DEFAULT_CONFIG}
  };
}

function loadSave(){
  try{
    const raw=localStorage.getItem("aimrush_save_v1");
    if(!raw)return freshSave();
    const data=JSON.parse(raw);
    const base=freshSave();
    return {
      ...base,...data,
      upgrades:{...base.upgrades,...(data.upgrades||{})},
      config:{...DEFAULT_CONFIG,...(data.config||{})},
      ownedWeapons:Array.isArray(data.ownedWeapons)?data.ownedWeapons:["pistol"],
      ownedItems:Array.isArray(data.ownedItems)?data.ownedItems:[],
      history:Array.isArray(data.history)?data.history:[],
      achievements:Array.isArray(data.achievements)?data.achievements:[]
    };
  }catch(e){return freshSave();}
}

let save=loadSave();

function number(n){
  return Math.floor(Number(n)||0).toLocaleString("fr-FR");
}
function accuracy(){
  return save.shots?Math.round(save.hits/save.shots*100):0;
}
function getWeapon(){
  return WEAPONS.find(w=>w.id===save.weapon)||WEAPONS[0];
}
function getUpgrade(id){
  return Number(save.upgrades[id])||0;
}
function upgradeCost(u){
  return Math.floor(u.base*Math.pow(1.55,getUpgrade(u.id)));
}
function xpNeeded(level=save.level){
  return 100+Math.max(0,level-1)*65;
}
function notify(message,error=false){
  const container=document.getElementById("toastContainer");
  const el=document.createElement("div");
  el.className="toast"+(error?" error":"");
  el.textContent=message;
  container.appendChild(el);
  setTimeout(()=>el.remove(),3000);
}
function persist(){
  try{
    localStorage.setItem("aimrush_save_v1",JSON.stringify(save));
  }catch(e){
    notify("Unable to save progress in this browser.",true);
  }
  updateUI();
}

/* =========================================================
   DAILY MISSIONS AND ACHIEVEMENTS
========================================================= */

const today=()=>new Date().toISOString().slice(0,10);

function refreshDaily(){
  if(save.dailyDate!==today()){
    save.dailyDate=today();
    save.dailyProgress={kills:0,games:0,score:0};
    persist();
  }
}

const MISSIONS=[
  {id:"kills",name:"TARGET HUNTER",desc:"Hit 25 targets.",goal:25,reward:250},
  {id:"games",name:"TRAINING ROUTINE",desc:"Complete 3 sessions.",goal:3,reward:400},
  {id:"score",name:"HIGH SCORER",desc:"Score 5,000 points.",goal:5000,reward:500}
];

const ACHIEVEMENTS=[
  {id:"first_kill",name:"FIRST CONTACT",desc:"Hit your first target.",test:()=>save.kills>=1,reward:100},
  {id:"kills_100",name:"CENTURY",desc:"Hit 100 targets.",test:()=>save.kills>=100,reward:500},
  {id:"kills_500",name:"TARGET MASTER",desc:"Hit 500 targets.",test:()=>save.kills>=500,reward:1500},
  {id:"level_10",name:"RISING STAR",desc:"Reach level 10.",test:()=>save.level>=10,reward:1000},
  {id:"streak_10",name:"UNSTOPPABLE",desc:"Reach a 10-hit streak.",test:()=>save.bestStreak>=10,reward:750},
  {id:"games_25",name:"DEDICATED",desc:"Complete 25 sessions.",test:()=>save.games>=25,reward:1000},
  {id:"all_weapons",name:"ARSENAL COMPLETE",desc:"Unlock every weapon.",test:()=>WEAPONS.every(w=>save.ownedWeapons.includes(w.id)),reward:3000}
];

function checkAchievements(){
  ACHIEVEMENTS.forEach(a=>{
    if(!save.achievements.includes(a.id)&&a.test()){
      save.achievements.push(a.id);
      save.coins+=a.reward;
      save.totalCoinsEarned+=a.reward;
      notify("ACHIEVEMENT: "+a.name+" · +"+number(a.reward)+" coins");
      playSound("level");
    }
  });
}

function renderMissions(){
  let panel=document.getElementById("extraProgressPanel");
  if(!panel){
    panel=document.createElement("div");
    panel.id="extraProgressPanel";
    panel.className="card";
    panel.style.marginTop="16px";
    document.querySelector("#page-dashboard").appendChild(panel);
  }

  refreshDaily();

  panel.innerHTML=`
    <div class="card-title">DAILY MISSIONS</div>
    <div class="profile-grid" id="missionGrid"></div>
    <div style="height:20px"></div>
    <div class="card-title">ACHIEVEMENTS · ${save.achievements.length}/${ACHIEVEMENTS.length}</div>
    <div id="achievementList"></div>
  `;

  const grid=panel.querySelector("#missionGrid");

  MISSIONS.forEach(m=>{
    const progress=save.dailyProgress[m.id]||0;
    const done=progress>=m.goal;
    const item=document.createElement("div");
    item.style.cssText="padding:13px;background:#0c131d;border:1px solid var(--line);border-radius:9px";
    item.innerHTML=`
      <strong style="font-size:11px">${m.name}</strong>
      <p class="muted" style="font-size:10px;margin:6px 0">${m.desc}</p>
      <div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,progress/m.goal*100)}%"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:9px;margin-top:8px">
        <span>${number(Math.min(progress,m.goal))} / ${number(m.goal)}</span>
        <strong style="color:${done?"var(--green)":"var(--gold)"}">${done?"COMPLETED":"+"+number(m.reward)+" COINS"}</strong>
      </div>
    `;
    grid.appendChild(item);
  });

  const achievements=panel.querySelector("#achievementList");
  ACHIEVEMENTS.forEach(a=>{
    const unlocked=save.achievements.includes(a.id);
    const row=document.createElement("div");
    row.className="profile-stat";
    row.innerHTML=`
      <span>${unlocked?"✓":"◇"} ${a.name}<small class="muted" style="display:block;margin-top:4px">${a.desc}</small></span>
      <span>${unlocked?"UNLOCKED":"+"+number(a.reward)}</span>
    `;
    achievements.appendChild(row);
  });
}

/* =========================================================
   NAVIGATION
========================================================= */

window.openPage=function(name){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.querySelectorAll(".nav-tabs button").forEach(b=>b.classList.remove("active"));
  document.getElementById("page-"+name)?.classList.add("active");
  document.querySelector('[data-page="'+name+'"]')?.classList.add("active");

  if(name==="arsenal")renderWeapons();
  if(name==="upgrades")renderUpgrades();
  if(name==="shop")renderShop();
  if(name==="leaderboard")renderLeaderboard();
  if(name==="profile")renderProfile();
  if(name==="dashboard")renderMissions();
  if(name==="admin"&&!adminUnlocked)document.getElementById("adminPassword").value="";
};

/* =========================================================
   PLAYER UI
========================================================= */

function updateUI(){
  document.getElementById("topCoins").textContent=number(save.coins);
  document.getElementById("levelPill").textContent="LEVEL "+save.level;
  document.getElementById("statKills").textContent=number(save.kills);
  document.getElementById("statAccuracy").textContent=accuracy()+"%";
  document.getElementById("statBest").textContent=number(save.best);
  document.getElementById("statXP").textContent=number(save.xp);

  const weapon=getWeapon();
  document.getElementById("sideWeaponArt").textContent=weapon.art;
  document.getElementById("sideWeaponName").textContent=weapon.name;
  document.getElementById("sideWeaponMeta").textContent=weapon.automatic?"ENERGY · AUTOMATIC":"ENERGY · SEMI-AUTO";

  const power=Math.min(100,Math.round(weapon.power*25+getUpgrade("damage")*3));
  document.getElementById("sidePower").textContent=power+"%";
  document.getElementById("sidePowerBar").style.width=power+"%";
  document.getElementById("sideFireRate").textContent=(weapon.rate*(1+getUpgrade("fire")*.08)).toFixed(1)+"x";

  const skin=SHOP_ITEMS.find(x=>x.id===save.equippedSkin);
  if(skin)document.documentElement.style.setProperty("--green",skin.color);

  applyCrosshair();
  updateArenaStats();
}

function addXP(amount){
  save.xp+=Math.max(0,Math.floor(amount));
  let levelled=false;

  while(save.xp>=xpNeeded()){
    save.xp-=xpNeeded();
    save.level++;
    const bonus=save.level*100;
    save.coins+=bonus;
    save.totalCoinsEarned+=bonus;
    levelled=true;
    notify("LEVEL UP! LEVEL "+save.level+" · +"+number(bonus)+" coins");
  }

  if(levelled)playSound("level");
  checkAchievements();
}

function renderProfile(){
  document.getElementById("profileName").textContent=save.name;
  document.getElementById("playerNameInput").value=save.name;
  document.getElementById("profileLevel").textContent=save.level;
  document.getElementById("profileKills").textContent=number(save.kills);
  document.getElementById("profileAccuracy").textContent=accuracy()+"%";
  document.getElementById("profileGames").textContent=number(save.games);
  document.getElementById("profileBest").textContent=number(save.best);
  document.getElementById("profileCoins").textContent=number(save.coins);

  const needed=xpNeeded();
  document.getElementById("xpLabel").textContent=number(save.xp)+" / "+number(needed)+" XP";
  document.getElementById("xpProgress").style.width=Math.min(100,save.xp/needed*100)+"%";
}

window.changeName=function(){
  const name=document.getElementById("playerNameInput").value.trim().slice(0,20);
  if(!name)return notify("Enter a player name.",true);
  save.name=name;
  persist();
  renderProfile();
  notify("Player name updated.");
};

/* =========================================================
   WEAPONS
========================================================= */

function renderWeapons(){
  const grid=document.getElementById("weaponsGrid");
  grid.innerHTML="";

  WEAPONS.forEach(w=>{
    const owned=save.ownedWeapons.includes(w.id);
    const equipped=save.weapon===w.id;
    const card=document.createElement("div");
    card.className="item-card"+(equipped?" equipped":"");
    card.innerHTML=`
      ${equipped?'<div class="item-tag">EQUIPPED</div>':owned?'<div class="item-tag">UNLOCKED</div>':""}
      <div class="item-art">${w.art}</div>
      <h3>${w.name}</h3>
      <p>${w.description}<br>Damage: ${w.power}x · Fire rate: ${w.rate}x</p>
      <div class="item-price">${owned?"OWNED":number(w.price)+" COINS"}</div>
      <button class="btn ${equipped?"":"btn-primary"}">${equipped?"CURRENT WEAPON":owned?"EQUIP":"UNLOCK"}</button>
    `;

    card.querySelector("button").onclick=()=>{
      if(owned){
        save.weapon=w.id;
        persist();
        renderWeapons();
        notify(w.name+" equipped.");
      }else buyWeapon(w);
    };
    grid.appendChild(card);
  });
}

function buyWeapon(w){
  if(save.coins<w.price)return notify("Not enough coins.",true);
  save.coins-=w.price;
  save.ownedWeapons.push(w.id);
  save.weapon=w.id;
  checkAchievements();
  persist();
  renderWeapons();
  notify(w.name+" unlocked!");
  playSound("purchase");
}

/* =========================================================
   UPGRADES
========================================================= */

function renderUpgrades(){
  const list=document.getElementById("upgradesList");
  list.innerHTML="";

  UPGRADES.forEach(u=>{
    const level=getUpgrade(u.id);
    const cost=upgradeCost(u);
    const max=level>=u.max;
    const row=document.createElement("div");
    row.className="upgrade-row";
    row.innerHTML=`
      <div class="upgrade-info">
        <strong>${u.name}</strong>
        <p>${u.desc}</p>
        <div class="upgrade-level">LEVEL ${level} / ${u.max}</div>
        <div class="progress-track" style="max-width:220px">
          <div class="progress-fill" style="width:${level/u.max*100}%"></div>
        </div>
      </div>
      <div style="text-align:right">
        <div class="item-price">${max?"MAX LEVEL":number(cost)+" ◈"}</div>
        <button class="btn btn-primary btn-small" ${max?"disabled":""}>${max?"MAXED":"UPGRADE"}</button>
      </div>
    `;
    row.querySelector("button").onclick=()=>buyUpgrade(u);
    list.appendChild(row);
  });
}

function buyUpgrade(u){
  const level=getUpgrade(u.id);
  if(level>=u.max)return;
  const cost=upgradeCost(u);
  if(save.coins<cost)return notify("Not enough coins.",true);

  save.coins-=cost;
  save.upgrades[u.id]=level+1;
  persist();
  renderUpgrades();
  notify(u.name+" upgraded to level "+(level+1));
  playSound("purchase");
}

/* =========================================================
   SHOP
========================================================= */

let currentShopFilter="all";

window.filterShop=function(filter,button){
  currentShopFilter=filter;
  document.querySelectorAll(".shop-filters button").forEach(b=>b.classList.remove("active"));
  button.classList.add("active");
  renderShop();
};

function renderShop(){
  const grid=document.getElementById("shopGrid");
  grid.innerHTML="";

  SHOP_ITEMS.filter(i=>currentShopFilter==="all"||i.type===currentShopFilter).forEach(item=>{
    const owned=save.ownedItems.includes(item.id);
    const equipped=save.equippedSkin===item.id||save.equippedEffect===item.id||save.equippedCrosshair===item.id;
    const card=document.createElement("div");
    card.className="item-card"+(equipped?" equipped":"");
    card.innerHTML=`
      ${equipped?'<div class="item-tag">EQUIPPED</div>':owned?'<div class="item-tag">OWNED</div>':""}
      <div class="item-art">${item.art}</div>
      <h3>${item.name}</h3>
      <p>${item.desc}</p>
      <div class="item-price">${owned?"OWNED":number(item.price)+" COINS"}</div>
      <button class="btn ${owned?"":"btn-primary"}">${owned?(equipped?"EQUIPPED":"EQUIP"):"BUY ITEM"}</button>
    `;

    card.querySelector("button").onclick=()=>{
      if(!owned){
        if(save.coins<item.price)return notify("Not enough coins.",true);
        save.coins-=item.price;
        save.ownedItems.push(item.id);
      }
      equipShopItem(item);
      persist();
      renderShop();
      notify(item.name+(owned?" equipped.":" unlocked!"));
      playSound("purchase");
    };
    grid.appendChild(card);
  });
}

function equipShopItem(item){
  if(item.type==="skin")save.equippedSkin=item.id;
  if(item.type==="effect")save.equippedEffect=item.id;
  if(item.type==="crosshair")save.equippedCrosshair=item.id;
  applyCrosshair();
}

function applyCrosshair(){
  const cross=document.getElementById("crosshair");
  if(!cross)return;
  const id=save.equippedCrosshair;
  cross.style.opacity=id==="cross_dot"?"1":".9";
  cross.style.transform="translate(-50%,-50%)";
  cross.style.border=id==="cross_circle"?"2px solid var(--green)":"none";
  cross.style.borderRadius=id==="cross_circle"?"50%":"0";
  cross.style.width=id==="cross_circle"?"30px":"28px";
  cross.style.height=id==="cross_circle"?"30px":"28px";
  cross.querySelector("::before");
  const lines=cross.querySelectorAll(".crosshair-dot");
  if(lines[0])lines[0].style.display=id==="cross_plus"?"none":"block";
}

/* =========================================================
   LEADERBOARD
========================================================= */

function renderLeaderboard(){
  document.getElementById("recordGames").textContent=number(save.games);
  document.getElementById("recordStreak").textContent=number(save.bestStreak);
  document.getElementById("recordShots").textContent=number(save.shots);
  document.getElementById("recordCoins").textContent=number(save.totalCoinsEarned);

  const list=document.getElementById("leaderboardList");
  list.innerHTML="";
  const history=[...save.history].sort((a,b)=>b.score-a.score);

  if(!history.length){
    list.innerHTML='<p class="muted" style="font-size:11px">No games played yet. Start your first training session!</p>';
    return;
  }

  history.slice(0,10).forEach((g,i)=>{
    const row=document.createElement("div");
    row.className="leaderboard-row";
    row.innerHTML=`<strong>#${i+1}</strong><span>${g.mode} · ${g.accuracy}% accuracy</span><strong style="text-align:right">${number(g.score)} pts</strong>`;
    list.appendChild(row);
  });
}

/* =========================================================
   SOUND
========================================================= */

let soundEnabled=true;
let audioContext=null;

function audio(){
  if(!audioContext){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC)audioContext=new AC();
  }
  if(audioContext?.state==="suspended")audioContext.resume();
  return audioContext;
}

function tone(freq,duration,type="sine",volume=.04,endFreq=null){
  if(!soundEnabled)return;
  const ctx=audio();
  if(!ctx)return;
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.type=type;
  osc.frequency.setValueAtTime(freq,ctx.currentTime);
  if(endFreq)osc.frequency.exponentialRampToValueAtTime(Math.max(1,endFreq),ctx.currentTime+duration);
  gain.gain.setValueAtTime(volume,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime+duration);
}

function playSound(type){
  if(type==="shoot")tone(170,.07,"square",.025,75);
  if(type==="hit")tone(620,.1,"sine",.05,1100);
  if(type==="miss")tone(110,.09,"triangle",.025,65);
  if(type==="purchase"){
    tone(480,.09,"sine",.04,750);
    setTimeout(()=>tone(750,.12,"sine",.04,950),80);
  }
  if(type==="level"){
    tone(400,.2,"sine",.04,700);
    setTimeout(()=>tone(700,.25,"sine",.04,1100),130);
  }
}

window.toggleSound=function(){
  soundEnabled=!soundEnabled;
  document.getElementById("soundButton").textContent=soundEnabled?"♫ SOUND ON":"♫ SOUND OFF";
  if(soundEnabled)playSound("purchase");
};

/* =========================================================
   THREE.JS ARENA
========================================================= */

const canvas=document.getElementById("gameCanvas");
const renderer=new THREE.WebGLRenderer({
  canvas,antialias:true,alpha:false,
  powerPreference:"high-performance"
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x08111d);
scene.fog=new THREE.Fog(0x08111d,16,55);

const camera=new THREE.PerspectiveCamera(68,1,.1,100);
camera.position.set(0,2.2,9);
camera.rotation.order="YXZ";
camera.lookAt(0,2,0);

scene.add(new THREE.HemisphereLight(0xa7c5ff,0x172033,1.5));

const mainLight=new THREE.DirectionalLight(0xffffff,2.1);
mainLight.position.set(-4,9,7);
mainLight.castShadow=true;
scene.add(mainLight);

const greenLight=new THREE.PointLight(0x65f5ac,18,18);
greenLight.position.set(-7,4,-5);
scene.add(greenLight);

const blueLight=new THREE.PointLight(0x397fff,20,18);
blueLight.position.set(7,4,-7);
scene.add(blueLight);

const world=new THREE.Group();
scene.add(world);

function material(color,roughness=.7,metalness=.1,emissive=0){
  return new THREE.MeshStandardMaterial({
    color,roughness,metalness,
    emissive,
    emissiveIntensity:emissive?1.3:0
  });
}

const floorMat=material(0x121d2b,.85,.2);
const wallMat=material(0x172335,.8,.15);
const darkMat=material(0x080f19,.8,.1);
const neonMat=material(0x65f5ac,.35,.2,0x65f5ac);

const floor=new THREE.Mesh(new THREE.PlaneGeometry(70,70),floorMat);
floor.rotation.x=-Math.PI/2;
floor.receiveShadow=true;
world.add(floor);

const backWall=new THREE.Mesh(new THREE.BoxGeometry(38,12,1),wallMat);
backWall.position.set(0,5,-14);
backWall.receiveShadow=true;
world.add(backWall);

function addBox(x,y,z,sx,sy,sz,mat){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat);
  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  world.add(mesh);
  return mesh;
}

/* =========================================================
   TARGETS, BOSSES AND PARTICLES
========================================================= */

const targets=[];
const targetGroup=new THREE.Group();
world.add(targetGroup);

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2(0,0);

const particles=[];
const particleGroup=new THREE.Group();
world.add(particleGroup);

const tracers=[];

function createTarget(){
  const boss=game.bossPending;
  if(boss)game.bossPending=false;

  const group=new THREE.Group();
  const size=boss?1.25:(game.mode==="precision"?.43:.7);
  const hp=boss?Math.ceil(18+game.wave*5):Math.max(1,Math.ceil(1+game.wave*.22));
  const bodyMat=new THREE.MeshStandardMaterial({
    color:boss?0xff536a:0xe9f2ff,
    roughness:.32,
    metalness:.65,
    emissive:boss?0x5b0718:0x000000,
    emissiveIntensity:boss?1.4:0
  });

  const body=new THREE.Mesh(new THREE.SphereGeometry(size,32,24),bodyMat);
  body.castShadow=true;
  body.userData.target=true;
  group.add(body);

  const ring=new THREE.Mesh(
    new THREE.TorusGeometry(size*.8,.055,10,48),
    new THREE.MeshStandardMaterial({
      color:boss?0xff536a:0x65f5ac,
      emissive:boss?0xff173d:0x65f5ac,
      emissiveIntensity:1.8,
      metalness:.5,
      roughness:.3
    })
  );
  ring.rotation.x=Math.PI/2;
  group.add(ring);

  const inner=new THREE.Mesh(
    new THREE.SphereGeometry(size*.25,16,16),
    new THREE.MeshStandardMaterial({
      color:0xffffff,
      emissive:boss?0xff536a:0x65f5ac,
      emissiveIntensity:2
    })
  );
  inner.userData.target=true;
  group.add(inner);

  group.position.set(
    (Math.random()-.5)*11,
    1.5+Math.random()*3.4,
    -4-Math.random()*6
  );

  group.userData={
    baseX:group.position.x,
    baseY:group.position.y,
    speed:(.5+Math.random()*1.2)*(1+game.wave*.035),
    phase:Math.random()*6,
    amplitude:.3+Math.random()*.9,
    active:true,
    hp,maxHp:hp,boss,
    radius:size,
    ring
  };

  group.traverse(obj=>{
    if(obj.isMesh)obj.userData.parentTarget=group;
  });

  targetGroup.add(group);
  targets.push(group);

  if(boss)notify("⚠ BOSS TARGET · "+hp+" HP");
  return group;
}

function removeTarget(target){
  if(!target)return;
  targetGroup.remove(target);
  target.traverse(obj=>{
    if(obj.geometry)obj.geometry.dispose();
    if(obj.material){
      if(Array.isArray(obj.material))obj.material.forEach(m=>m.dispose());
      else obj.material.dispose();
    }
  });
  const i=targets.indexOf(target);
  if(i>=0)targets.splice(i,1);
}

function clearTargets(){
  [...targets].forEach(removeTarget);
}

function spawnParticles(position,color=0x65f5ac,count=15){
  const item=SHOP_ITEMS.find(x=>x.id===save.equippedEffect);
  if(item?.id==="effect_plasma")color=0xb28aff;
  if(item?.id==="effect_fire")color=0xffd166;

  for(let i=0;i<count;i++){
    const mesh=new THREE.Mesh(
      new THREE.SphereGeometry(.035+Math.random()*.045,6,6),
      new THREE.MeshBasicMaterial({color})
    );
    mesh.position.copy(position);
    particleGroup.add(mesh);
    particles.push({
      mesh,
      velocity:new THREE.Vector3((Math.random()-.5)*5,Math.random()*4,(Math.random()-.5)*4),
      life:.35+Math.random()*.4
    });
  }
}

function updateParticles(delta){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life-=delta;
    p.mesh.position.addScaledVector(p.velocity,delta);
    p.velocity.y-=8*delta;
    p.mesh.scale.multiplyScalar(.97);
    if(p.life<=0){
      particleGroup.remove(p.mesh);
      p.mesh.geometry.dispose();
      p.mesh.material.dispose();
      particles.splice(i,1);
    }
  }
}

function createTracer(from,to,color){
  const geometry=new THREE.BufferGeometry().setFromPoints([from,to]);
  const line=new THREE.Line(
    geometry,
    new THREE.LineBasicMaterial({color,transparent:true,opacity:.95})
  );
  world.add(line);
  tracers.push({line,life:.09});
}

  game.kills=0;
  game.shots=0;
  game.hits=0;
  game.streak=0;
  game.bestStreak=0;

/* =========================================================
   AIM AND SHOOT INPUT
========================================================= */

let pointerLocked=false;
let firingInterval=null;

document.addEventListener("pointerlockchange",()=>{
  pointerLocked=document.pointerLockElement===canvas;
});

canvas.addEventListener("pointerdown",e=>{
  if(!game.active||paused)return;

  if(e.pointerType!=="touch"&&!pointerLocked){
    canvas.requestPointerLock?.();
  }

  const rect=canvas.getBoundingClientRect();
  if(e.pointerType==="touch"||!pointerLocked){
    pointer.x=((e.clientX-rect.left)/rect.width)*2-1;
    pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;
  }else{
    pointer.set(0,0);
  }

  shoot();

  if(getWeapon().automatic){
    clearInterval(firingInterval);
    firingInterval=setInterval(()=>{
      if(game.active&&!paused)shoot();
    },Math.max(65,getShotInterval()));
  }
});

["pointerup","pointercancel","pointerleave"].forEach(event=>{
  canvas.addEventListener(event,()=>clearInterval(firingInterval));
});

document.addEventListener("mousemove",e=>{
  if(!pointerLocked||!game.active||paused)return;
  const sensitivity=.0018/(1+getUpgrade("stability")*.045);
  camera.rotation.y-=e.movementX*sensitivity;
  camera.rotation.x-=e.movementY*sensitivity;
  camera.rotation.x=Math.max(-.65,Math.min(.65,camera.rotation.x));
});

document.addEventListener("keydown",e=>{
  if(e.code==="Escape"&&game.active)document.exitPointerLock?.();

  if(!game.active||paused)return;

  if(e.code==="KeyR"){
    // Reload restarts the training session.
    window.reloadGame();
  }

  const index=Number(e.key)-1;
  if(index>=0&&index<WEAPONS.length){
    const weapon=WEAPONS[index];
    if(save.ownedWeapons.includes(weapon.id)){
      save.weapon=weapon.id;
      persist();
      notify(weapon.name+" equipped.");
    }
  }
});

/* =========================================================
   WEAPON FIRING AND TARGET DAMAGE
========================================================= */

function getShotInterval(){
  return getWeapon().interval/(1+getUpgrade("fire")*.08);
}

function shoot(){
  if(!game.active||paused)return;

  const now=performance.now();
  const weapon=getWeapon();
  if(now-game.lastShot<getShotInterval())return;
  game.lastShot=now;

  game.shots++;
  save.shots++;
  playSound("shoot");

  const origin=camera.position.clone();
  const direction=new THREE.Vector3();
  camera.getWorldDirection(direction);
  const end=origin.clone().add(direction.multiplyScalar(35));

  raycaster.setFromCamera(pointer,camera);
  raycaster.far=35;

  const hitList=raycaster.intersectObjects(targetGroup.children,true);
  if(hitList.length){
    const hit=hitList[0];
    const target=hit.object.userData.parentTarget;
    if(target&&target.userData.active){
      handleHit(target,hit.point);
      end.copy(hit.point);
    }else{
      game.streak=0;
      playSound("miss");
    }
  }else{
    game.streak=0;
    playSound("miss");
  }

  createTracer(origin,end,weapon.color);
  updateArenaStats();
  persist();
}

function handleHit(target,point){
  if(!target||!target.userData.active)return;

  const d=target.userData;
  const weapon=getWeapon();
  const damage=weapon.power*(1+getUpgrade("damage")*.28);
  d.hp=Math.max(0,d.hp-damage);

  game.hits++;
  save.hits++;
  game.streak++;
  game.bestStreak=Math.max(game.bestStreak,game.streak);

  const precisionBonus=game.mode==="precision"?1.5:1;
  const streakBonus=1+Math.min(game.streak,30)*.025;
  const scoreGain=Math.floor(35*weapon.power*precisionBonus*streakBonus*(1+getUpgrade("focus")*.07));
  game.score+=scoreGain;

  spawnParticles(point,weapon.color,d.boss?18:9);
  playSound("hit");
  showHitMarker();

  if(d.hp<=0){
    d.active=false;
    game.kills++;
    save.kills++;

    const reward=Math.floor(
      save.config.coinsPerKill*
      MODES[game.mode].reward*
      (1+getUpgrade("reward")*.1)*
      (d.boss?12:1)
    );

    const xp=Math.floor(
      save.config.xpPerKill*
      (1+getUpgrade("xp")*.1)*
      (d.boss?10:1)
    );

    save.coins+=reward;
    save.totalCoinsEarned+=reward;
    addXP(xp);

    if(d.boss){
      notify("BOSS DEFEATED! +"+number(reward)+" coins · +"+number(xp)+" XP");
      game.wave++;
      game.bossPending=true;
    }else if(game.kills%10===0){
      game.wave++;
      game.bossPending=true;
      notify("WAVE "+game.wave+" · BOSS INCOMING!");
    }else if(game.streak%5===0){
      notify(game.streak+" HIT STREAK!");
    }

    setTimeout(()=>removeTarget(target),80);

    setTimeout(()=>{
      if(game.active&&!paused&&targets.length<MODES[game.mode].maxTargets){
        createTarget();
      }
    },d.boss?700:180);

    checkAchievements();
    refreshDaily();
    save.dailyProgress.kills++;
  }else{
    // A damaged target flashes and its ring shrinks to show remaining health.
    d.ring.scale.setScalar(Math.max(.25,d.hp/d.maxHp));
    d.ring.material.color.setHex(d.boss?0xff536a:0xffd166);
    target.scale.setScalar(.94+Math.random()*.12);
  }

  updateArenaStats();
  persist();
}

function showHitMarker(){
  const marker=document.getElementById("hitMarker");
  marker.classList.remove("show");
  void marker.offsetWidth;
  marker.classList.add("show");
}

/* =========================================================
   GAME REWARDS AND SESSION END
========================================================= */

function updateArenaStats(){
  document.getElementById("arenaHint").textContent=game.active?
    "SCORE: "+number(game.score)+" · STREAK: "+game.streak+" · WAVE: "+game.wave:
    "CLICK START TO PLAY";
}

function endGame(){
  if(!game.active||game.resultShown)return;

  game.active=false;
  paused=false;
  pauseButton.textContent="Ⅱ PAUSE";
  game.resultShown=true;
  clearInterval(firingInterval);
  document.exitPointerLock?.();

  const accuracyValue=game.shots?Math.round(game.hits/game.shots*100):0;
  const completionBonus=Math.floor(game.score/100);
  const coinReward=completionBonus;
  const xpReward=Math.floor(game.kills*save.config.xpPerKill*(1+getUpgrade("xp")*.1));

  save.coins+=coinReward;
  save.totalCoinsEarned+=coinReward;
  addXP(xpReward);

  save.games++;
  save.best=Math.max(save.best,game.score);
  save.bestStreak=Math.max(save.bestStreak,game.bestStreak);

  refreshDaily();
  save.dailyProgress.games++;
  save.dailyProgress.score+=game.score;

  save.history.push({
    mode:MODES[game.mode].name,
    score:game.score,
    accuracy:accuracyValue,
    kills:game.kills,
    date:new Date().toISOString()
  });
  save.history=save.history.slice(-50);

  checkAchievements();
  persist();
  renderMissions();

  document.getElementById("gameOverlay").classList.remove("hidden");
  document.getElementById("gameOverlay").innerHTML=`
    <div class="eyebrow">TRAINING SESSION COMPLETE</div>
    <h2>SESSION <span style="color:var(--green)">OVER</span></h2>
    <div class="game-score">${number(game.score)}</div>
    <p>
      ${number(game.kills)} targets destroyed · ${accuracyValue}% accuracy<br>
      ${number(coinReward)} coins · ${number(xpReward)} XP<br>
      Best streak: ${game.bestStreak} · Wave reached: ${game.wave}
    </p>
    <button class="btn btn-primary" onclick="startGame()">PLAY AGAIN →</button>
  `;

  document.getElementById("arenaHint").textContent="SESSION COMPLETE";
  document.getElementById("arenaTimer").textContent="TIME: 0s";
  notify("Session complete!");
}

/* =========================================================
   GAME UPDATE AND DIFFICULTY
========================================================= */

function updateGame(delta){
  if(!game.active||paused)return;

  game.elapsed+=delta;
  game.remaining-=delta;

  if(game.remaining<=0){
    game.remaining=0;
    endGame();
    return;
  }

  game.spawnTimer+=delta*1000;
  const base=Math.max(300,save.config.spawnRate);
  const difficulty=Math.max(.48,1-game.wave*.025);
  game.spawnInterval=(game.mode==="speed"?base*.65:base)*difficulty;

  if(game.spawnTimer>=game.spawnInterval&&targets.length<MODES[game.mode].maxTargets){
    game.spawnTimer=0;
    createTarget();
  }

  document.getElementById("arenaTimer").textContent="TIME: "+Math.ceil(game.remaining)+"s";
}

/* =========================================================
   MAIN ANIMATION LOOP
========================================================= */

const clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);

  const delta=Math.min(clock.getDelta(),.05);
  const elapsed=clock.elapsedTime;

  for(const target of targets){
    if(!target.userData.active)continue;
    const d=target.userData;

    const speed=d.speed*(1+game.wave*.025);
    if(game.mode==="flick"){
      target.position.x=d.baseX+Math.sin(elapsed*speed*2+d.phase)*d.amplitude;
      target.position.y=d.baseY+Math.cos(elapsed*speed*1.5)*d.amplitude*.5;
    }else{
      target.position.x=d.baseX+Math.sin(elapsed*speed+d.phase)*d.amplitude;
      target.position.y=d.baseY+Math.sin(elapsed*speed*1.3+d.phase)*.3;
    }

    target.rotation.y+=delta*(d.boss?.45:.65);
    target.rotation.z=Math.sin(elapsed+d.phase)*.1;
  }

  for(let i=tracers.length-1;i>=0;i--){
    const t=tracers[i];
    t.life-=delta;
    t.line.material.opacity=Math.max(0,t.life/.09);
    if(t.life<=0){
      world.remove(t.line);
      t.line.geometry.dispose();
      t.line.material.dispose();
      tracers.splice(i,1);
    }
  }

  updateParticles(delta);
  updateGame(delta);

  decorativeLights.forEach((light,i)=>{
    light.intensity=7+Math.sin(elapsed*1.5+i)*2;
  });

  renderer.render(scene,camera);
}
animate();

function requireAdmin(){
  if(!adminUnlocked){
    notify("Administrator authentication required.",true);
    return false;
  }
  return true;
}

window.adminApply=function(){
  if(!requireAdmin())return;

  const value=id=>document.getElementById(id).value;
  if(value("adminCoins")!=="")save.coins=Math.max(0,save.coins+(Number(value("adminCoins"))||0));
  if(value("adminLevel")!=="")save.level=Math.max(1,Math.floor(Number(value("adminLevel"))||1));
  if(value("adminXP")!=="")save.xp=Math.max(0,save.xp+(Number(value("adminXP"))||0));
  if(value("adminName").trim())save.name=value("adminName").trim().slice(0,20);
  if(value("adminKills")!=="")save.kills=Math.max(0,save.kills+(Number(value("adminKills"))||0));
  if(value("adminScore")!=="")save.best=Math.max(0,Number(value("adminScore"))||0);

  while(save.xp>=xpNeeded()){
    save.xp-=xpNeeded();
    save.level++;
  }

  checkAchievements();
  persist();
  renderProfile();
  notify("Administrator changes applied.");

  ["adminCoins","adminLevel","adminXP","adminName","adminKills","adminScore"].forEach(id=>{
    document.getElementById(id).value="";
  });
};

window.adminUnlockAll=function(){
  if(!requireAdmin())return;
  save.ownedWeapons=WEAPONS.map(w=>w.id);
  save.weapon="quantum";
  checkAchievements();
  persist();
  renderWeapons();
  notify("All weapons unlocked.");
};

  save.ownedItems=SHOP_ITEMS.map(i=>i.id);

};

window.adminSaveConfig=function(){
  if(!requireAdmin())return;

  const coins=Number(document.getElementById("configCoins").value);
  const xp=Number(document.getElementById("configXP").value);
  const duration=Number(document.getElementById("configDuration").value);

window.exportSave=function(){
  const blob=new Blob([JSON.stringify(save,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="aim-rush-save.json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  notify("Save exported.");
};

window.importSave=function(event){
  const file=event.target.files?.[0];
  if(!file)return;

  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!data||typeof data!=="object"||!Array.isArray(data.ownedWeapons)){
        throw new Error("Invalid save");
      }

      const base=freshSave();
      save={
        ...base,...data,
        upgrades:{...base.upgrades,...(data.upgrades||{})},
        config:{...DEFAULT_CONFIG,...(data.config||{})},
        ownedWeapons:data.ownedWeapons.filter(id=>WEAPONS.some(w=>w.id===id)),
        ownedItems:Array.isArray(data.ownedItems)?data.ownedItems.filter(id=>SHOP_ITEMS.some(i=>i.id===id)):[],
        history:Array.isArray(data.history)?data.history.slice(-50):[],
        achievements:Array.isArray(data.achievements)?data.achievements:[]
      };

      if(!save.ownedWeapons.includes("pistol"))save.ownedWeapons.unshift("pistol");
      if(!save.ownedWeapons.includes(save.weapon))save.weapon="pistol";

      persist();
      renderProfile();
      renderMissions();
      notify("Save imported successfully.");
    }catch(e){
      notify("Unable to import this save.",true);
    }
    event.target.value="";
  };
  reader.readAsText(file);
};

window.confirmReset=function(){
  showModal(
    "RESET PROGRESSION",
    "Are you sure you want to reset all your coins, weapons, levels and statistics? This action cannot be undone.",
    "RESET",
    ()=>{
      save=freshSave();
      persist();
      renderProfile();
      renderMissions();
      renderWeapons();
      renderUpgrades();
      renderShop();
      renderLeaderboard();
      notify("Progression reset.");
    }
  );
};

/* =========================================================
   MODALS
========================================================= */

function showModal(title,description,confirmText,callback){
  const backdrop=document.getElementById("modalBackdrop");
  const content=document.getElementById("modalContent");

  content.innerHTML=`
    <h2>${title}</h2>
    <p>${description}</p>
    <div class="modal-actions">
      <button class="btn" id="modalCancel">CANCEL</button>
      <button class="btn btn-danger" id="modalConfirm">${confirmText}</button>
    </div>
  `;

  backdrop.classList.add("open");
  document.getElementById("modalCancel").onclick=()=>backdrop.classList.remove("open");
  document.getElementById("modalConfirm").onclick=()=>{
    backdrop.classList.remove("open");
    callback();
  };
}

document.getElementById("modalBackdrop").addEventListener("click",e=>{
  if(e.target.id==="modalBackdrop")e.currentTarget.classList.remove("open");
});

/* =========================================================
   INITIALIZATION
========================================================= */

function initializeModes(){
  document.querySelectorAll(".mode-button").forEach(button=>{
    button.classList.toggle("selected",button.dataset.mode===game.mode);
  });
  document.getElementById("arenaMode").textContent=MODES[game.mode].name;
  document.getElementById("arenaTimer").textContent="TIME: "+modeDuration()+"s";
}

function initialize(){
  refreshDaily();
  initializeModes();
  renderWeapons();
  renderUpgrades();
  renderShop();
  renderLeaderboard();
  renderProfile();
  renderMissions();
  updateUI();
  console.log("AIM RUSH — game initialized.");
}

initialize();
</script>

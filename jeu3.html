<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NEON DRIVE — Open World</title>
<style>
:root{
  --bg:#071016;--panel:rgba(8,17,24,.94);--line:rgba(139,220,255,.25);
  --cyan:#4de3ff;--gold:#ffc857;--red:#ff526b;--green:#69ffb0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:#fff;touch-action:none}
button{font:inherit;color:#fff;border:1px solid var(--line);background:rgba(12,29,39,.95);border-radius:9px;padding:10px 13px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97);background:#174253}
button:focus{outline:none}
canvas{display:block}
#game{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none}
.ui{pointer-events:auto}
#topLeft{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:7px}
#topRight{position:absolute;top:10px;right:10px;display:flex;gap:7px;align-items:flex-start}
#repair{background:rgba(20,70,48,.95);border-color:#69ffb0}
#menuBtn{background:rgba(18,30,45,.95)}
#speedBox{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);min-width:160px;text-align:center;padding:10px 18px;background:rgba(4,13,19,.8);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(8px)}
#speed{font-size:34px;font-weight:900;letter-spacing:1px}
#unit{font-size:10px;letter-spacing:3px;color:#8ab5c5}
#carName{font-size:12px;color:var(--cyan);margin-top:5px}
#status{position:absolute;left:12px;bottom:12px;font-size:11px;color:#b8d4df;text-shadow:0 2px 4px #000}
#minimapWrap{position:absolute;top:95px;left:10px;width:190px;height:140px;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:rgba(0,0,0,.7);pointer-events:auto}
#minimap{width:100%;height:100%}
#mapLabel{position:absolute;top:78px;left:13px;font-size:10px;color:#a8d5e6;letter-spacing:2px;text-shadow:0 2px 4px #000}
#zoomControls{position:absolute;left:10px;top:240px;display:flex;gap:5px}
#zoomControls button{padding:6px 10px;font-size:12px}
#missionBanner{position:absolute;top:12px;left:50%;transform:translateX(-50%);padding:9px 14px;border-radius:10px;background:rgba(5,15,23,.85);border:1px solid var(--line);text-align:center;max-width:55%;font-size:12px}
#missionBanner strong{color:var(--gold)}
#targetArrow{position:absolute;top:50%;left:50%;width:54px;height:54px;margin:-27px 0 0 -27px;display:none;filter:drop-shadow(0 2px 5px #000)}
#targetArrow svg{width:100%;height:100%;overflow:visible}
#targetArrow path{fill:var(--gold);stroke:#17120a;stroke-width:2}
#touchControls{position:absolute;bottom:18px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.touchGroup{display:flex;gap:8px;pointer-events:auto}
.touchBtn{width:60px;height:60px;border-radius:50%;font-size:23px;background:rgba(8,24,34,.72);border:1px solid rgba(130,220,255,.4);display:grid;place-items:center;touch-action:none}
.touchBtn.wide{width:76px;height:60px;border-radius:17px;font-size:13px;font-weight:bold}
.touchBtn.active{background:rgba(37,127,154,.9)}
#driftBtn{border-color:#ffbd5c;color:#ffce7c}
#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(1,7,12,.78);backdrop-filter:blur(8px);pointer-events:auto;padding:16px}
#overlay.show{display:flex}
.panel{width:min(820px,96vw);max-height:92vh;overflow:auto;background:linear-gradient(145deg,#101f2b,#07121a);border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:0 20px 80px #0009}
.panel h1{font-size:24px;margin:0 0 6px;letter-spacing:2px}
.panel h2{font-size:15px;color:var(--cyan);margin:19px 0 9px}
.sub{font-size:12px;color:#9bb8c7;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:11px;padding:12px;background:rgba(255,255,255,.025)}
.card h3{font-size:14px;margin:0 0 6px}
.card p{font-size:12px;line-height:1.45;color:#a9c1cc;margin:4px 0 10px}
.card button{width:100%}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0}
.row label{font-size:12px;color:#b7ced9}
.row input[type=range]{width:48%;accent-color:var(--cyan)}
.row input[type=number]{width:105px;padding:7px;border-radius:6px;background:#07131c;color:#fff;border:1px solid var(--line)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.primary{background:#0b5269;border-color:#4de3ff}
.danger{background:#55202a;border-color:#ff526b}
.green{background:#15472f;border-color:#69ffb0}
#racePreview{width:100%;height:auto;aspect-ratio:2/1;background:#13261f;border:1px solid var(--line);border-radius:10px;display:block;margin:12px 0}
#teleportMap{width:100%;height:auto;aspect-ratio:5/3;background:#14241d;border:1px solid var(--line);border-radius:10px;display:block;touch-action:manipulation}
#raceTimer{font-size:28px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
#raceHud{display:none;position:absolute;top:60px;left:50%;transform:translateX(-50%);text-align:center;background:#06121bdc;border:1px solid var(--line);padding:7px 15px;border-radius:10px;pointer-events:none}
#raceHud strong{font-size:24px;color:var(--gold);font-variant-numeric:tabular-nums}
#helpText{font-size:12px;line-height:1.7;color:#bed0d9}
#toast{position:absolute;top:65px;left:50%;transform:translateX(-50%);background:#071821ed;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:12px;display:none;pointer-events:none;text-align:center}
@media(max-width:650px){
 #minimapWrap{width:130px;height:96px;top:91px}
 #mapLabel{top:76px;font-size:9px}
 #zoomControls{top:192px}
 #zoomControls button{padding:5px 8px}
 #missionBanner{top:auto;bottom:92px;max-width:62%;font-size:10px}
 #speedBox{bottom:88px;min-width:110px;padding:7px 12px}
 #speed{font-size:26px}
 .touchBtn{width:53px;height:53px}
 .touchBtn.wide{width:62px;height:53px}
 #status{display:none}
 #topRight button{padding:8px;font-size:11px}
 #topLeft button{padding:8px;font-size:11px}
 .panel{padding:14px}
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="topLeft" class="ui">
    <button id="repair">✚ RÉPARER</button>
  </div>
  <div id="topRight" class="ui">
    <button id="carsBtn">🚘 VOITURES</button>
    <button id="missionsBtn">🏁 MISSIONS</button>
    <button id="adminBtn">⚙ ADMIN</button>
    <button id="menuBtn">⌂ MENU</button>
  </div>
  <div id="mapLabel">CARTE DU MONDE</div>
  <div id="minimapWrap"><canvas id="minimap"></canvas></div>
  <div id="zoomControls" class="ui">
    <button id="zoomOut">−</button><button id="zoomIn">+</button><button id="zoomAll">TOUT</button>
  </div>
  <div id="missionBanner">EXPLORATION LIBRE · <strong>Choisis ta route</strong></div>
  <div id="targetArrow"><svg viewBox="0 0 60 60"><path d="M30 2 L48 25 L36 22 L36 49 L24 49 L24 22 L12 25 Z"/></svg></div>
  <div id="speedBox">
    <div id="speed">0</div><div id="unit">KM/H</div><div id="carName">SPORTIVE</div>
  </div>
  <div id="status">MONDE OUVERT · EXPLORATION LIBRE</div>
  <div id="raceHud"><div id="raceHudLabel">TOUR 1 / 3</div><strong id="raceHudTime">00:00.000</strong></div>
  <div id="toast"></div>
  <div id="touchControls">
    <div class="touchGroup">
      <button class="touchBtn" id="leftBtn">◀</button>
      <button class="touchBtn" id="rightBtn">▶</button>
    </div>
    <div class="touchGroup">
      <button class="touchBtn wide" id="brakeBtn">FREIN</button>
      <button class="touchBtn wide" id="gasBtn">ACCÉL.</button>
      <button class="touchBtn wide" id="driftBtn">DRIFT</button>
    </div>
  </div>
</div>
<div id="overlay" class="show">
  <div class="panel" id="panelContent"></div>
</div>

<script>
"use strict";

/* =========================================================
   NEON DRIVE — monde ouvert + mode course indépendant
   Modifie MENU_URL pour pointer vers ta page de jeux.
========================================================= */
const MENU_URL = "https://clemsupp.github.io/mediatheque-site/";
const $ = id => document.getElementById(id);
const game = $("game"), ctx = game.getContext("2d");
const mini = $("minimap"), mctx = mini.getContext("2d");
const overlay = $("overlay"), panel = $("panelContent");

let W=innerWidth,H=innerHeight,DPR=1;
function resize(){
  W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);
  game.width=Math.floor(W*DPR);game.height=Math.floor(H*DPR);
  game.style.width=W+"px";game.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  mini.width=mini.clientWidth*DPR;mini.height=mini.clientHeight*DPR;
  mctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);resize();

const WORLD={w:12000,h:9000};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const rand=(a,b)=>a+Math.random()*(b-a);
const fmtTime=ms=>{
  ms=Math.max(0,Math.floor(ms));
  const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60,mm=ms%1000;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")+"."+String(mm).padStart(3,"0");
};

let mode="world",cameraMode="top",paused=false,overlayOpen=true;
let mapZoom=.12,adminTeleport=false;
let toastUntil=0;
function toast(t){$("toast").textContent=t;$("toast").style.display="block";toastUntil=performance.now()+2300}
function closeOverlay(){overlay.classList.remove("show");overlayOpen=false}
function showPanel(html){panel.innerHTML=html;overlay.classList.add("show");overlayOpen=true}
function goMenu(){location.href=MENU_URL}
$("menuBtn").onclick=goMenu;

/* ------------------------ Véhicules ------------------------ */
const carTypes=[
 {id:"city",name:"CITADINE",color:"#59d8f5",length:34,width:17,mass:1.05,engine:205,reverse:55,accel:180,brake:250,grip:1.1,turn:2.5,drift:1.1,description:"Agile en ville, vitesse modérée."},
 {id:"sport",name:"SPORTIVE",color:"#ff526b",length:40,width:19,mass:.85,engine:310,reverse:70,accel:240,brake:310,grip:1.0,turn:2.15,drift:1.3,description:"Rapide, puissante et précise sur route."},
 {id:"drift",name:"DRIFT",color:"#c6a1ff",length:42,width:20,mass:.9,engine:285,reverse:65,accel:225,brake:290,grip:.72,turn:2.45,drift:2.1,description:"Arrière joueur, idéale pour les grands dérapages."},
 {id:"truck",name:"CAMION LONG",color:"#ffbd55",length:78,width:23,mass:2.1,engine:170,reverse:38,accel:105,brake:180,grip:1.15,turn:1.35,drift:.7,description:"Très long, accélération lente et remorque articulée."}
];
let carIndex=1;
function makeCar(x,y,angle=0,index=carIndex){
 const t=carTypes[index];
 return {x,y,angle,vx:0,vy:0,angleSpeed:0,health:100,type:index,
   trailerAngle:angle,trailerX:x-Math.cos(angle)*t.length*.95,
   trailerY:y-Math.sin(angle)*t.length*.95,
   steering:0,drifting:false,skid:0};
}
let player=makeCar(1900,2050,0,carIndex);
let police=[],particles=[],tireMarks=[];
let input={gas:false,brake:false,left:false,right:false,drift:false};
let cam={x:player.x,y:player.y,zoom:1};
let admin={
 maxSpeed:1,acceleration:1,grip:1,steering:1,grassPenalty:.68,
 policeSpeed:.78,showDebug:false
};

/* -------------------------- Carte --------------------------- */
const roads=[],parks=[],lakes=[],buildings=[],trees=[],mountains=[];
function addRoad(points,width,type="road"){
 roads.push({points,width,type});
}
function buildMap(){
 roads.length=parks.length=lakes.length=buildings.length=trees.length=mountains.length=0;

 // Artères principales : grands axes lisibles, pas de quadrillage partout.
 addRoad([{x:500,y:1800},{x:2300,y:1800},{x:4100,y:1800},{x:6500,y:1800},{x:9300,y:1800},{x:11500,y:1800}],120,"highway");
 addRoad([{x:2700,y:500},{x:2700,y:1800},{x:2700,y:3200},{x:2700,y:4600}],82,"road");
 addRoad([{x:6500,y:1800},{x:6500,y:3000},{x:6500,y:4400},{x:8000,y:5400}],88,"road");
 addRoad([{x:500,y:3900},{x:1700,y:3900},{x:2700,y:3300},{x:3900,y:3400},{x:5100,y:4100},{x:6500,y:4400}],72,"road");
 addRoad([{x:800,y:6200},{x:2500,y:5900},{x:4000,y:6300},{x:5700,y:6700},{x:7700,y:6300},{x:9700,y:5600},{x:11500,y:6000}],76,"road");
 addRoad([{x:9300,y:1800},{x:9300,y:3100},{x:9900,y:4100},{x:9700,y:5600}],75,"road");
 addRoad([{x:6500,y:4400},{x:8200,y:4000},{x:9900,y:4100}],66,"road");
 addRoad([{x:500,y:1800},{x:900,y:1100},{x:1800,y:800},{x:2700,y:500}],60,"country");
 addRoad([{x:800,y:6200},{x:600,y:7600},{x:2200,y:8200},{x:4300,y:8000},{x:5700,y:6700}],65,"country");
 addRoad([{x:7700,y:6300},{x:8400,y:7600},{x:10100,y:7900},{x:11500,y:7400}],68,"country");
 addRoad([{x:9300,y:3100},{x:10800,y:3000},{x:11500,y:3600}],58,"country");

 // Petites rues de ville, limitées à quelques quartiers.
 for(let x=900;x<=2200;x+=420) addRoad([{x,y:2050},{x,y:3000}],25,"street");
 for(let y=2200;y<=3000;y+=400) addRoad([{x:800,y},{x:2400,y}],25,"street");
 for(let x=3000;x<=4300;x+=450) addRoad([{x,y:2050},{x,y:2950}],23,"street");
 for(let y=2200;y<=2900;y+=350) addRoad([{x:2900,y},{x:4500,y}],23,"street");

 parks.push({x:4700,y:2300,w:1100,h:850});
 parks.push({x:1200,y:4700,w:1300,h:700});
 parks.push({x:7200,y:2500,w:750,h:800});
 lakes.push({x:4900,y:5100,rx:650,ry:420});
 lakes.push({x:10500,y:6700,rx:450,ry:300});

 // Bâtiments décoratifs : aucun obstacle en mode monde ouvert.
 for(const p of parks){
   for(let i=0;i<38;i++) trees.push({x:rand(p.x,p.x+p.w),y:rand(p.y,p.y+p.h),r:rand(8,17)});
 }
 for(let x=750;x<4500;x+=180){
   for(let y=2020;y<3100;y+=190){
     if(Math.random()<.2)continue;
     if(roads.some(r=>nearRoad(x,y,r,75)))continue;
     buildings.push({x,y,w:rand(65,120),h:rand(60,115),color:["#425361","#354654","#5b6268","#34424c"][Math.floor(rand(0,4))]});
   }
 }
 // Campagne, vergers, bois et reliefs.
 for(let i=0;i<420;i++){
   const x=rand(250,11700),y=rand(250,8700);
   if(nearRoad(x,y,null,150)||parks.some(p=>x>p.x&&x<p.x+p.w&&y>p.y&&y<p.y+p.h))continue;
   trees.push({x,y,r:rand(7,20)});
 }
 for(let i=0;i<24;i++){
   const x=rand(6500,11300),y=rand(300,1450);
   mountains.push({x,y,r:rand(180,450),h:rand(40,130),seed:rand(0,100)});
 }
}
function nearRoad(x,y,road=null,margin=50){
 const list=road?[road]:roads;
 for(const r of list)for(let i=1;i<r.points.length;i++){
   const a=r.points[i-1],b=r.points[i],dx=b.x-a.x,dy=b.y-a.y;
   const t=clamp(((x-a.x)*dx+(y-a.y)*dy)/(dx*dx+dy*dy),0,1);
   if(Math.hypot(x-a.x-t*dx,y-a.y-t*dy)<r.width/2+margin)return true;
 }
 return false;
}
buildMap();

/* -------------------------- Course -------------------------- */
const race={
 active:false,finished:false,start:0,elapsed:0,lap:1,laps:3,checkpoint:0,
 lastCheckpoint:-1,view:"top",x:0,y:0,
 // Circuit dessiné en points : longues lignes droites et virages variés.
 points:[
  {x:600,y:700},{x:1800,y:700},{x:2700,y:850},{x:3150,y:1400},
  {x:3050,y:2200},{x:2550,y:2750},{x:1700,y:2850},
  {x:800,y:2600},{x:450,y:2000},{x:500,y:1200}
 ],
 width:175
};
function racePoint(i){return race.points[(i+race.points.length)%race.points.length]}
function raceStartPos(){
 const a=race.points[0],b=race.points[1];
 return {x:a.x,y:a.y-30,angle:Math.atan2(b.y-a.y,b.x-a.x)};
}
function raceReset(){
 const p=raceStartPos();
 player=makeCar(p.x,p.y,p.angle,carIndex);
 police=[];
 race.active=true;race.finished=false;race.start=performance.now();
 race.elapsed=0;race.lap=1;race.checkpoint=1;race.lastCheckpoint=0;
 mode="race";cameraMode=race.view;cam.zoom=1.1;
 $("raceHud").style.display="block";
 $("missionBanner").innerHTML="CIRCUIT · <strong>Drifte dans les virages</strong>";
 closeOverlay();
}
function startRacePreview(){
 mode="preview";
 showPanel(`
  <h1>🏁 CONTRE-LA-MONTRE</h1>
  <div class="sub">Un circuit indépendant du monde ouvert. Barrières physiques, grandes lignes droites et virages où le drift est utile.</div>
  <canvas id="racePreview" width="800" height="400"></canvas>
  <div class="grid">
   <div class="card"><h3>VUE DU DESSUS</h3><p>Tu vois la voiture, la piste et les prochaines courbes.</p><button id="raceTop" class="primary">Choisir cette vue</button></div>
   <div class="card"><h3>PREMIÈRE PERSONNE</h3><p>Caméra proche du pare-brise, route en perspective.</p><button id="raceFirst">Choisir cette vue</button></div>
  </div>
  <div class="actions"><button id="raceGo" class="green">DÉMARRER LA COURSE</button><button id="raceBack">Retour au monde</button></div>
 `);
 drawRacePreview($("racePreview").getContext("2d"),800,400);
 $("raceTop").onclick=()=>{race.view="top";cameraMode="top";toast("Vue du dessus sélectionnée")};
 $("raceFirst").onclick=()=>{race.view="first";cameraMode="first";toast("Vue première personne sélectionnée")};
 $("raceGo").onclick=()=>{race.view=cameraMode;raceReset()};
 $("raceBack").onclick=()=>{mode="world";closeOverlay()};
}
function drawRacePreview(c,w,h){
 c.clearRect(0,0,w,h);c.fillStyle="#244b35";c.fillRect(0,0,w,h);
 // Herbe texturée
 for(let i=0;i<700;i++){c.fillStyle=i%2?"#2b553b":"#2b5038";c.fillRect(Math.random()*w,Math.random()*h,2,2)}
 const pts=race.points.map(p=>({x:80+(p.x-400)/3400*(w-160),y:35+(p.y-600)/2600*(h-70)}));
 function path(){c.beginPath();c.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)c.lineTo(pts[i].x,pts[i].y);c.closePath()}
 c.lineCap="round";c.lineJoin="round";c.strokeStyle="#151c20";c.lineWidth=58;path();c.stroke();
 c.strokeStyle="#a6b2b7";c.lineWidth=49;path();c.stroke();
 c.strokeStyle="#343f46";c.lineWidth=43;path();c.stroke();
 c.strokeStyle="#e8e6d4";c.lineWidth=2;c.setLineDash([14,12]);path();c.stroke();c.setLineDash([]);
 // Départ et flèche de sens
 const a=pts[0],b=pts[1],ang=Math.atan2(b.y-a.y,b.x-a.x);
 c.save();c.translate(a.x,a.y);c.rotate(ang);c.fillStyle="#fff";for(let i=0;i<8;i++){c.fillStyle=i%2?"#111":"#fff";c.fillRect(-4,-24+i*6,8,6)}c.restore();
 c.fillStyle="#69ffb0";c.beginPath();c.arc(a.x,a.y-16,6,0,Math.PI*2);c.fill();
 c.fillStyle="#fff";c.font="bold 13px Arial";c.fillText("DÉPART / ARRIVÉE",a.x+10,a.y-20);
 c.fillStyle="#ffc857";c.font="bold 12px Arial";c.fillText("CIRCUIT • 3 TOURS",15,22);
}

/* ----------------------- Caméra / route -------------------- */
function worldToScreen(x,y){
 return {x:(x-cam.x)*cam.zoom+W/2,y:(y-cam.y)*cam.zoom+H/2};
}
function screenToWorld(x,y){
 return {x:(x-W/2)/cam.zoom+cam.x,y:(y-H/2)/cam.zoom+cam.y};
}
function roadSurface(x,y){
 for(const r of roads)if(nearRoad(x,y,r,0))return r.type;
 return "grass";
}
function updateCamera(dt){
 const targetZoom=mode==="race"?1.05:cam.zoom;
 cam.x=lerp(cam.x,player.x,Math.min(1,dt*5));
 cam.y=lerp(cam.y,player.y,Math.min(1,dt*5));
 if(mode==="race"&&cameraMode==="first"){
   cam.x=player.x+Math.cos(player.angle)*90;
   cam.y=player.y+Math.sin(player.angle)*90;
 }
}

/* ---------------------- Physique voiture ------------------- */
function updateCar(c,dt,playerControlled=false){
 const t=carTypes[c.type];
 const fwdX=Math.cos(c.angle),fwdY=Math.sin(c.angle);
 const sideX=-fwdY,sideY=fwdX;
 let forward=c.vx*fwdX+c.vy*fwdY;
 let lateral=c.vx*sideX+c.vy*sideY;
 const throttle=playerControlled?(input.gas?1:0):1;
 const braking=playerControlled?(input.brake?1:0):0;
 const steer=playerControlled?((input.right?1:0)-(input.left?1:0)):0;
 const drift=playerControlled&&input.drift&&Math.abs(forward)>22;
 c.drifting=drift;

 const surface=mode==="race"?"road":roadSurface(c.x,c.y);
 const offRoad=surface==="grass";
 const grassFactor=offRoad?admin.grassPenalty:1;
 const speedFactor=clamp(Math.abs(forward)/100,.10,1.05);
 const steerStrength=t.turn*admin.steering*(drift?t.drift:1);
 // Les roues directrices tournent, mais la caisse ne pivote que si elle roule.
 const signedDirection=Math.abs(forward)<2?0:Math.sign(forward);
 const effectiveSteer=steerStrength*steer*speedFactor*signedDirection;
 const maxV=t.engine*admin.maxSpeed*grassFactor;
 const accel=t.accel*admin.acceleration*grassFactor/t.mass;

 if(playerControlled){
   if(throttle)forward+=accel*dt;
   if(braking){
     if(Math.abs(forward)>4)forward-=Math.sign(forward)*t.brake*dt;
     else forward-=t.accel*.65*dt;
   }
 }else{
   const target=clamp(Math.hypot(player.x-c.x,player.y-c.y)*.9,75,t.engine*.78*admin.policeSpeed);
   forward+=clamp(target-forward,-accel*.45*dt,accel*.45*dt);
 }
 forward=clamp(forward,-t.reverse,maxV);

 // Direction dépendante de la vitesse. Le drift permet de garder plus de rotation.
 c.angleSpeed=lerp(c.angleSpeed,effectiveSteer*(.9+Math.min(Math.abs(forward)/85,1.2)),Math.min(1,dt*5));
 c.angle+=c.angleSpeed*dt;

 // Adhérence latérale : le drift conserve davantage de vitesse sur le côté.
 const grip=t.grip*admin.grip*(drift?.20:1.0);
 lateral*=Math.max(0,1-grip*dt*(drift?1.5:5.5));
 const drag=offRoad?1.7:0.65;
 forward*=Math.max(0,1-drag*dt*(Math.abs(forward)>3?1:0));
 c.vx=Math.cos(c.angle)*forward+sideX*lateral;
 c.vy=Math.sin(c.angle)*forward+sideY*lateral;

 // Les véhicules restent dans le monde.
 c.x=clamp(c.x+c.vx*dt,70,WORLD.w-70);
 c.y=clamp(c.y+c.vy*dt,70,WORLD.h-70);

 // Camion articulé : la remorque suit avec retard, surtout dans les virages.
 if(c.type===3){
   let diff=Math.atan2(Math.sin(c.angle-c.trailerAngle),Math.cos(c.angle-c.trailerAngle));
   c.trailerAngle+=diff*Math.min(1,dt*1.8);
   c.trailerX=c.x-Math.cos(c.trailerAngle)*t.length*.9;
   c.trailerY=c.y-Math.sin(c.trailerAngle)*t.length*.9;
 }else{
   c.trailerAngle=c.angle;c.trailerX=c.x;c.trailerY=c.y;
 }
 c.steering=steer;
 if(drift&&Math.abs(forward)>45&&Math.random()<.22){
   tireMarks.push({x:c.x-fwdX*12,y:c.y-fwdY*12,a:c.angle,life:7});
   if(tireMarks.length>700)tireMarks.shift();
 }
 c.skid=drift?Math.min(1,c.skid+dt*3):Math.max(0,c.skid-dt*2);
}
function updatePolice(dt){
 for(const p of police){
   const dx=player.x-p.x,dy=player.y-p.y;
   const desired=Math.atan2(dy,dx);
   let diff=Math.atan2(Math.sin(desired-p.angle),Math.cos(desired-p.angle));
   p.angle+=clamp(diff,-1.25*dt,1.25*dt);
   // Police légèrement plus lente que la sportive et soumise aux mêmes terrains.
   const terrain=mode==="world"&&roadSurface(p.x,p.y)==="grass";
   const max=carTypes[p.type].engine*admin.policeSpeed*(terrain?admin.grassPenalty:1);
   const f=Math.cos(p.angle)*p.vx+Math.sin(p.angle)*p.vy;
   p.vx=Math.cos(p.angle)*lerp(f,max,Math.min(1,dt*.65));
   p.vy=Math.sin(p.angle)*lerp(f,max,Math.min(1,dt*.65));
   p.x=clamp(p.x+p.vx*dt,60,WORLD.w-60);
   p.y=clamp(p.y+p.vy*dt,60,WORLD.h-60);
 }
}
function updateRaceWalls(){
 if(mode!=="race"||!race.active)return;
 // Barrières du circuit : si on sort du corridor, on est repoussé vers la piste.
 const p={x:player.x,y:player.y};
 let best=Infinity,closest=null,seg=null;
 for(let i=0;i<race.points.length;i++){
   const a=racePoint(i),b=racePoint(i+1),dx=b.x-a.x,dy=b.y-a.y;
   const t=clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy),0,1);
   const q={x:a.x+t*dx,y:a.y+t*dy},d=dist(p,q);
   if(d<best){best=d;closest=q;seg={a,b}}
 }
 const limit=race.width*.5-14;
 if(best>limit&&closest){
   const nx=(p.x-closest.x)/(best||1),ny=(p.y-closest.y)/(best||1);
   player.x=closest.x+nx*limit;player.y=closest.y+ny*limit;
   const vn=player.vx*nx+player.vy*ny;
   if(vn>0){player.vx-=nx*vn*1.8;player.vy-=ny*vn*1.8}
   player.vx*=.72;player.vy*=.72;
   if(player.health>0)player.health=Math.max(0,player.health-.4);
 }
}
function updateRace(dt){
 if(!race.active)return;
 race.elapsed=performance.now()-race.start;
 const target=racePoint(race.checkpoint);
 if(Math.hypot(player.x-target.x,player.y-target.y)<race.width*.72){
   race.lastCheckpoint=race.checkpoint;
   race.checkpoint++;
   if(race.checkpoint>=race.points.length){
     race.checkpoint=0;race.lap++;
     if(race.lap>race.laps){
       race.active=false;race.finished=true;
       showRaceResult();
     }
   }
 }
 $("raceHudLabel").textContent=`TOUR ${Math.min(race.lap,race.laps)} / ${race.laps}`;
 $("raceHudTime").textContent=fmtTime(race.elapsed);
 updateRaceWalls();
}

 ctx.fillStyle="#101820";ctx.beginPath();ctx.moveTo(0,H*.88);ctx.lineTo(W*.25,H*.75);ctx.lineTo(W*.75,H*.75);ctx.lineTo(W,H*.88);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
 ctx.strokeStyle="#273b45";ctx.lineWidth=12;ctx.beginPath();ctx.arc(W*.5,H*.98,Math.min(W*.13,90),Math.PI,Math.PI*2);ctx.stroke();
 ctx.strokeStyle="#9aaeb8";ctx.lineWidth=5;ctx.beginPath();ctx.arc(W*.5,H*.98,Math.min(W*.13,90),Math.PI,Math.PI*2);ctx.stroke();
 ctx.fillStyle="#cde5ec";ctx.font="bold 14px Arial";ctx.fillText(Math.round(speed*3.6)+" KM/H",W*.5-35,H*.86);
}
function draw(){
 ctx.setTransform(DPR,0,0,DPR,0,0);
 if(mode==="race"&&cameraMode==="first"){drawFirstPerson()}
 else{
   if(mode==="race")drawRaceWorld();else drawWorld();
   drawTireMarks();
   for(const p of police)drawCar(p,false);
   drawCar(player,true);
   if(mode==="race"){
     const cp=racePoint(race.checkpoint),sp=worldToScreen(cp.x,cp.y);
     ctx.strokeStyle="#ffc857";ctx.lineWidth=3;ctx.beginPath();ctx.arc(sp.x,sp.y,18*cam.zoom,0,Math.PI*2);ctx.stroke();
   }
 }
 drawMiniMap();
}

/* --------------------------- Minimap ------------------------ */
function drawMiniMap(){
 const w=mini.clientWidth,h=mini.clientHeight;
 mctx.setTransform(DPR,0,0,DPR,0,0);mctx.clearRect(0,0,w,h);
 mctx.fillStyle="#1d392a";mctx.fillRect(0,0,w,h);
 const sx=w/WORLD.w,sy=h/WORLD.h;
 for(const p of parks){mctx.fillStyle="#3b7045";mctx.fillRect(p.x*sx,p.y*sy,p.w*sx,p.h*sy)}
 for(const l of lakes){mctx.fillStyle="#3b899b";mctx.beginPath();mctx.ellipse(l.x*sx,l.y*sy,l.rx*sx,l.ry*sy,0,0,Math.PI*2);mctx.fill()}
 for(const r of roads){
   mctx.beginPath();mctx.moveTo(r.points[0].x*sx,r.points[0].y*sy);
   for(let i=1;i<r.points.length;i++)mctx.lineTo(r.points[i].x*sx,r.points[i].y*sy);
   mctx.strokeStyle=r.type==="highway"?"#d6d2bd":"#727e80";
   mctx.lineWidth=Math.max(1,r.width*sx);mctx.stroke();
 }
 if(mode==="race"){
   mctx.beginPath();mctx.moveTo(race.points[0].x*sx,race.points[0].y*sy);
   for(let i=1;i<race.points.length;i++)mctx.lineTo(race.points[i].x*sx,race.points[i].y*sy);
   mctx.closePath();mctx.strokeStyle="#ffc857";mctx.lineWidth=2;mctx.stroke();
 }
 for(const p of police){mctx.fillStyle="#ff526b";mctx.beginPath();mctx.arc(p.x*sx,p.y*sy,2.5,0,Math.PI*2);mctx.fill()}
 mctx.fillStyle="#fff";mctx.beginPath();mctx.arc(player.x*sx,player.y*sy,3.5,0,Math.PI*2);mctx.fill();
 mctx.strokeStyle="#fff";mctx.lineWidth=1;mctx.beginPath();mctx.moveTo(player.x*sx,player.y*sy);mctx.lineTo((player.x+Math.cos(player.angle)*180)*sx,(player.y+Math.sin(player.angle)*180)*sy);mctx.stroke();
}

/* -------------------------- Flèche -------------------------- */
function updateArrow(){
 const el=$("targetArrow");
 if(mode!=="race"||!race.active){el.style.display="none";return}
 const target=racePoint(race.checkpoint);
 const dx=target.x-player.x,dy=target.y-player.y;
 const desired=Math.atan2(dy,dx);
 let angle=desired-player.angle+Math.PI/2;
 angle=Math.atan2(Math.sin(angle),Math.cos(angle));
 el.style.display="block";
 // Flèche collée en bord d'écran, rotation vers le prochain checkpoint.
 const radius=Math.min(W,H)*.34;
 const x=W/2+Math.sin(angle)*radius,y=H/2-Math.cos(angle)*radius;
 el.style.left=clamp(x,35,W-35)+"px";
 el.style.top=clamp(y,35,H-35)+"px";
 el.style.transform=`rotate(${angle}rad)`;
}

/* ----------------------- Menus du jeu ----------------------- */
function mainMenu(){
 mode="world";race.active=false;$("raceHud").style.display="none";
 showPanel(`<h1>NEON DRIVE</h1><div class="sub">MONDE OUVERT · CONDUITE · DRIFT · COURSE</div>
 <div class="grid">
  <div class="card"><h3>🌍 MONDE OUVERT</h3><p>Ville, routes de campagne, forêts, montagnes et grands axes.</p><button class="primary" id="continue">JOUER</button></div>
  <div class="card"><h3>🏁 CONTRE-LA-MONTRE</h3><p>Un circuit séparé, des barrières et un vrai chrono au millième.</p><button id="raceMenu">CHOISIR LE CIRCUIT</button></div>
  <div class="card"><h3>🚘 VÉHICULES</h3><p>Citadine, sportive, drift et camion articulé.</p><button id="carsMenu">CHOISIR UNE VOITURE</button></div>
  <div class="card"><h3>⚙ ADMIN</h3><p>Réglages de conduite, téléportation et dézoom.</p><button id="adminMenu">OUVRIR ADMIN</button></div>
 </div>
 <h2>COMMANDES</h2><div id="helpText">Z / ↑ : accélérer · S / ↓ : freiner ou reculer · Q / ← et D / → : tourner · ESPACE : drift · R : réparer · Échap : menu.</div>`);
 $("continue").onclick=()=>{mode="world";closeOverlay()};
 $("raceMenu").onclick=startRacePreview;
 $("carsMenu").onclick=carMenu;
 $("adminMenu").onclick=adminMenu;
}
function carMenu(){
 showPanel(`<h1>CHOISIR UNE VOITURE</h1><div class="sub">Chaque véhicule possède sa propre physique et une silhouette différente.</div>
 <div class="grid">${carTypes.map((t,i)=>`<div class="card"><h3 style="color:${t.color}">${t.name}</h3><p>${t.description}</p><p>Vitesse : ${t.engine} · Accélération : ${t.accel}</p><button data-car="${i}" class="${i===carIndex?"primary":""}">CHOISIR</button></div>`).join("")}</div>
 <div class="actions"><button id="carsBack">RETOUR</button></div>`);
 panel.querySelectorAll("[data-car]").forEach(b=>b.onclick=()=>{
   carIndex=Number(b.dataset.car);
   player=makeCar(player.x,player.y,player.angle,carIndex);
   toast(carTypes[carIndex].name+" sélectionnée");carMenu();
 });
 $("carsBack").onclick=mainMenu;
}
function adminMenu(){
 showPanel(`<h1>⚙ ADMIN</h1><div class="sub">Réglages appliqués en direct. Les bâtiments ne bloquent pas la voiture en monde ouvert.</div>
 <div class="row"><label>Vitesse maximale × <b id="vLabel">${admin.maxSpeed.toFixed(2)}</b></label><input id="vRange" type="range" min=".4" max="1.8" step=".05" value="${admin.maxSpeed}"></div>
 <div class="row"><label>Accélération × <b id="aLabel">${admin.acceleration.toFixed(2)}</b></label><input id="aRange" type="range" min=".4" max="2.5" step=".05" value="${admin.acceleration}"></div>
 <div class="row"><label>Adhérence × <b id="gLabel">${admin.grip.toFixed(2)}</b></label><input id="gRange" type="range" min=".3" max="2" step=".05" value="${admin.grip}"></div>
 <div class="row"><label>Direction × <b id="sLabel">${admin.steering.toFixed(2)}</b></label><input id="sRange" type="range" min=".4" max="2" step=".05" value="${admin.steering}"></div>
 <div class="row"><label>Vitesse police × <b id="pLabel">${admin.policeSpeed.toFixed(2)}</b></label><input id="pRange" type="range" min=".3" max="1" step=".05" value="${admin.policeSpeed}"></div>
 <div class="row"><label>Ralentissement hors route</label><input id="grassRange" type="range" min=".4" max=".95" step=".05" value="${admin.grassPenalty}"></div>
 <div class="actions">
  <button class="primary" id="teleportBtn">📍 TÉLÉPORTER</button>
  <button id="zoomAllAdmin">VOIR TOUTE LA CARTE</button>
  <button id="spawnPolice">AJOUTER LA POLICE</button>
  <button id="clearPolice">RETIRER LA POLICE</button>
  <button id="adminReset">RÉGLAGES PAR DÉFAUT</button>
  <button id="adminBack">FERMER</button>
 </div>`);
 const bind=(id,key,label)=>{
   $(id).oninput=e=>{admin[key]=Number(e.target.value);$(label).textContent=admin[key].toFixed(2)};
 };
 bind("vRange","maxSpeed","vLabel");bind("aRange","acceleration","aLabel");
 bind("gRange","grip","gLabel");bind("sRange","steering","sLabel");bind("pRange","policeSpeed","pLabel");
 $("grassRange").oninput=e=>admin.grassPenalty=Number(e.target.value);
 $("teleportBtn").onclick=teleportMenu;
 $("zoomAllAdmin").onclick=()=>{cam.zoom=Math.min(W/WORLD.w,H/WORLD.h)*.92;cam.x=WORLD.w/2;cam.y=WORLD.h/2;toast("Carte complète affichée")};
 $("spawnPolice").onclick=()=>{for(let i=0;i<3;i++)police.push(makeCar(player.x-rand(220,450),player.y-rand(220,450),rand(0,6),0));toast("Police ajoutée")};
 $("clearPolice").onclick=()=>{police=[];toast("Police retirée")};
 $("adminReset").onclick=()=>{admin={maxSpeed:1,acceleration:1,grip:1,steering:1,grassPenalty:.68,policeSpeed:.78,showDebug:false};adminMenu()};
 $("adminBack").onclick=()=>{closeOverlay()};
}
function teleportMenu(){
 adminTeleport=true;
 showPanel(`<h1>📍 TÉLÉPORTATION</h1><div class="sub">Clique sur un endroit de la grande carte. La voiture apparaîtra à proximité, sans être bloquée par les bâtiments.</div>
 <canvas id="teleportMap" width="1000" height="600"></canvas>
 <div class="actions"><button id="teleCancel">ANNULER</button></div>`);
 const c=$("teleportMap"),tc=c.getContext("2d");
 function drawTeleport(){
   const w=c.width,h=c.height,sx=w/WORLD.w,sy=h/WORLD.h;
   tc.fillStyle="#31543b";tc.fillRect(0,0,w,h);
   for(const p of parks){tc.fillStyle="#3e7546";tc.fillRect(p.x*sx,p.y*sy,p.w*sx,p.h*sy)}
   for(const l of lakes){tc.fillStyle="#3b899b";tc.beginPath();tc.ellipse(l.x*sx,l.y*sy,l.rx*sx,l.ry*sy,0,0,Math.PI*2);tc.fill()}
   for(const r of roads){
     tc.beginPath();tc.moveTo(r.points[0].x*sx,r.points[0].y*sy);
     for(let i=1;i<r.points.length;i++)tc.lineTo(r.points[i].x*sx,r.points[i].y*sy);
     tc.strokeStyle="#505a5c";tc.lineWidth=Math.max(1,r.width*sx);tc.stroke();
   }
   for(const m of mountains){tc.fillStyle="#607661";tc.beginPath();tc.arc(m.x*sx,m.y*sy,m.r*sx,0,Math.PI*2);tc.fill()}
   tc.fillStyle="#fff";tc.beginPath();tc.arc(player.x*sx,player.y*sy,9,0,Math.PI*2);tc.fill();
   tc.strokeStyle="#fff";tc.lineWidth=2;tc.stroke();
 }
 drawTeleport();
 c.onclick=e=>{
   const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*WORLD.w,y=(e.clientY-r.top)/r.height*WORLD.h;
   player.x=clamp(x,100,WORLD.w-100);player.y=clamp(y,100,WORLD.h-100);
   player.vx=0;player.vy=0;player.angle=0;cam.x=player.x;cam.y=player.y;
   adminTeleport=false;closeOverlay();toast("Téléportation effectuée");
 };
 $("teleCancel").onclick=()=>{adminTeleport=false;adminMenu()};
}

/* ------------------------- Missions ------------------------- */
function missionsMenu(){
 showPanel(`<h1>MISSIONS</h1><div class="sub">Choisis une activité. La course utilise son propre circuit et ne modifie pas la carte ouverte.</div>
 <div class="grid">
  <div class="card"><h3>🏁 CONTRE-LA-MONTRE</h3><p>Trois tours, chronomètre précis, barrières et choix de caméra.</p><button class="primary" id="missionRace">OUVRIR LE CIRCUIT</button></div>
  <div class="card"><h3>📍 POINTS DE PASSAGE</h3><p>Une série de checkpoints dans la ville. La flèche reste au bord de l'écran.</p><button id="missionRoute">LANCER LE PARCOURS</button></div>
  <div class="card"><h3>🚔 POURSUITE</h3><p>Des voitures de police te poursuivent dans le monde ouvert.</p><button id="missionPolice">LANCER LA POURSUITE</button></div>
 </div><div class="actions"><button id="missionBack">RETOUR</button></div>`);
 $("missionRace").onclick=startRacePreview;
 $("missionRoute").onclick=()=>{startRoute();closeOverlay()};
 $("missionPolice").onclick=()=>{police=[];for(let i=0;i<3;i++)police.push(makeCar(player.x-rand(250,500),player.y-rand(200,400),rand(0,6),0));mode="world";closeOverlay();toast("Poursuite lancée")};
 $("missionBack").onclick=mainMenu;
}
let routeMission={active:false,index:0,points:[]};
function startRoute(){
 routeMission.points=[
  {x:2700,y:1800},{x:2100,y:2600},{x:3500,y:2850},
  {x:4700,y:2350},{x:6500,y:4400},{x:8200,y:4000}
 ];
 routeMission.index=0;routeMission.active=true;mode="world";
 $("missionBanner").innerHTML='CHECKPOINT <strong>1 / '+routeMission.points.length+'</strong>';
 toast("Parcours lancé : suis la flèche");
}
function updateRoute(){
 if(!routeMission.active)return;
 const p=routeMission.points[routeMission.index];
 if(Math.hypot(player.x-p.x,player.y-p.y)<110){
   routeMission.index++;
   if(routeMission.index>=routeMission.points.length){
     routeMission.active=false;$("missionBanner").innerHTML="PARCOURS TERMINÉ · <strong>Bien joué !</strong>";toast("Parcours terminé");return;
   }
   $("missionBanner").innerHTML=`CHECKPOINT <strong>${routeMission.index+1} / ${routeMission.points.length}</strong>`;
 }
}
function drawRouteMarker(){
 if(!routeMission.active||mode!=="world")return;
 const p=routeMission.points[routeMission.index],s=worldToScreen(p.x,p.y);
 ctx.save();ctx.strokeStyle="#ffc857";ctx.lineWidth=4;ctx.beginPath();ctx.arc(s.x,s.y,35*cam.zoom,0,Math.PI*2);ctx.stroke();
 ctx.beginPath();ctx.moveTo(s.x-20*cam.zoom,s.y);ctx.lineTo(s.x+20*cam.zoom,s.y);ctx.moveTo(s.x,s.y-20*cam.zoom);ctx.lineTo(s.x,s.y+20*cam.zoom);ctx.stroke();ctx.restore();
}
function updateRouteArrow(){
 const el=$("targetArrow");
 if(!routeMission.active||mode!=="world"){if(mode!=="race")el.style.display="none";return}
 const p=routeMission.points[routeMission.index];
 const desired=Math.atan2(p.y-player.y,p.x-player.x);
 const angle=desired-player.angle+Math.PI/2,r=Math.min(W,H)*.35;
 el.style.display="block";el.style.left=clamp(W/2+Math.sin(angle)*r,30,W-30)+"px";
 el.style.top=clamp(H/2-Math.cos(angle)*r,30,H-30)+"px";
 el.style.transform=`rotate(${angle}rad)`;
}

/* -------------------------- Contrôles ----------------------- */
function setInput(key,v){input[key]=v}
function bindHold(id,key){
 const b=$(id);
 const down=e=>{e.preventDefault();setInput(key,true);b.classList.add("active")};
 const up=e=>{e.preventDefault();setInput(key,false);b.classList.remove("active")};
 b.addEventListener("pointerdown",down);
 ["pointerup","pointercancel","pointerleave"].forEach(ev=>b.addEventListener(ev,up));
}
bindHold("leftBtn","left");bindHold("rightBtn","right");
bindHold("gasBtn","gas");bindHold("brakeBtn","brake");bindHold("driftBtn","drift");
addEventListener("keydown",e=>{
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
 if(e.key==="ArrowUp"||e.key.toLowerCase()==="z"||e.key.toLowerCase()==="w")input.gas=true;
 if(e.key==="ArrowDown"||e.key.toLowerCase()==="s")input.brake=true;
 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="q"||e.key.toLowerCase()==="a")input.left=true;
 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")input.right=true;
 if(e.key===" ")input.drift=true;
 if(e.key.toLowerCase()==="r")repair();
 if(e.key==="Escape"){if(overlayOpen)closeOverlay();else mainMenu()}
});
addEventListener("keyup",e=>{
 if(e.key==="ArrowUp"||e.key.toLowerCase()==="z"||e.key.toLowerCase()==="w")input.gas=false;
 if(e.key==="ArrowDown"||e.key.toLowerCase()==="s")input.brake=false;
 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="q"||e.key.toLowerCase()==="a")input.left=false;
 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")input.right=false;
 if(e.key===" ")input.drift=false;
});
function repair(){
 player.health=100;player.vx=0;player.vy=0;player.angleSpeed=0;
 toast("Voiture réparée");
}
$("repair").onclick=repair;
$("carsBtn").onclick=carMenu;
$("missionsBtn").onclick=missionsMenu;
$("adminBtn").onclick=adminMenu;
$("zoomIn").onclick=()=>cam.zoom=clamp(cam.zoom*1.25,.035,2.2);
$("zoomOut").onclick=()=>cam.zoom=clamp(cam.zoom/1.25,.035,2.2);
$("zoomAll").onclick=()=>{cam.zoom=Math.min(W/WORLD.w,H/WORLD.h)*.92;cam.x=WORLD.w/2;cam.y=WORLD.h/2};
$("minimapWrap").addEventListener("wheel",e=>{
 e.preventDefault();cam.zoom=clamp(cam.zoom*(e.deltaY>0?.88:1.12),.035,2.2);
},{passive:false});
$("minimapWrap").addEventListener("click",e=>{
 const r=mini.getBoundingClientRect();
 cam.x=(e.clientX-r.left)/r.width*WORLD.w;
 cam.y=(e.clientY-r.top)/r.height*WORLD.h;
});

/* ---------------------------- Boucle ----------------------- */
let last=performance.now();
function frame(now){
 const dt=Math.min(.04,(now-last)/1000||0);last=now;
 if(!overlayOpen&&!paused){
   updateCar(player,dt,true);
   updatePolice(dt);
   updateCamera(dt);
   if(mode==="race")updateRace(dt);else updateRoute();
   tireMarks.forEach(t=>t.life-=dt);
   tireMarks=tireMarks.filter(t=>t.life>0);
 }
 draw();
 drawRouteMarker();
 updateArrow();
 updateRouteArrow();
 const speed=Math.round(Math.hypot(player.vx,player.vy)*.36);
 $("speed").textContent=speed;
 $("carName").textContent=carTypes[carIndex].name;
 if(performance.now()>toastUntil)$("toast").style.display="none";
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* Initialisation */
cam.x=player.x;cam.y=player.y;
mainMenu();
</script>

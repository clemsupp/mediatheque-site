<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Bulles</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{
font-family:Arial,Helvetica,sans-serif;
background:#111;
color:#eee;
touch-action:none;
user-select:none;
-webkit-user-select:none
}
#game{
position:relative;
width:100%;
height:100%;
overflow:hidden;
background:radial-gradient(circle at center,#202020 0%,#111 75%)
}
header{
position:absolute;
top:0;
left:0;
width:100%;
height:75px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 25px;
z-index:10;
background:rgba(17,17,17,.75);
backdrop-filter:blur(8px);
border-bottom:1px solid #292929
}
.title{
font-family:Georgia,serif;
font-size:23px
}
.back{
border:1px solid #3a3a3a;
background:#202020;
color:#eee;
padding:10px 15px;
border-radius:5px;
font-size:13px;
text-decoration:none
}
#info{
position:absolute;
top:92px;
left:50%;
transform:translateX(-50%);
color:#777;
font-size:14px;
z-index:5;
white-space:nowrap
}
#score{
position:absolute;
bottom:28px;
left:50%;
transform:translateX(-50%);
font-size:15px;
color:#777;
z-index:5
}
.bubble{
position:absolute;
border-radius:50%;
transform:translate(-50%,-50%) scale(.1);
opacity:0;
background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.9) 0 5%,rgba(120,180,170,.65) 15%,rgba(49,91,87,.75) 60%,rgba(25,55,52,.9) 100%);
border:1px solid rgba(255,255,255,.25);
box-shadow:0 0 25px rgba(49,91,87,.35),inset 4px 4px 12px rgba(255,255,255,.18);
animation:appear .35s cubic-bezier(.2,1.4,.4,1) forwards;
z-index:3
}
.bubble:after{
content:"";
position:absolute;
width:18%;
height:18%;
border-radius:50%;
background:rgba(255,255,255,.55);
top:22%;
left:23%
}
.bubble.pop{
animation:pop .28s ease-out forwards
}
@keyframes appear{
0%{transform:translate(-50%,-50%) scale(.1);opacity:0}
70%{transform:translate(-50%,-50%) scale(1.08);opacity:1}
100%{transform:translate(-50%,-50%) scale(1);opacity:1}
}
@keyframes pop{
0%{transform:translate(-50%,-50%) scale(1);opacity:1}
100%{transform:translate(-50%,-50%) scale(1.5);opacity:0}
}
.ripple{
position:absolute;
width:10px;
height:10px;
border:2px solid rgba(255,255,255,.35);
border-radius:50%;
transform:translate(-50%,-50%);
animation:ripple .45s ease-out forwards;
pointer-events:none;
z-index:2
}
@keyframes ripple{
0%{width:10px;height:10px;opacity:.8}
100%{width:100px;height:100px;opacity:0}
}
.particle{
position:absolute;
width:5px;
height:5px;
border-radius:50%;
background:#9b7549;
pointer-events:none;
z-index:4;
animation:particle .45s ease-out forwards
}
@keyframes particle{
0%{transform:translate(-50%,-50%) scale(1);opacity:1}
100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(0);opacity:0}
}
#start,#end{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:rgba(17,17,17,.88);
z-index:20;
text-align:center
}
#end{display:none}
.box{
width:min(90%,430px);
padding:35px;
background:#191919;
border:1px solid #303030;
border-radius:10px;
box-shadow:0 20px 60px rgba(0,0,0,.4)
}
.box h1,.box h2{
font-family:Georgia,serif;
font-weight:normal;
margin-bottom:15px
}
.box h1{font-size:38px}
.box h2{font-size:34px}
.box p{
color:#888;
line-height:1.7;
font-size:14px;
margin-bottom:25px
}
.button{
border:0;
background:#315b57;
color:white;
padding:14px 28px;
border-radius:5px;
font-size:15px;
cursor:pointer
}
.button:active{transform:scale(.97)}
.result{
font-size:25px;
color:#9b7549;
margin-bottom:22px
}
@media(max-width:600px){
header{height:65px;padding:0 15px}
.title{font-size:19px}
.back{padding:8px 11px}
#info{top:82px;font-size:12px}
}
</style>
</head>

<body>

<div id="game">

<header>
<div class="title">Bulles</div>
<a class="back" href="index.html">← Jeux</a>
</header>

<div id="info">Éclate les bulles...</div>

<div id="score">Bulles éclatées : 0</div>

<div id="start">
<div class="box">
<h1>Bulles</h1>
<p>
Touche l'écran pour créer des bulles.<br>
Éclate-les et profite des animations.
</p>
<button class="button" onclick="startGame()">Commencer</button>
</div>
</div>

<div id="end">
<div class="box">
<h2>Terminé</h2>
<div class="result" id="finalScore">0 bulles</div>
<button class="button" onclick="startGame()">Rejouer</button>
</div>
</div>

</div>

<script>
const game=document.getElementById("game");
const start=document.getElementById("start");
const end=document.getElementById("end");
const info=document.getElementById("info");
const score=document.getElementById("score");
const finalScore=document.getElementById("finalScore");

let playing=false;
let bubbles=0;
let startTime=0;
let timer=null;

function startGame(){
start.style.display="none";
end.style.display="none";
playing=true;
bubbles=0;
startTime=performance.now();
score.textContent="Bulles éclatées : 0";
info.textContent="Éclate les bulles...";
clearTimeout(timer);
spawnBubble();
}

function createRipple(x,y){
const r=document.createElement("div");
r.className="ripple";
r.style.left=x+"px";
r.style.top=y+"px";
game.appendChild(r);
setTimeout(()=>r.remove(),500);
}

function createParticles(x,y){
for(let i=0;i<8;i++){
const p=document.createElement("div");
p.className="particle";
p.style.left=x+"px";
p.style.top=y+"px";

const angle=Math.random()*Math.PI*2;
const distance=25+Math.random()*45;

p.style.setProperty("--x",Math.cos(angle)*distance+"px");
p.style.setProperty("--y",Math.sin(angle)*distance+"px");

game.appendChild(p);
setTimeout(()=>p.remove(),500);
}
}

function popBubble(b){
if(b.dataset.popped)return;

b.dataset.popped="1";
bubbles++;
score.textContent="Bulles éclatées : "+bubbles;

const x=parseFloat(b.style.left);
const y=parseFloat(b.style.top);

b.classList.add("pop");
createRipple(x,y);
createParticles(x,y);

setTimeout(()=>b.remove(),300);

spawnBubble();
}

function spawnBubble(){
if(!playing)return;

const b=document.createElement("div");
b.className="bubble";

const size=35+Math.random()*70;

const minX=size/2+10;
const maxX=innerWidth-size/2-10;
const minY=110+size/2;
const maxY=innerHeight-size/2-30;

const x=minX+Math.random()*(maxX-minX);
const y=minY+Math.random()*(maxY-minY);

b.style.width=size+"px";
b.style.height=size+"px";
b.style.left=x+"px";
b.style.top=y+"px";

b.addEventListener("pointerdown",function(e){
e.preventDefault();
popBubble(b);
},{passive:false});

game.appendChild(b);

setTimeout(()=>{
if(b.parentNode&&!b.dataset.popped){
b.classList.add("pop");
setTimeout(()=>b.remove(),300);
spawnBubble();
}
},2200+Math.random()*1800);
}

function handleBackground(e){
if(!playing)return;

if(e.target===game){
const rect=game.getBoundingClientRect();
const x=e.clientX-rect.left;
const y=e.clientY-rect.top;

createRipple(x,y);
spawnBubble();
}
}

game.addEventListener("pointerdown",handleBackground,{passive:false});

window.addEventListener("resize",function(){
});

</script>

</body>
</html>

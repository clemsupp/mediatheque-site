<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attrape le carré</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    background:#111;
    color:#eee;
    font-family:Arial,Helvetica,sans-serif;

    overflow:hidden;
}

/* =========================
   HEADER
========================= */

.header{

    height:80px;

    background:#181818;

    border-bottom:1px solid #292929;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 30px;

}

.title{

    font-family:Georgia,serif;

    font-size:24px;

}

.back{

    border:1px solid #3a3a3a;

    background:#202020;

    color:#eee;

    padding:10px 16px;

    border-radius:5px;

    cursor:pointer;

    font-size:13px;

}

.back:hover{

    background:#2d2d2d;

}

/* =========================
   INFOS
========================= */

.info{

    height:75px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:70px;

    background:#151515;

    border-bottom:1px solid #292929;

}

.stat{

    text-align:center;

}

.stat-label{

    color:#777;

    font-size:11px;

    text-transform:uppercase;

    letter-spacing:2px;

    margin-bottom:5px;

}

.stat-value{

    font-size:20px;

    font-weight:bold;

}

/* =========================
   ZONE DE JEU
========================= */

.game-area{

    position:relative;

    width:100%;

    height:calc(100vh - 155px);

    background:#0d0d0d;

    overflow:hidden;

    cursor:crosshair;

}

/* =========================
   CARRE
========================= */

.target{

    position:absolute;

    width:70px;

    height:70px;

    background:white;

    border-radius:4px;

    cursor:pointer;

    box-shadow:
        0 0 20px rgba(255,255,255,.25);

    transition:
        width .1s,
        height .1s;

    display:none;

}

/* =========================
   ECRAN DE DEPART
========================= */

.start-screen{

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    gap:20px;

    background:#0d0d0d;

    z-index:10;

}

.start-title{

    font-family:Georgia,serif;

    font-size:42px;

    font-weight:normal;

}

.start-text{

    color:#888;

    font-size:15px;

}

.start-button{

    border:none;

    background:#315b57;

    color:white;

    padding:14px 28px;

    border-radius:5px;

    cursor:pointer;

    font-size:15px;

}

.start-button:hover{

    background:#234641;

}

/* =========================
   FIN
========================= */

.end-screen{

    position:absolute;

    inset:0;

    display:none;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    gap:15px;

    background:rgba(13,13,13,.96);

    z-index:20;

}

.end-title{

    font-family:Georgia,serif;

    font-size:42px;

}

.final-score{

    font-size:24px;

}

.best-score{

    color:#9b7549;

    font-size:15px;

}

.restart-button{

    margin-top:10px;

    border:none;

    background:#315b57;

    color:white;

    padding:13px 26px;

    border-radius:5px;

    cursor:pointer;

}

.restart-button:hover{

    background:#234641;

}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .header{

        padding:0 15px;

    }

    .title{

        font-size:19px;

    }

    .info{

        gap:25px;

    }

    .stat-value{

        font-size:17px;

    }

    .start-title{

        font-size:32px;

    }

}

</style>

</head>

<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="title">
        Attrape le carré
    </div>

    <button
        class="back"
        onclick="backToGames()"
    >
        ← Retour aux jeux
    </button>

</header>


<!-- =========================
     INFORMATIONS
========================= -->

<div class="info">

    <div class="stat">

        <div class="stat-label">
            Score
        </div>

        <div
            class="stat-value"
            id="score"
        >
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-label">
            Temps
        </div>

        <div
            class="stat-value"
            id="timer"
        >
            30
        </div>

    </div>


    <div class="stat">

        <div class="stat-label">
            Record
        </div>

        <div
            class="stat-value"
            id="best"
        >
            0
        </div>

    </div>

</div>


<!-- =========================
     ZONE DE JEU
========================= -->

<main
    class="game-area"
    id="gameArea"
>


    <!-- ECRAN DE DEPART -->

    <div
        class="start-screen"
        id="startScreen"
    >

        <div class="start-title">
            Attrape le carré
        </div>

        <div class="start-text">
            Tu as 30 secondes pour cliquer
            sur le carré le plus de fois possible.
        </div>

        <button
            class="start-button"
            onclick="startGame()"
        >
            Commencer
        </button>

    </div>


    <!-- CARRE -->

    <div
        class="target"
        id="target"
    >
    </div>


    <!-- ECRAN DE FIN -->

    <div
        class="end-screen"
        id="endScreen"
    >

        <div class="end-title">
            Temps écoulé !
        </div>

        <div
            class="final-score"
            id="finalScore"
        >
            Score : 0
        </div>

        <div
            class="best-score"
            id="finalBest"
        >
            Record : 0
        </div>

        <button
            class="restart-button"
            onclick="startGame()"
        >
            Rejouer
        </button>

    </div>

</main>


<script>

/* =========================
   VARIABLES
========================= */

let score = 0;

let timeLeft = 30;

let gameRunning = false;

let timerInterval = null;


/* =========================
   ELEMENTS
========================= */

const gameArea =
    document.getElementById(
        "gameArea"
    );

const target =
    document.getElementById(
        "target"
    );

const scoreElement =
    document.getElementById(
        "score"
    );

const timerElement =
    document.getElementById(
        "timer"
    );

const bestElement =
    document.getElementById(
        "best"
    );

const startScreen =
    document.getElementById(
        "startScreen"
    );

const endScreen =
    document.getElementById(
        "endScreen"
    );

const finalScore =
    document.getElementById(
        "finalScore"
    );

const finalBest =
    document.getElementById(
        "finalBest"
    );


/* =========================
   RECORD
========================= */

function getBest(){

    const best =
        localStorage.getItem(
            "attrapeCarreBest"
        );

    if(!best){
        return 0;
    }

    return Number(best);

}


function updateBestDisplay(){

    bestElement.textContent =
        getBest();

}


updateBestDisplay();


/* =========================
   POSITION ALEATOIRE
========================= */

function moveTarget(){

    const areaWidth =
        gameArea.clientWidth;

    const areaHeight =
        gameArea.clientHeight;


    const targetWidth =
        target.offsetWidth;

    const targetHeight =
        target.offsetHeight;


    const maxX =
        Math.max(
            0,
            areaWidth - targetWidth
        );


    const maxY =
        Math.max(
            0,
            areaHeight - targetHeight
        );


    const x =
        Math.random() * maxX;


    const y =
        Math.random() * maxY;


    target.style.left =
        x + "px";

    target.style.top =
        y + "px";

}


/* =========================
   TAILLE DU CARRE
========================= */

function updateTargetSize(){

    /*
     * Plus le score monte,
     * plus le carré devient petit.
     */

    const size =
        Math.max(
            20,
            70 - score * 2
        );


    target.style.width =
        size + "px";

    target.style.height =
        size + "px";

}


/* =========================
   DEMARRER
========================= */

function startGame(){

    clearInterval(
        timerInterval
    );


    score = 0;

    timeLeft = 30;

    gameRunning = true;


    scoreElement.textContent =
        "0";

    timerElement.textContent =
        "30";


    startScreen.style.display =
        "none";

    endScreen.style.display =
        "none";


    target.style.display =
        "block";


    target.style.width =
        "70px";

    target.style.height =
        "70px";


    moveTarget();


    timerInterval =
        setInterval(
            function(){

                timeLeft--;

                timerElement.textContent =
                    timeLeft;


                if(timeLeft <= 0){

                    endGame();

                }

            },
            1000
        );

}


/* =========================
   CLIQUER SUR LE CARRE
========================= */

target.addEventListener(
    "click",
    function(event){

        event.stopPropagation();


        if(!gameRunning){
            return;
        }


        score++;


        scoreElement.textContent =
            score;


        updateTargetSize();


        moveTarget();

    }
);


/* =========================
   FIN
========================= */

function endGame(){

    gameRunning = false;


    clearInterval(
        timerInterval
    );


    target.style.display =
        "none";


    const oldBest =
        getBest();


    let best =
        oldBest;


    if(score > oldBest){

        best = score;

        localStorage.setItem(
            "attrapeCarreBest",
            String(best)
        );

    }


    bestElement.textContent =
        best;


    finalScore.textContent =
        "Score : " + score;


    finalBest.textContent =
        "Record : " + best;


    endScreen.style.display =
        "flex";

}


/* =========================
   RETOUR MENU
========================= */

function backToGames(){

    window.location.href =
        "index.html";

}

</script>

</body>
</html>

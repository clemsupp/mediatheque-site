.obstacle{

0 3px 10px rgba(0,0,0,.4),
inset 0 1px rgba(255,255,255,.12);

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:650px){

}

<body>

<div id="game">

<div id="top">

<div id="title">
Liquide

← Jeux
</a>

</div>


<canvas id="canvas"></canvas>


<div id="hint">
Maintiens et glisse pour manipuler le liquide
</div>


<div id="controls">

<button class="liquid active" data-liquid="water">
Eau
</button>

<button class="liquid" data-liquid="lava">
Lave
</button>

<button class="liquid" data-liquid="oil">
Huile
</button>

</button>

</button>

Slime
</button>

<button class="tool active" data-tool="hand">

</button>

</button>

<div id="fps">
FPS : <span id="fpsValue">0</span>
</div>


<div id="start">

<div class="box">

<h1>
Liquide
</h1>

<p>
Choisis ton liquide puis manipule-le avec ta souris.
Avec le crayon, dessine des obstacles.
Avec la gomme, tu peux les supprimer.
</p>

<button class="start" onclick="startGame()">
Commencer
</button>

<script>


/* =========================================================
   CANVAS
========================================================= */

const canvas=document.getElementById("canvas");

const ctx=canvas.getContext("2d",{
alpha:false
});

let W=0;
let H=0;

function resize(){

W=innerWidth;
H=innerHeight;

canvas.width=W;
canvas.height=H;

}

resize();

window.addEventListener("resize",resize);


/* =========================================================
   LIQUIDES
========================================================= */

const liquids={

water:{
gravity:.17,
friction:.985,
push:1.5,
size:3,
color:"#3289a8",
light:"#a9edff",
dark:"#123f52",
alpha:.72
},

lava:{
gravity:.10,
friction:.992,
push:.65,
size:3.8,
color:"#d94d19",
light:"#ffd36a",
dark:"#5d1808",
alpha:.82
},

oil:{
gravity:.13,
friction:.993,
push:.75,
size:3.3,
color:"#726a45",
light:"#d5c98e",
dark:"#252215",
alpha:.72
},

milk:{
gravity:.18,
friction:.984,
push:1.15,
size:3.5,
color:"#d7d8d0",
light:"#ffffff",
dark:"#777a75",
alpha:.82
},

honey:{
gravity:.11,
friction:.996,
push:.48,
size:4,
color:"#d2951d",
light:"#ffe58a",
dark:"#633707",
alpha:.86
},

slime:{
gravity:.16,
friction:.989,
push:1.1,
size:3.6,
color:"#62b84c",
light:"#caff91",
dark:"#1d5b20",
alpha:.78
}

};

let current="water";


/* =========================================================
   OUTILS
========================================================= */

let currentTool="hand";

let particles=[];

let obstacles=[];

let waves=[];

let droplets=[];


/*
   On augmente le nombre de particules
   puisque tu as 60 FPS.
*/

const MAX_PARTICLES=2300;


/* =========================================================
   CRÉATION DES PARTICULES
========================================================= */

function createParticles(){

particles.length=0;

const l=liquids[current];

/*
   Le liquide commence plus haut qu'avant.
   Il reste donc bien visible et manipulable.
*/

const startY=Math.max(145,H*.34);

const bottom=H-145;


/*
   Espacement légèrement plus petit
   pour avoir beaucoup plus de liquide.
*/

const spacing=Math.max(
6,
Math.sqrt((W*(bottom-startY))/MAX_PARTICLES)
);

for(let y=startY;y<bottom;y+=spacing){

for(let x=18;x<W-18;x+=spacing){

if(particles.length>=MAX_PARTICLES){
break;
}

particles.push({

x:x+(Math.random()-.5)*2,

y:y+(Math.random()-.5)*2,

vx:(Math.random()-.5)*.15,

vy:(Math.random()-.5)*.1,

size:l.size*(.75+Math.random()*.45)

});

}

if(particles.length>=MAX_PARTICLES){
break;
}

}

}


/* =========================================================
   POINTER
========================================================= */

const pointer={

x:0,
y:0,

px:0,
py:0,

vx:0,
vy:0,

down:false

};

function pointerMove(x,y){

pointer.px=pointer.x;
pointer.py=pointer.y;

pointer.x=x;
pointer.y=y;

pointer.vx=x-pointer.px;
pointer.vy=y-pointer.py;

}


/* =========================================================
   OBSTACLES
========================================================= */

/*
   Un obstacle est une ligne composée
   de plusieurs petits segments.

   Cela permet d'avoir des formes libres.
*/

let drawingObstacle=null;

function startObstacle(x,y){

drawingObstacle={
points:[
{x:x,y:y}
]
};

}

function addObstaclePoint(x,y){

if(!drawingObstacle){
return;
}

const points=drawingObstacle.points;

const last=points[points.length-1];

const d=Math.hypot(
x-last.x,
y-last.y
);

if(d>7){

points.push({
x:x,
y:y
});

}

}

function finishObstacle(){

if(!drawingObstacle){
return;
}

if(drawingObstacle.points.length>=2){

obstacles.push({

points:drawingObstacle.points,

width:12

});

}

drawingObstacle=null;

}


/* =========================================================
   GOMME
========================================================= */

function eraseObstacle(x,y){

const radius=25;

for(let i=obstacles.length-1;i>=0;i--){

const obstacle=obstacles[i];

let erase=false;

for(const p of obstacle.points){

if(Math.hypot(
p.x-x,
p.y-y
)<radius){

erase=true;
break;

}

}

if(erase){

obstacles.splice(i,1);

}

}

}


/* =========================================================
   DISTANCE POINT / SEGMENT
========================================================= */

function pointSegmentDistance(
px,
py,
ax,
ay,
bx,
by
){

const dx=bx-ax;
const dy=by-ay;

const length2=dx*dx+dy*dy;

if(length2===0){

return Math.hypot(
px-ax,
py-ay
);

}

let t=(
(px-ax)*dx+
(py-ay)*dy
)/length2;

t=Math.max(
0,
Math.min(1,t)
);

const x=ax+t*dx;
const y=ay+t*dy;

return Math.hypot(
px-x,
py-y
);

}


/* =========================================================
   COLLISION OBSTACLES
========================================================= */

function collideObstacles(p){

for(const obstacle of obstacles){

const pts=obstacle.points;

for(let i=0;i<pts.length-1;i++){

const a=pts[i];
const b=pts[i+1];

const d=pointSegmentDistance(
p.x,
p.y,
a.x,
a.y,
b.x,
b.y
);

const radius=p.size+obstacle.width*.5;

if(d<radius){

/*
   trouver la normale approximative
*/

const dx=b.x-a.x;
const dy=b.y-a.y;

const length=Math.hypot(dx,dy)||1;

const nx=-dy/length;
const ny=dx/length;


/*
   empêcher la particule
   de traverser l'obstacle
*/

const penetration=radius-d;

p.x+=nx*penetration;
p.y+=ny*penetration;


/*
   réflexion de vitesse
*/

const dot=
p.vx*nx+
p.vy*ny;

if(dot<0){

p.vx-=2*dot*nx;
p.vy-=2*dot*ny;

p.vx*=.55;
p.vy*=.55;

}

}

}

}

}


/* =========================================================
   INTERACTION
========================================================= */

function interact(){

if(!pointer.down)return;

if(currentTool!=="hand"){
return;
}

const l=liquids[current];

const radius=125;

const radius2=radius*radius;

const forceX=pointer.vx*l.push;

const forceY=pointer.vy*l.push;

for(let i=0;i<particles.length;i++){

const p=particles[i];

const dx=p.x-pointer.x;

const dy=p.y-pointer.y;

const d2=dx*dx+dy*dy;

if(d2<radius2){

const factor=
1-Math.sqrt(d2)/radius;

p.vx+=
forceX*
factor*
.11;

p.vy+=
forceY*
factor*
.11;


/*
   aspiration légère
*/

p.vx-=
dx*
factor*
.002;

p.vy-=
dy*
factor*
.002;

}

}

}


/* =========================================================
   PHYSIQUE
========================================================= */

function update(){

const l=liquids[current];

for(let i=0;i<particles.length;i++){

const p=particles[i];


/* gravité */

p.vy+=l.gravity;


/* viscosité */

p.vx*=l.friction;

p.vy*=l.friction;


/* mouvement */

p.x+=p.vx;

p.y+=p.vy;


/* sol */

const bottom=H-135;

if(p.y>bottom){

p.y=bottom;

if(p.vy>0){

p.vy*=-.25;

}

p.vx*=.94;

}


/* plafond */

if(p.y<78){

p.y=78;

p.vy=
Math.abs(p.vy)*.2;

}


/* murs */

if(p.x<p.size){

p.x=p.size;

p.vx=
Math.abs(p.vx)*.3;

}

else if(p.x>W-p.size){

p.x=W-p.size;

p.vx=
-Math.abs(p.vx)*.3;

}


/* collisions */

collideObstacles(p);

}

}


/* =========================================================
   COHÉSION
========================================================= */

let physicsFrame=0;

function liquidCohesion(){

physicsFrame++;

if(physicsFrame%2!==0){
return;
}

const distanceMax=11;

const distanceMax2=
distanceMax*distanceMax;

for(let i=0;i<particles.length;i++){

const p=particles[i];

for(let j=i+1;j<particles.length;j++){

const q=particles[j];

const dx=q.x-p.x;

if(Math.abs(dx)>distanceMax){
continue;
}

const dy=q.y-p.y;

if(Math.abs(dy)>distanceMax){
continue;
}

const d2=dx*dx+dy*dy;

if(
d2>distanceMax2||
d2<.1
){
continue;
}

const d=Math.sqrt(d2);

const target=7;

if(d<target){

const force=
(target-d)*.01;

const nx=dx/d;
const ny=dy/d;

p.vx-=nx*force;
p.vy-=ny*force;

q.vx+=nx*force;
q.vy+=ny*force;

}

}

}

}


/* =========================================================
   VAGUES
========================================================= */

function addWave(x,y,power){

waves.push({

x:x,
y:y,

r:3,

life:1,

power:power

});

if(waves.length>18){

waves.shift();

}

}

function updateWaves(){

for(let i=waves.length-1;i>=0;i--){

const w=waves[i];

w.r+=4*w.power;

w.life-=.025;

if(w.life<=0){

waves.splice(i,1);

}

}

}


/* =========================================================
   ÉCLABOUSSURES
========================================================= */

function splash(x,y,vx,vy){

const l=liquids[current];

const amount=
current==="honey"
?4
:8;

for(let i=0;i<amount;i++){

const a=
Math.random()*
Math.PI*2;

const speed=
(1+Math.random()*3)*
l.push;

droplets.push({

x:x,
y:y,

vx:
Math.cos(a)*
speed+
vx*.3,

vy:
Math.sin(a)*
speed+
vy*.3-
2,

size:
1+
Math.random()*2,

life:1

});

}

}

function updateDroplets(){

for(let i=droplets.length-1;i>=0;i--){

const d=droplets[i];

d.vy+=.14;

d.vx*=.985;
d.vy*=.985;

d.x+=d.vx;
d.y+=d.vy;

d.life-=.025;

if(
d.life<=0||
d.y>H
){

droplets.splice(i,1);

}

}

}


/* =========================================================
   DESSIN PARTICULES
========================================================= */

function drawParticles(){

const l=liquids[current];

/*
   rendu très léger :
   un seul chemin canvas.
*/

ctx.fillStyle=l.color;

ctx.globalAlpha=l.alpha;

ctx.beginPath();

for(let i=0;i<particles.length;i++){

const p=particles[i];

ctx.moveTo(
p.x+p.size,
p.y
);

ctx.arc(
p.x,
p.y,
p.size,
0,
Math.PI*2
);

}

ctx.fill();

ctx.globalAlpha=1;


/*
   reflets sur une partie seulement
*/

ctx.fillStyle=l.light;

ctx.globalAlpha=.22;

ctx.beginPath();

for(let i=0;i<particles.length;i+=5){

const p=particles[i];

ctx.arc(
p.x-p.size*.3,
p.y-p.size*.3,
p.size*.3,
0,
Math.PI*2
);

}

ctx.fill();

ctx.globalAlpha=1;

}


/* =========================================================
   GOUTTES
========================================================= */

function drawDroplets(){

const l=liquids[current];

ctx.fillStyle=l.light;

for(let i=0;i<droplets.length;i++){

const d=droplets[i];

ctx.globalAlpha=d.life;

ctx.beginPath();

ctx.arc(
d.x,
d.y,
d.size,
0,
Math.PI*2
);

ctx.fill();

}

ctx.globalAlpha=1;

}


/* =========================================================
   OBSTACLES
========================================================= */

function drawObstacles(){

/*
   obstacles déjà enregistrés
*/

ctx.lineCap="round";
ctx.lineJoin="round";

for(const obstacle of obstacles){

const pts=obstacle.points;

if(pts.length<2){
continue;
}

ctx.beginPath();

ctx.moveTo(
pts[0].x,
pts[0].y
);

for(let i=1;i<pts.length;i++){

ctx.lineTo(
pts[i].x,
pts[i].y
);

}

ctx.strokeStyle="#464b4c";

ctx.lineWidth=obstacle.width;

ctx.stroke();


/* bord lumineux */

ctx.strokeStyle=
"rgba(255,255,255,.12)";

ctx.lineWidth=1.5;

ctx.stroke();

}


/*
   obstacle en train d'être dessiné
*/

if(drawingObstacle){

const pts=drawingObstacle.points;

if(pts.length>=2){

ctx.beginPath();

ctx.moveTo(
pts[0].x,
pts[0].y
);

for(let i=1;i<pts.length;i++){

ctx.lineTo(
pts[i].x,
pts[i].y
);

}

ctx.strokeStyle=
"rgba(120,130,130,.8)";

ctx.lineWidth=12;

ctx.stroke();

}

}

}


/* =========================================================
   VAGUES
========================================================= */

function drawWaves(){

const l=liquids[current];

for(const w of waves){

ctx.beginPath();

ctx.arc(
w.x,
w.y,
w.r,
0,
Math.PI*2
);

ctx.strokeStyle=l.light;

ctx.globalAlpha=
w.life*.16;

ctx.lineWidth=1.5;

ctx.stroke();

}

ctx.globalAlpha=1;

}


/* =========================================================
   SURFACE
========================================================= */

function drawSurface(){

const l=liquids[current];

/*
   Nouveau niveau du liquide :
   plus haut sur l'écran.
*/

const base=H-135;

ctx.beginPath();

ctx.moveTo(0,base);

for(let x=0;x<=W;x+=12){

let y=base;

for(const w of waves){

const dx=Math.abs(x-w.x);

if(dx<160){

const strength=
1-dx/160;

y-=
Math.sin(strength*Math.PI)*
w.power*
w.life*
8;

}

}

ctx.lineTo(x,y);

}

ctx.lineTo(W,H);
ctx.lineTo(0,H);
ctx.closePath();

ctx.fillStyle=l.dark;

ctx.globalAlpha=.18;

ctx.fill();

ctx.globalAlpha=1;

}


/* =========================================================
   OUTIL
========================================================= */

function drawToolCursor(){

if(!pointer.down){
return;
}

if(currentTool==="hand"){
return;
}

if(currentTool==="pencil"){

ctx.beginPath();

ctx.arc(
pointer.x,
pointer.y,
7,
0,
Math.PI*2
);

ctx.fillStyle=
"rgba(180,180,180,.65)";

ctx.fill();

}

if(currentTool==="eraser"){

ctx.beginPath();

ctx.arc(
pointer.x,
pointer.y,
25,
0,
Math.PI*2
);

ctx.strokeStyle=
"rgba(220,220,220,.45)";

ctx.lineWidth=2;

ctx.stroke();

}

}


/* =========================================================
   RENDU
========================================================= */

function render(){

ctx.fillStyle="#0c1011";

ctx.fillRect(
0,
0,
W,
H
);

drawSurface();

drawObstacles();

drawParticles();

drawDroplets();

drawWaves();

drawToolCursor();

}


/* =========================================================
   FPS
========================================================= */

let fpsFrames=0;

let fpsLast=performance.now();

const fpsValue=
document.getElementById("fpsValue");

function updateFPS(now){

fpsFrames++;

if(now-fpsLast>500){

const fps=Math.round(
fpsFrames*
1000/
(now-fpsLast)
);

fpsValue.textContent=fps;

fpsFrames=0;

fpsLast=now;

}

}


/* =========================================================
   BOUCLE
========================================================= */

let running=false;

function loop(now){

if(!running){
return;
}

updateFPS(now);


/*
   amortissement souris
*/

pointer.vx*=.8;
pointer.vy*=.8;


interact();

liquidCohesion();

update();

updateWaves();

updateDroplets();

render();

requestAnimationFrame(loop);

}


/* =========================================================
   POINTER DOWN
========================================================= */

canvas.addEventListener(
"pointerdown",
function(e){

if(!running){
return;
}

pointer.down=true;

pointerMove(
e.clientX,
e.clientY
);


/*
   MAIN
*/

if(currentTool==="hand"){

addWave(
e.clientX,
e.clientY,
1.2
);

splash(
e.clientX,
e.clientY,
pointer.vx,
pointer.vy
);

}


/*
   CRAYON
*/

else if(currentTool==="pencil"){

startObstacle(
e.clientX,
e.clientY
);

}


/*
   GOMME
*/

else if(currentTool==="eraser"){

eraseObstacle(
e.clientX,
e.clientY
);

}


try{

canvas.setPointerCapture(
e.pointerId
);

}catch(err){}

},
{passive:false}
);


/* =========================================================
   POINTER MOVE
========================================================= */

canvas.addEventListener(
"pointermove",
function(e){

if(!running){
return;
}

if(!pointer.down){
return;
}

pointerMove(
e.clientX,
e.clientY
);


/*
   MAIN
*/

if(currentTool==="hand"){

if(
Math.abs(pointer.vx)+
Math.abs(pointer.vy)>3
){

addWave(
e.clientX,
e.clientY,
Math.min(
1.4,
(
Math.abs(pointer.vx)+
Math.abs(pointer.vy)
)/18
)
);

}

}


/*
   CRAYON
*/

else if(currentTool==="pencil"){

addObstaclePoint(
e.clientX,
e.clientY
);

}


/*
   GOMME
*/

else if(currentTool==="eraser"){

eraseObstacle(
e.clientX,
e.clientY
);

}

},
{passive:false}
);


/* =========================================================
   POINTER UP
========================================================= */

canvas.addEventListener(
"pointerup",
function(){

if(currentTool==="pencil"){

finishObstacle();

}

pointer.down=false;

pointer.vx=0;
pointer.vy=0;

}
);


/* =========================================================
   CANCEL
========================================================= */

canvas.addEventListener(
"pointercancel",
function(){

if(currentTool==="pencil"){

finishObstacle();

}

pointer.down=false;

}
);


/* =========================================================
   LIQUIDES
========================================================= */

document
.querySelectorAll(".liquid")
.forEach(button=>{

button.addEventListener(
"click",
function(){

document
.querySelectorAll(".liquid")
.forEach(b=>
b.classList.remove("active")
);

this.classList.add("active");

current=this.dataset.liquid;

createParticles();

}
);

});


/* =========================================================
   OUTILS
========================================================= */

document
.querySelectorAll(".tool")
.forEach(button=>{

button.addEventListener(
"click",
function(){

document
.querySelectorAll(".tool")
.forEach(b=>
b.classList.remove("active")
);

this.classList.add("active");

currentTool=this.dataset.tool;

}

);

});


/* =========================================================
   DÉMARRAGE
========================================================= */

function startGame(){

document.getElementById(
"start"
).style.display="none";

createParticles();

running=true;

requestAnimationFrame(loop);

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,maximum-scale=1.0">
<title>Spirale</title>
<style>
*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#050505;
touch-action:none;
font-family:Arial,sans-serif
}

canvas{
position:fixed;
inset:0;
width:100%;
height:100%
}

#top{
position:fixed;
z-index:10;
top:14px;
left:18px;
right:18px;
display:flex;
justify-content:space-between;
align-items:center;
pointer-events:none
}

#title{
font-size:22px;
font-weight:bold;
color:#eee
}

#right{
display:flex;
align-items:center;
gap:8px;
pointer-events:auto
}

#speed{
appearance:auto;
-webkit-appearance:auto;
background:#202020;
color:#eee;
border:1px solid #444;
padding:9px 12px;
border-radius:10px;
font-size:13px;
cursor:pointer;
outline:none
}

#back{
text-decoration:none;
color:#ddd;
background:#202020;
padding:9px 14px;
border-radius:10px
}
</style>
</head>

<body>

<div id="top">
<div id="title">Spirale</div>

<div id="right">
<select id="speed">
<option value="10">Lente — ×2 / 10 s</option>
<option value="5" selected>Normale — ×2 / 5 s</option>
<option value="2">Rapide — ×2 / 2 s</option>
<option value="1">Très rapide — ×2 / 1 s</option>
</select>

<a id="back" href="index.html">← Jeux</a>
</div>
</div>

<canvas id="canvas"></canvas>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=0;
let H=0;

function resize(){
W=window.innerWidth;
H=window.innerHeight;
canvas.width=W;
canvas.height=H;
}

resize();
window.addEventListener("resize",resize);


/* =========================
   VITESSE
========================= */

let baseSpeed=0.0035;
let accelerationTime=5;
let startTime=performance.now();

const speedSelect=document.getElementById("speed");

speedSelect.addEventListener("change",function(){
accelerationTime=Number(this.value);

/*
On ne remet PAS la vitesse à zéro.
On recalcule simplement l'accélération
à partir de la nouvelle vitesse actuelle.
*/
startTime=performance.now();
});


/* =========================
   ROTATION
========================= */

let angle=0;
let direction=1;
let targetDirection=1;

canvas.addEventListener("pointerdown",function(){

targetDirection*=-1;

});


/* =========================
   ANIMATION
========================= */

let lastTime=performance.now();

function draw(now){

const dt=Math.min((now-lastTime)/1000,0.05);
lastTime=now;

ctx.fillStyle="#050505";
ctx.fillRect(0,0,W,H);


/*
La vitesse double tous les X secondes.

Lente :
10 secondes → ×2

Normale :
5 secondes → ×2

Rapide :
2 secondes → ×2

Très rapide :
1 seconde → ×2
*/

const elapsed=(now-startTime)/1000;

const acceleration=Math.pow(
2,
elapsed/accelerationTime
);

const currentSpeed=baseSpeed*acceleration;


/*
Changement de sens progressif
*/

direction+=(targetDirection-direction)*Math.min(1,dt*5);

angle+=currentSpeed*direction*60*dt;


/* =========================
   SPIRALE
========================= */

const cx=W/2;
const cy=H/2;

const max=Math.max(W,H)*0.9;

ctx.save();

ctx.translate(cx,cy);

const turns=18;
const steps=1700;

ctx.fillStyle="#eee";

for(let i=0;i<steps;i++){

const t=i/(steps-1);

const r=t*max;

const a=t*Math.PI*2*turns;

const depth=Math.sin(
t*Math.PI*turns*2+angle*2
);

const scale=1+depth*0.035;

const x=Math.cos(a)*r*scale;
const y=Math.sin(a)*r*scale;

const size=1.2+t*3.5;

ctx.beginPath();

ctx.arc(
x,
y,
size,
0,
Math.PI*2
);

ctx.globalAlpha=.18+.82*(1-t);

ctx.fill();

}

ctx.globalAlpha=1;

ctx.restore();

requestAnimationFrame(draw);

}

requestAnimationFrame(draw);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Spirale</title>
<style>
*{box-sizing:border-box}
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#050505;
touch-action:none;
font-family:Arial,sans-serif
}
canvas{
position:fixed;
inset:0;
width:100%;
height:100%
}
#top{
position:fixed;
z-index:10;
top:14px;
left:18px;
right:18px;
display:flex;
justify-content:space-between;
align-items:center;
pointer-events:none
}
#title{
font-size:22px;
font-weight:bold;
color:#eee
}
#right{
display:flex;
align-items:center;
gap:8px;
pointer-events:auto
}
#speed{
background:#202020;
color:#ddd;
border:0;
padding:9px 12px;
border-radius:10px;
font-size:13px;
outline:none
}
#back{
text-decoration:none;
color:#ddd;
background:#202020;
padding:9px 14px;
border-radius:10px
}
</style>
</head>
<body>

<div id="top">
<div id="title">Spirale</div>
<div id="right">
<select id="speed">
<option value="0.5">Lente</option>
<option value="1" selected>Normale</option>
<option value="2">Rapide</option>
<option value="4">Folle</option>
</select>
<a id="back" href="index.html">← Jeux</a>
</div>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=0,H=0;
let angle=0;
let direction=1;
let targetDirection=1;

let baseSpeed=0.0035;
let speed=baseSpeed;

let acceleration=1;
let lastTime=performance.now();

function resize(){
W=canvas.width=innerWidth;
H=canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

document.getElementById("speed").addEventListener("change",function(){
baseSpeed=0.0035*Number(this.value);
speed=baseSpeed;
acceleration=1;
});

canvas.addEventListener("pointerdown",()=>{
targetDirection*=-1;
});

function draw(now){

ctx.fillStyle="#050505";
ctx.fillRect(0,0,W,H);

const dt=Math.min((now-lastTime)/1000,0.1);
lastTime=now;

acceleration*=Math.pow(2,dt/2);
acceleration=Math.min(acceleration,100);

speed=baseSpeed*acceleration;

direction+=(targetDirection-direction)*Math.min(1,dt*5);

angle+=speed*direction*60*dt;

const cx=W/2;
const cy=H/2;
const max=Math.max(W,H)*0.85;

ctx.save();
ctx.translate(cx,cy);

const turns=18;
const steps=1500;

for(let i=0;i<steps;i++){

const t=i/(steps-1);
const r=t*max;
const a=t*Math.PI*2*turns;

const depth=Math.sin(
t*Math.PI*turns*2+angle*2
);

const scale=1+depth*.035;

const x=Math.cos(a)*r*scale;
const y=Math.sin(a)*r*scale;

const size=1.2+t*3.5;

ctx.beginPath();
ctx.arc(x,y,size,0,Math.PI*2);

const alpha=.18+.82*(1-t);
ctx.fillStyle=`rgba(240,240,240,${alpha})`;
ctx.fill();
}

ctx.restore();

requestAnimationFrame(draw);
}

requestAnimationFrame(draw);

</script>
</body>
</html>

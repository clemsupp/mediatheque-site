<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<meta name="HandheldFriendly" content="true">
<title>Liquide</title>
<style>
*{box-sizing:border-box}

canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}

#controls{position:absolute;z-index:20;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:wrap;width:96%;max-width:1000px}

.box{width:min(500px,90%);background:#171b1c;border:1px solid #303536;border-radius:18px;padding:30px;text-align:center;box-shadow:0 20px 60px #000}

.start{font-size:16px;padding:12px 24px;background:#394041}

button{padding:8px 9px;font-size:12px}

</style>
</head>

<body>
<div id="game">

<div id="top">
<div id="title">Liquide</div>
<a id="back" href="index.html">← Jeux</a>
</div>

<canvas id="canvas"></canvas>

<div id="hint">Main : pousse le liquide • Crayon : dessine • Ventilateur : place et oriente • Gomme : supprime</div>

<div id="controls">
<button class="liquid active" data-liquid="water">Eau</button>
<button class="liquid" data-liquid="lava">Lave</button>
<button class="liquid" data-liquid="oil">Huile</button>
<button class="liquid" data-liquid="milk">Lait</button>
<button class="liquid" data-liquid="honey">Miel</button>
<button class="liquid" data-liquid="slime">Slime</button>

<div class="separator"></div>

<button class="tool active" data-tool="hand">✋ Main</button>
<button class="tool" data-tool="pencil">✏️ Crayon</button>
<button class="tool" data-tool="fan">🌀 Ventilo</button>
<button class="tool" data-tool="eraser">🧽 Gomme</button>
</div>

<div id="fps">FPS : <span id="fpsValue">0</span></div>

<div id="start">
<div class="box">
<h1>Liquide</h1>
<p>
Choisis ton liquide puis manipule-le avec ta souris.<br>
Dessine des obstacles, ajoute des ventilateurs et observe le liquide réagir.
</p>
<button class="start" onclick="startGame()">Commencer</button>
</div>
</div>

</div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d",{alpha:false});

let W=0,H=0;

function resize(){
W=innerWidth;
H=innerHeight;
canvas.width=W;
canvas.height=H;
}

resize();
window.addEventListener("resize",resize);

const liquids={
water:{
gravity:.17,
friction:.985,
push:1.5,
size:3,
color:"#3289a8",
light:"#a9edff",
dark:"#123f52",
alpha:.72
},
lava:{
gravity:.10,
friction:.992,
push:.65,
size:3.8,
color:"#d94d19",
light:"#ffd36a",
dark:"#5d1808",
alpha:.82
},
oil:{
gravity:.13,
friction:.993,
push:.75,
size:3.3,
color:"#726a45",
light:"#d5c98e",
dark:"#252215",
alpha:.72
},
milk:{
gravity:.18,
friction:.984,
push:1.15,
size:3.5,
color:"#d7d8d0",
light:"#ffffff",
dark:"#777a75",
alpha:.82
},
honey:{
gravity:.11,
friction:.996,
push:.48,
size:4,
color:"#d2951d",
light:"#ffe58a",
dark:"#633707",
alpha:.86
},
slime:{
gravity:.16,
friction:.989,
push:1.1,
size:3.6,
color:"#62b84c",
light:"#caff91",
dark:"#1d5b20",
alpha:.78
}
};

let current="water";
let currentTool="hand";

let particles=[];
let obstacles=[];
let fans=[];
let waves=[];
let droplets=[];

/* PLUS DE PARTICULES */
const MAX_PARTICLES=3200;

function createParticles(){

particles.length=0;

const l=liquids[current];

const startY=Math.max(145,H*.34);
const bottom=H-145;

const area=W*(bottom-startY);

const spacing=Math.max(5,Math.sqrt(area/MAX_PARTICLES));

for(let y=startY;y<bottom;y+=spacing){

for(let x=12;x<W-12;x+=spacing){

if(particles.length>=MAX_PARTICLES)break;

particles.push({
x:x+(Math.random()-.5)*2,
y:y+(Math.random()-.5)*2,
vx:(Math.random()-.5)*.15,
vy:(Math.random()-.5)*.1,
size:l.size*(.75+Math.random()*.45)
});

}

if(particles.length>=MAX_PARTICLES)break;
}
}

/* POINTEUR */

const pointer={
x:0,
y:0,
px:0,
py:0,
vx:0,
vy:0,
down:false
};

function pointerMove(x,y){

pointer.px=pointer.x;
pointer.py=pointer.y;

pointer.x=x;
pointer.y=y;

pointer.vx=x-pointer.px;
pointer.vy=y-pointer.py;
}

/* =========================
   OBSTACLES
========================= */

let drawingObstacle=null;

function startObstacle(x,y){
drawingObstacle={
points:[{x:x,y:y}]
};
}

function addObstaclePoint(x,y){

if(!drawingObstacle)return;

const points=drawingObstacle.points;
const last=points[points.length-1];

const d=Math.hypot(x-last.x,y-last.y);

if(d>5){
points.push({x:x,y:y});
}
}

function finishObstacle(){

if(!drawingObstacle)return;

if(drawingObstacle.points.length>=2){

obstacles.push({
points:drawingObstacle.points,
width:14
});

}

drawingObstacle=null;
}

/* distance point segment */

function pointSegmentDistance(px,py,ax,ay,bx,by){

const dx=bx-ax;
const dy=by-ay;

const length2=dx*dx+dy*dy;

if(length2===0)
return Math.hypot(px-ax,py-ay);

let t=((px-ax)*dx+(py-ay)*dy)/length2;

t=Math.max(0,Math.min(1,t));

const x=ax+t*dx;
const y=ay+t*dy;

return Math.hypot(px-x,py-y);
}

/* COLLISION AMELIOREE */

function collideObstacles(p){

for(const obstacle of obstacles){

const pts=obstacle.points;

for(let i=0;i<pts.length-1;i++){

const a=pts[i];
const b=pts[i+1];

const dx=b.x-a.x;
const dy=b.y-a.y;

const length=Math.hypot(dx,dy)||1;

const nx=-dy/length;
const ny=dx/length;

const radius=p.size+obstacle.width*.5;

const d=pointSegmentDistance(
p.x,
p.y,
a.x,
a.y,
b.x,
b.y
);

if(d<radius){

let sideX=p.x;
let sideY=p.y;

let t=((sideX-a.x)*dx+(sideY-a.y)*dy)/(length*length);

t=Math.max(0,Math.min(1,t));

const closestX=a.x+t*dx;
const closestY=a.y+t*dy;

let cx=sideX-closestX;
let cy=sideY-closestY;

let cd=Math.hypot(cx,cy);

if(cd<.001){
cx=nx;
cy=ny;
cd=1;
}

cx/=cd;
cy/=cd;

/* repousse fortement la particule */

const penetration=radius-d;

p.x+=cx*(penetration+.8);
p.y+=cy*(penetration+.8);

const dot=p.vx*cx+p.vy*cy;

if(dot<0){

p.vx-=dot*1.9*cx;
p.vy-=dot*1.9*cy;

p.vx*=.72;
p.vy*=.72;
}

}
}
}
}

/* GOMME */

function eraseObjects(x,y){

const radius=32;

/* obstacles */

for(let i=obstacles.length-1;i>=0;i--){

const obstacle=obstacles[i];

for(const p of obstacle.points){

if(Math.hypot(p.x-x,p.y-y)<radius){

obstacles.splice(i,1);
break;

}

}
}

/* ventilateurs */

for(let i=fans.length-1;i>=0;i--){

const f=fans[i];

if(Math.hypot(f.x-x,f.y-y)<45){

fans.splice(i,1);

}

}
}

/* =========================
   VENTILATEURS
========================= */

let fanAction=null;

function createFan(x,y){

fans.push({
x:x,
y:y,
angle:0,
power:1
});

return fans[fans.length-1];
}

function findFan(x,y){

for(let i=fans.length-1;i>=0;i--){

const f=fans[i];

if(Math.hypot(f.x-x,f.y-y)<42)
return f;

}

return null;
}

/* pousse le liquide */

function applyFans(){

for(const f of fans){

const cos=Math.cos(f.angle);
const sin=Math.sin(f.angle);

/* zone de soufflerie */

const range=330;
const width=125;

for(let i=0;i<particles.length;i++){

const p=particles[i];

const dx=p.x-f.x;
const dy=p.y-f.y;

const forward=dx*cos+dy*sin;

if(forward<0||forward>range)continue;

const side=-dx*sin+dy*cos;

if(Math.abs(side)>width*(.35+forward/range*.65))
continue;

const distanceFactor=1-forward/range;
const sideFactor=1-Math.abs(side)/(width*(.35+forward/range*.65));

const force=
f.power*
distanceFactor*
sideFactor*
.065;

p.vx+=cos*force;
p.vy+=sin*force;

}
}
}

/* dessiner les ventilateurs */

function drawFans(){

for(const f of fans){

const x=f.x;
const y=f.y;

const cos=Math.cos(f.angle);
const sin=Math.sin(f.angle);

/* zone transparente du vent */

ctx.save();

ctx.translate(x,y);
ctx.rotate(f.angle);

ctx.beginPath();
ctx.moveTo(25,-70);
ctx.lineTo(330,-48);
ctx.lineTo(330,48);
ctx.lineTo(25,70);
ctx.closePath();

ctx.fillStyle="rgba(170,210,220,.035)";
ctx.fill();

for(let j=0;j<5;j++){

const yy=-42+j*21;

ctx.beginPath();
ctx.moveTo(45,yy);
ctx.lineTo(300,yy);

ctx.strokeStyle="rgba(170,210,220,.12)";
ctx.lineWidth=1;
ctx.stroke();

}

ctx.restore();

/* corps */

ctx.save();

ctx.translate(x,y);
ctx.rotate(f.angle);

ctx.beginPath();
ctx.arc(0,0,34,0,Math.PI*2);

ctx.fillStyle="#202728";
ctx.fill();

ctx.strokeStyle="#697071";
ctx.lineWidth=2;
ctx.stroke();

/* pales */

for(let i=0;i<4;i++){

const a=i*Math.PI/2+performance.now()*.0018;

ctx.save();
ctx.rotate(a);

ctx.beginPath();

ctx.moveTo(0,0);
ctx.quadraticCurveTo(
18,-8,
29,-3
);

ctx.quadraticCurveTo(
17,8,
0,4
);

ctx.closePath();

ctx.fillStyle="#899293";
ctx.fill();

ctx.restore();
}

/* centre */

ctx.beginPath();
ctx.arc(0,0,7,0,Math.PI*2);

ctx.fillStyle="#c5cccc";
ctx.fill();

ctx.restore();

/* poignée/base */

ctx.beginPath();
ctx.arc(
x-cos*27,
y-sin*27,
5,
0,
Math.PI*2
);

ctx.fillStyle="#555d5e";
ctx.fill();

}
}

/* =========================
   INTERACTION MAIN
========================= */

function interact(){

if(!pointer.down||currentTool!=="hand")return;

const l=liquids[current];

const radius=135;
const radius2=radius*radius;

const forceX=pointer.vx*l.push;
const forceY=pointer.vy*l.push;

for(let i=0;i<particles.length;i++){

const p=particles[i];

const dx=p.x-pointer.x;
const dy=p.y-pointer.y;

const d2=dx*dx+dy*dy;

if(d2<radius2){

const factor=1-Math.sqrt(d2)/radius;

p.vx+=forceX*factor*.13;
p.vy+=forceY*factor*.13;

p.vx-=dx*factor*.002;
p.vy-=dy*factor*.002;

}
}
}

/* =========================
   PHYSIQUE
========================= */

function update(){

const l=liquids[current];

/* plusieurs petites étapes =
   beaucoup moins de traversées */

const subSteps=2;

for(let step=0;step<subSteps;step++){

for(let i=0;i<particles.length;i++){

const p=particles[i];

p.vy+=l.gravity/subSteps;

p.vx*=Math.pow(l.friction,1/subSteps);
p.vy*=Math.pow(l.friction,1/subSteps);

p.x+=p.vx/subSteps;
p.y+=p.vy/subSteps;

/* sol */

const bottom=H-135;

if(p.y>bottom){

p.y=bottom;

if(p.vy>0)
p.vy*=-.25;

p.vx*=.94;
}

/* plafond */

if(p.y<78){

p.y=78;
p.vy=Math.abs(p.vy)*.2;

}

/* murs */

if(p.x<p.size){

p.x=p.size;
p.vx=Math.abs(p.vx)*.3;

}else if(p.x>W-p.size){

p.x=W-p.size;
p.vx=-Math.abs(p.vx)*.3;

}

/* collision plusieurs fois */

collideObstacles(p);
collideObstacles(p);

}

}

/* ventilateurs après déplacement */

applyFans();
}

/* =========================
   COHESION
========================= */

let physicsFrame=0;

function liquidCohesion(){

physicsFrame++;

if(physicsFrame%3!==0)return;

const distanceMax=10;
const distanceMax2=distanceMax*distanceMax;

for(let i=0;i<particles.length;i++){

const p=particles[i];

for(let j=i+1;j<particles.length;j++){

const q=particles[j];

const dx=q.x-p.x;

if(Math.abs(dx)>distanceMax)continue;

const dy=q.y-p.y;

if(Math.abs(dy)>distanceMax)continue;

const d2=dx*dx+dy*dy;

if(d2>distanceMax2||d2<.1)continue;

const d=Math.sqrt(d2);

const target=6.5;

if(d<target){

const force=(target-d)*.009;

const nx=dx/d;
const ny=dy/d;

p.vx-=nx*force;
p.vy-=ny*force;

q.vx+=nx*force;
q.vy+=ny*force;

}

}
}
}

/* =========================
   VAGUES
========================= */

function addWave(x,y,power){

waves.push({
x:x,
y:y,
r:3,
life:1,
power:power
});

if(waves.length>18)
waves.shift();

}

function updateWaves(){

for(let i=waves.length-1;i>=0;i--){

const w=waves[i];

w.r+=4*w.power;
w.life-=.025;

if(w.life<=0)
waves.splice(i,1);

}
}

/* =========================
   ECLABOUSSURES
========================= */

function splash(x,y,vx,vy){

const l=liquids[current];

const amount=current==="honey"?4:9;

for(let i=0;i<amount;i++){

const a=Math.random()*Math.PI*2;

const speed=(1+Math.random()*3)*l.push;

droplets.push({
x:x,
y:y,
vx:Math.cos(a)*speed+vx*.3,
vy:Math.sin(a)*speed+vy*.3-2,
size:1+Math.random()*2,
life:1
});

}
}

function updateDroplets(){

for(let i=droplets.length-1;i>=0;i--){

const d=droplets[i];

d.vy+=.14;
d.vx*=.985;
d.vy*=.985;

d.x+=d.vx;
d.y+=d.vy;

d.life-=.025;

if(d.life<=0||d.y>H)
droplets.splice(i,1);

}
}

/* =========================
   RENDU PARTICULES
========================= */

function drawParticles(){

const l=liquids[current];

ctx.fillStyle=l.color;
ctx.globalAlpha=l.alpha;
ctx.beginPath();

for(let i=0;i<particles.length;i++){

const p=particles[i];

ctx.moveTo(p.x+p.size,p.y);

ctx.arc(
p.x,
p.y,
p.size,
0,
Math.PI*2
);

}

ctx.fill();

ctx.globalAlpha=1;

ctx.fillStyle=l.light;
ctx.globalAlpha=.22;

ctx.beginPath();

for(let i=0;i<particles.length;i+=5){

const p=particles[i];

ctx.arc(
p.x-p.size*.3,
p.y-p.size*.3,
p.size*.3,
0,
Math.PI*2
);

}

ctx.fill();

ctx.globalAlpha=1;
}

/* =========================
   GOUTTES
========================= */

function drawDroplets(){

const l=liquids[current];

ctx.fillStyle=l.light;

for(let i=0;i<droplets.length;i++){

const d=droplets[i];

ctx.globalAlpha=d.life;

ctx.beginPath();

ctx.arc(
d.x,
d.y,
d.size,
0,
Math.PI*2
);

ctx.fill();

}

ctx.globalAlpha=1;
}

/* =========================
   OBSTACLES
========================= */

function drawObstacles(){

ctx.lineCap="round";
ctx.lineJoin="round";

for(const obstacle of obstacles){

const pts=obstacle.points;

if(pts.length<2)continue;

ctx.beginPath();

ctx.moveTo(
pts[0].x,
pts[0].y
);

for(let i=1;i<pts.length;i++){

ctx.lineTo(
pts[i].x,
pts[i].y
);

}

ctx.strokeStyle="#464b4c";
ctx.lineWidth=obstacle.width;
ctx.stroke();

ctx.strokeStyle="rgba(255,255,255,.12)";
ctx.lineWidth=1.5;
ctx.stroke();

}

/* obstacle en cours */

if(drawingObstacle){

const pts=drawingObstacle.points;

if(pts.length>=2){

ctx.beginPath();

ctx.moveTo(
pts[0].x,
pts[0].y
);

for(let i=1;i<pts.length;i++){

ctx.lineTo(
pts[i].x,
pts[i].y
);

}

ctx.strokeStyle="rgba(140,150,150,.85)";
ctx.lineWidth=14;
ctx.stroke();

}
}
}

/* =========================
   VAGUES
========================= */

function drawWaves(){

const l=liquids[current];

for(const w of waves){

ctx.beginPath();

ctx.arc(
w.x,
w.y,
w.r,
0,
Math.PI*2
);

ctx.strokeStyle=l.light;
ctx.globalAlpha=w.life*.16;
ctx.lineWidth=1.5;

ctx.stroke();

}

ctx.globalAlpha=1;
}

/* =========================
   SURFACE
========================= */

function drawSurface(){

const l=liquids[current];

const base=H-135;

ctx.beginPath();

ctx.moveTo(0,base);

for(let x=0;x<=W;x+=12){

let y=base;

for(const w of waves){

const dx=Math.abs(x-w.x);

if(dx<160){

y-=
Math.sin(
(1-dx/160)*Math.PI
)
*w.power
*w.life
*8;

}

}

ctx.lineTo(x,y);

}

ctx.lineTo(W,H);
ctx.lineTo(0,H);
ctx.closePath();

ctx.fillStyle=l.dark;
ctx.globalAlpha=.18;
ctx.fill();

ctx.globalAlpha=1;
}

/* =========================
   CURSEUR
========================= */

function drawToolCursor(){

if(!pointer.down)return;

if(currentTool==="hand")
return;

if(currentTool==="pencil"){

ctx.beginPath();

ctx.arc(
pointer.x,
pointer.y,
7,
0,
Math.PI*2
);

ctx.fillStyle="rgba(180,180,180,.65)";
ctx.fill();

}

if(currentTool==="eraser"){

ctx.beginPath();

ctx.arc(
pointer.x,
pointer.y,
32,
0,
Math.PI*2
);

ctx.strokeStyle="rgba(220,220,220,.45)";
ctx.lineWidth=2;
ctx.stroke();

}

}

/* =========================
   RENDU
========================= */

function render(){

ctx.fillStyle="#0c1011";
ctx.fillRect(0,0,W,H);

drawSurface();
drawObstacles();
drawFans();
drawParticles();
drawDroplets();
drawWaves();
drawToolCursor();

}

/* =========================
   FPS
========================= */

let fpsFrames=0;
let fpsLast=performance.now();

const fpsValue=
document.getElementById("fpsValue");

function updateFPS(now){

fpsFrames++;

if(now-fpsLast>500){

const fps=
Math.round(
fpsFrames*1000/(now-fpsLast)
);

fpsValue.textContent=fps;

fpsFrames=0;
fpsLast=now;

}
}

/* =========================
   BOUCLE
========================= */

let running=false;

function loop(now){

if(!running)return;

updateFPS(now);

pointer.vx*=.8;
pointer.vy*=.8;

interact();

liquidCohesion();

update();

updateWaves();

updateDroplets();

render();

requestAnimationFrame(loop);

}

/* =========================
   SOURIS / TOUCH
========================= */

canvas.addEventListener(
"pointerdown",
function(e){

if(!running)return;

pointer.down=true;

pointerMove(
e.clientX,
e.clientY
);

if(currentTool==="hand"){

addWave(
e.clientX,
e.clientY,
1.2
);

splash(
e.clientX,
e.clientY,
pointer.vx,
pointer.vy
);

}

else if(currentTool==="pencil"){

startObstacle(
e.clientX,
e.clientY
);

}

else if(currentTool==="eraser"){

eraseObjects(
e.clientX,
e.clientY
);

}

else if(currentTool==="fan"){

/*
Si on clique sur un ventilateur,
on le prend pour pouvoir l'orienter.
Sinon on en crée un nouveau.
*/

const existing=findFan(
e.clientX,
e.clientY
);

if(existing){

fanAction={
fan:existing,
mode:"rotate"
};

}else{

const fan=createFan(
e.clientX,
e.clientY
);

fanAction={
fan:fan,
mode:"place"
};

}

}

try{
canvas.setPointerCapture(e.pointerId);
}catch(err){}

},
{passive:false}
);

canvas.addEventListener(
"pointermove",
function(e){

if(!running||!pointer.down)return;

pointerMove(
e.clientX,
e.clientY
);

if(currentTool==="hand"){

if(
Math.abs(pointer.vx)+
Math.abs(pointer.vy)>3
){

addWave(
e.clientX,
e.clientY,
Math.min(
1.4,
(
Math.abs(pointer.vx)+
Math.abs(pointer.vy)
)/18
)
);

}

}

else if(currentTool==="pencil"){

addObstaclePoint(
e.clientX,
e.clientY
);

}

else if(currentTool==="eraser"){

eraseObjects(
e.clientX,
e.clientY
);

}

else if(currentTool==="fan"&&fanAction){

const f=fanAction.fan;

/*
On déplace le ventilateur
*/

if(fanAction.mode==="place"){

f.x=e.clientX;
f.y=e.clientY;

}

/*
On oriente le ventilateur
en fonction du curseur
*/

const dx=e.clientX-f.x;
const dy=e.clientY-f.y;

if(Math.hypot(dx,dy)>8){

f.angle=Math.atan2(dy,dx);

}

}

},
{passive:false}
);

canvas.addEventListener(
"pointerup",
function(){

if(currentTool==="pencil")
finishObstacle();

fanAction=null;

pointer.down=false;

pointer.vx=0;
pointer.vy=0;

}
);

canvas.addEventListener(
"pointercancel",
function(){

if(currentTool==="pencil")
finishObstacle();

fanAction=null;

pointer.down=false;

}
);

/* =========================
   LIQUIDES
========================= */

document.querySelectorAll(".liquid")
.forEach(button=>{

button.addEventListener(
"click",
function(){

document
.querySelectorAll(".liquid")
.forEach(b=>
b.classList.remove("active")
);

this.classList.add("active");

current=this.dataset.liquid;

createParticles();

}
);

});

/* =========================
   OUTILS
========================= */

document.querySelectorAll(".tool")
.forEach(button=>{

button.addEventListener(
"click",
function(){

document
.querySelectorAll(".tool")
.forEach(b=>
b.classList.remove("active")
);

this.classList.add("active");

currentTool=this.dataset.tool;

}

);

});

/* =========================
   START
========================= */

function startGame(){

document.getElementById("start").style.display="none";

createParticles();

running=true;

requestAnimationFrame(loop);

}
</script>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Spirale</title>
<style>
*{box-sizing:border-box}
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#050505;
touch-action:none;
font-family:Arial,sans-serif
}
canvas{
position:fixed;
inset:0;
width:100%;
height:100%
}
#top{
position:fixed;
z-index:10;
top:14px;
left:18px;
right:18px;
display:flex;
justify-content:space-between;
align-items:center;
pointer-events:none
}
#title{
font-size:22px;
font-weight:bold;
color:#eee
}
#back{
pointer-events:auto;
text-decoration:none;
color:#ddd;
background:#202020;
padding:9px 14px;
border-radius:10px
}
</style>
</head>
<body>

<div id="top">
<div id="title">Spirale</div>
<a id="back" href="index.html">← Jeux</a>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=0,H=0;
let angle=0;
let direction=1;
let targetDirection=1;
let speed=0.0035;
let transition=0;

function resize(){
W=canvas.width=innerWidth;
H=canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

function draw(){
ctx.fillStyle="#050505";
ctx.fillRect(0,0,W,H);

const cx=W/2;
const cy=H/2;
const max=Math.max(W,H)*0.85;

ctx.save();
ctx.translate(cx,cy);
ctx.rotate(angle);

const turns=18;
const steps=1500;

for(let i=0;i<steps;i++){
const t=i/(steps-1);
const r=t*max;
const a=t*Math.PI*2*turns;

const depth=Math.sin(t*Math.PI*turns*2+angle*2);
const scale=1+depth*.035;

const x=Math.cos(a)*r*scale;
const y=Math.sin(a)*r*scale;

const size=1.2+t*3.5;

ctx.beginPath();
ctx.arc(x,y,size,0,Math.PI*2);

const alpha=.18+.82*(1-t);
ctx.fillStyle=`rgba(240,240,240,${alpha})`;
ctx.fill();
}

ctx.restore();

angle+=speed*direction;

if(transition>0){
transition*=.92;
direction+=(targetDirection-direction)*.08;
}

requestAnimationFrame(draw);
}

canvas.addEventListener("pointerdown",()=>{
if(targetDirection===direction){
speed=Math.min(speed*1.35,0.035);
}else{
targetDirection*=-1;
transition=1;
}
});

draw();
</script>

</body>
</html>

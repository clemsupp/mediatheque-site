</div>

Choisis ton liquide puis manipule-le.<br>
Dessine des obstacles ou ajoute des ventilateurs.
</p>

</div>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d",{alpha:false});

let W=0;
let H=0;

function resize(){
W=window.innerWidth;
H=window.innerHeight;
canvas.width=W;
canvas.height=H;
}

resize();

window.addEventListener("resize",resize);


/* =========================
   LIQUIDES
========================= */

const liquids={

water:{
gravity:.18,
friction:.985,
push:1.6,
size:3.1,
color:"#268fbd",
cohesion:.008,
viscosity:1
},

lava:{
gravity:.10,
friction:.994,
push:.65,
size:3.8,
color:"#e24a15",
cohesion:.014,
viscosity:1.5
},

oil:{
gravity:.13,
friction:.995,
push:.8,
size:3.6,
color:"#514d2c",
cohesion:.012,
viscosity:1.8
},

milk:{
gravity:.17,
friction:.982,
push:1.15,
size:4,
color:"#e8e7df",
cohesion:.018,
viscosity:2
},

honey:{
gravity:.09,
friction:.998,
push:.42,
size:4.4,
color:"#c88913",
cohesion:.028,
viscosity:4
},

slime:{
gravity:.14,
friction:.997,
push:.8,
size:4.5,
color:"#50bd2b",
cohesion:.075,
viscosity:3.5
}

};

let current="water";
let currentTool="hand";


/* =========================
   PARTICULES
========================= */

const MAX_PARTICLES=2600;

let particles=[];

function createParticles(){

particles.length=0;

const l=liquids[current];

const startY=Math.max(145,H*.34);
const bottom=H-135;

const area=W*(bottom-startY);

const spacing=Math.max(
5.2,
Math.sqrt(area/MAX_PARTICLES)
);

for(
let y=startY;
y<bottom;
y+=spacing
){

for(
let x=8;
x<W-8;
x+=spacing
){

if(particles.length>=MAX_PARTICLES)
break;

particles.push({

x:x+(Math.random()-.5)*1.5,
y:y+(Math.random()-.5)*1.5,

vx:0,
vy:0,

size:l.size*
(.85+Math.random()*.3)

});

}

if(particles.length>=MAX_PARTICLES)
break;

}

}


/* =========================
   POINTER
========================= */

const pointer={
x:0,
y:0,
px:0,
py:0,
vx:0,
vy:0,
down:false
};

function pointerMove(x,y){

pointer.px=pointer.x;
pointer.py=pointer.y;

pointer.x=x;
pointer.y=y;

pointer.vx=x-pointer.px;
pointer.vy=y-pointer.py;

}


/* =========================
   OBSTACLES
========================= */

let obstacles=[];
let drawingObstacle=null;

const GRID_SIZE=80;
const PENCIL_STEP=15;

let obstacleGrid=new Map();

function obstacleKey(x,y){
return Math.floor(x/GRID_SIZE)+","+Math.floor(y/GRID_SIZE);
}

function rebuildObstacleGrid(){

obstacleGrid.clear();

for(
let i=0;
i<obstacles.length;
i++
){

const o=obstacles[i];

const minX=Math.floor(o.minX/GRID_SIZE);
const maxX=Math.floor(o.maxX/GRID_SIZE);

const minY=Math.floor(o.minY/GRID_SIZE);
const maxY=Math.floor(o.maxY/GRID_SIZE);

for(
let gx=minX;
gx<=maxX;
gx++
){

for(
let gy=minY;
gy<=maxY;
gy++
){

const key=gx+","+gy;

let list=obstacleGrid.get(key);

if(!list){

list=[];
obstacleGrid.set(key,list);

}

list.push(i);

}

}

}

}

function startObstacle(x,y){

drawingObstacle={
points:[{x:x,y:y}],
minX:x,
maxX:x,
minY:y,
maxY:y
};

}

function addObstaclePoint(x,y){

if(!drawingObstacle)
return;

const pts=drawingObstacle.points;

const last=pts[pts.length-1];

const dx=x-last.x;
const dy=y-last.y;

if(
dx*dx+dy*dy<
PENCIL_STEP*PENCIL_STEP
)
return;

pts.push({x:x,y:y});

drawingObstacle.minX=Math.min(
drawingObstacle.minX,x
);

drawingObstacle.maxX=Math.max(
drawingObstacle.maxX,x
);

drawingObstacle.minY=Math.min(
drawingObstacle.minY,y
);

drawingObstacle.maxY=Math.max(
drawingObstacle.maxY,y
);

}

function finishObstacle(){

if(!drawingObstacle)
return;

if(
drawingObstacle.points.length>=2
){

const o=drawingObstacle;

obstacles.push({

points:o.points,

minX:o.minX-10,
maxX:o.maxX+10,

minY:o.minY-10,
maxY:o.maxY+10,

width:15

});

rebuildObstacleGrid();

}

drawingObstacle=null;

}


/* =========================
   DISTANCE SEGMENT
========================= */

function pointSegmentDistanceSq(
px,py,
ax,ay,
bx,by
){

const dx=bx-ax;
const dy=by-ay;

const len2=dx*dx+dy*dy;

if(len2===0){

const ex=px-ax;
const ey=py-ay;

return ex*ex+ey*ey;

}

let t=
(
(px-ax)*dx+
(py-ay)*dy
)/len2;

if(t<0)t=0;
if(t>1)t=1;

const cx=ax+t*dx;
const cy=ay+t*dy;

const ex=px-cx;
const ey=py-cy;

return ex*ex+ey*ey;

}


/* =========================
   COLLISION CRAYON
========================= */

function collideObstacles(p){

const gx=Math.floor(p.x/GRID_SIZE);
const gy=Math.floor(p.y/GRID_SIZE);

for(
let ox=-1;
ox<=1;
ox++
){

for(
let oy=-1;
oy<=1;
oy++
){

const list=
obstacleGrid.get(
(gx+ox)+","+(gy+oy)
);

if(!list)
continue;

for(
let n=0;
n<list.length;
n++
){

const o=obstacles[list[n]];

if(
p.x<o.minX||
p.x>o.maxX||
p.y<o.minY||
p.y>o.maxY
)
continue;

const pts=o.points;

const radius=
p.size+
o.width*.5;

const radius2=
radius*radius;

for(
let i=0;
i<pts.length-1;
i++
){

const a=pts[i];
const b=pts[i+1];

if(
p.x<
Math.min(a.x,b.x)-radius||
p.x>
Math.max(a.x,b.x)+radius||
p.y<
Math.min(a.y,b.y)-radius||
p.y>
Math.max(a.y,b.y)+radius
)
continue;

const d2=
pointSegmentDistanceSq(
p.x,p.y,
a.x,a.y,
b.x,b.y
);

if(d2>=radius2)
continue;

const dx=b.x-a.x;
const dy=b.y-a.y;

const len=Math.hypot(dx,dy)||1;

let t=
(
(p.x-a.x)*dx+
(p.y-a.y)*dy
)/(len*len);

t=Math.max(0,Math.min(1,t));

const cx=a.x+t*dx;
const cy=a.y+t*dy;

let nx=p.x-cx;
let ny=p.y-cy;

const d=Math.hypot(nx,ny)||.001;

nx/=d;
ny/=d;

const penetration=radius-d;

p.x+=nx*(penetration+1);
p.y+=ny*(penetration+1);

const dot=
p.vx*nx+
p.vy*ny;

if(dot<0){

p.vx-=dot*nx*1.7;
p.vy-=dot*ny*1.7;

p.vx*=.72;
p.vy*=.72;

}

}

}

}

}

}


/* =========================
   VENTILATEURS
========================= */

let fans=[];
let selectedFan=null;

function createFan(x,y){

const fan={
x:x,
y:y,
angle:0,
power:10
};

fans.push(fan);

return fan;

}

function findFan(x,y){

for(
let i=fans.length-1;
i>=0;
i--
){

const f=fans[i];

const dx=f.x-x;
const dy=f.y-y;

if(
dx*dx+dy*dy<
55*55
)
return f;

}

return null;

}

function applyFans(){

if(!fans.length)
return;

for(const f of fans){

const cos=Math.cos(f.angle);
const sin=Math.sin(f.angle);

const range=470;
const width=180;

for(
let i=0;
i<particles.length;
i++
){

const p=particles[i];

const dx=p.x-f.x;
const dy=p.y-f.y;

const forward=
dx*cos+
dy*sin;

if(
forward<0||
forward>range
)
continue;

const side=
-dx*sin+
dy*cos;

const currentWidth=
width+
forward*.18;

if(
Math.abs(side)>
currentWidth
)
continue;

const distance=
1-forward/range;

const sideFactor=
1-
Math.abs(side)/currentWidth;

const force=
f.power*
distance*
distance*
sideFactor*
.12;

p.vx+=cos*force;
p.vy+=sin*force;

}

}

}


/* =========================
   MAIN
========================= */

function interact(){

if(
!pointer.down||
currentTool!=="hand"
)
return;

const l=liquids[current];

const radius=120;
const radius2=radius*radius;

const fx=
pointer.vx*
l.push;

const fy=
pointer.vy*
l.push;

for(
let i=0;
i<particles.length;
i++
){

const p=particles[i];

const dx=
p.x-pointer.x;

const dy=
p.y-pointer.y;

const d2=
dx*dx+
dy*dy;

if(d2<radius2){

const factor=
1-
Math.sqrt(d2)/radius;

p.vx+=
fx*
factor*
.13;

p.vy+=
fy*
factor*
.13;

}

}

}


/* =========================
   GOMME
========================= */

function eraseObjects(x,y){

const radius=42;
const radius2=radius*radius;

for(
let i=obstacles.length-1;
i>=0;
i--
){

const o=obstacles[i];

if(
x<o.minX-radius||
x>o.maxX+radius||
y<o.minY-radius||
y>o.maxY+radius
)
continue;

let erased=false;

const pts=o.points;

for(
let j=0;
j<pts.length;
j++
){

const dx=pts[j].x-x;
const dy=pts[j].y-y;

if(
dx*dx+
dy*dy<
radius2
){

erased=true;
break;

}

}

if(erased)
obstacles.splice(i,1);

}

for(
let i=fans.length-1;
i>=0;
i--
){

const f=fans[i];

const dx=f.x-x;
const dy=f.y-y;

if(
dx*dx+
dy*dy<
55*55
){

fans.splice(i,1);

}

}

rebuildObstacleGrid();

}


/* =========================
   GRILLE LIQUIDE
========================= */

const LIQUID_GRID=22;

let liquidGrid=new Map();

function rebuildLiquidGrid(){

liquidGrid.clear();

for(
let i=0;
i<particles.length;
i++
){

const p=particles[i];

const gx=
Math.floor(
p.x/LIQUID_GRID
);

const gy=
Math.floor(
p.y/LIQUID_GRID
);

const key=
gx+","+gy;

let list=
liquidGrid.get(key);

if(!list){

list=[];
liquidGrid.set(key,list);

}

list.push(i);

}

}


/* =========================
   COHESION
========================= */

let physicsFrame=0;

function liquidCohesion(){

physicsFrame++;

if(
physicsFrame%3!==0
)
return;

const l=liquids[current];

const distance=
current==="slime"
?18
:10;

const distance2=
distance*distance;

const target=
current==="slime"
?11
:6.2;

rebuildLiquidGrid();

for(
let i=0;
i<particles.length;
i++
){

const p=particles[i];

const gx=
Math.floor(
p.x/LIQUID_GRID
);

const gy=
Math.floor(
p.y/LIQUID_GRID
);

for(
let ox=-1;
ox<=1;
ox++
){

for(
let oy=-1;
oy<=1;
oy++
){

const list=
liquidGrid.get(
(gx+ox)+","+(gy+oy)
);

if(!list)
continue;

for(
let n=0;
n<list.length;
n++
){

const j=list[n];

if(j<=i)
continue;

const q=particles[j];

const dx=q.x-p.x;

if(
Math.abs(dx)>
distance
)
continue;

const dy=q.y-p.y;

if(
Math.abs(dy)>
distance
)
continue;

const d2=
dx*dx+
dy*dy;

if(
d2<=.1||
d2>distance2
)
continue;

const d=Math.sqrt(d2);

if(d<target){

const force=
(target-d)*
l.cohesion;

const nx=dx/d;
const ny=dy/d;

p.vx-=
nx*
force;

p.vy-=
ny*
force;

q.vx+=
nx*
force;

q.vy+=
ny*
force;

}

}

}

}

}

}


/* =========================
   PHYSIQUE
========================= */

function update(){

const l=liquids[current];

const friction=
Math.pow(
l.friction,
l.viscosity
);

const bottom=H-135;

for(
let i=0;
i<particles.length;
i++
){

const p=particles[i];

p.vy+=l.gravity;

p.vx*=friction;
p.vy*=friction;

p.x+=p.vx;
p.y+=p.vy;

if(
p.y>bottom
){

p.y=bottom;

if(p.vy>0)
p.vy*=-.22;

p.vx*=.94;

}

if(
p.y<80
){

p.y=80;

if(p.vy<0)
p.vy=0;

}

if(
p.x<p.size
){

p.x=p.size;

if(p.vx<0)
p.vx*=-.25;

}

else if(
p.x>
W-p.size
){

p.x=W-p.size;

if(p.vx>0)
p.vx*=-.25;

}

if(obstacles.length)
collideObstacles(p);

}

applyFans();

}


/* =========================
   DESSIN LIQUIDE
========================= */

function drawParticles(){

const l=liquids[current];

ctx.fillStyle=l.color;

ctx.globalAlpha=.95;

ctx.beginPath();

for(
let i=0;
i<particles.length;
i++
){

const p=particles[i];

ctx.moveTo(
p.x+p.size,
p.y
);

ctx.arc(
p.x,
p.y,
p.size,
0,
Math.PI*2
);

}

ctx.fill();

ctx.globalAlpha=1;

}


/* =========================
   OBSTACLES
========================= */

function drawObstacles(){

ctx.lineCap="round";
ctx.lineJoin="round";

for(const o of obstacles){

if(o.points.length<2)
continue;

ctx.beginPath();

ctx.moveTo(
o.points[0].x,
o.points[0].y
);

for(
let i=1;
i<o.points.length;
i++
){

ctx.lineTo(
o.points[i].x,
o.points[i].y
);

}

ctx.strokeStyle="#555";
ctx.lineWidth=o.width;
ctx.stroke();

}

if(
drawingObstacle&&
drawingObstacle.points.length>=2
){

ctx.beginPath();

ctx.moveTo(
drawingObstacle.points[0].x,
drawingObstacle.points[0].y
);

for(
let i=1;
i<drawingObstacle.points.length;
i++
){

ctx.lineTo(
drawingObstacle.points[i].x,
drawingObstacle.points[i].y
);

}

ctx.strokeStyle="#777";
ctx.lineWidth=15;
ctx.stroke();

}

}


/* =========================
   VENTILATEURS VISUELS
========================= */

function drawFans(){

for(const f of fans){

ctx.save();

ctx.translate(f.x,f.y);
ctx.rotate(f.angle);

ctx.beginPath();

ctx.moveTo(30,-85);
ctx.lineTo(420,-65);
ctx.lineTo(420,65);
ctx.lineTo(30,85);
ctx.closePath();

ctx.fillStyle="rgba(150,200,220,.035)";
ctx.fill();

ctx.beginPath();

ctx.arc(
0,
0,
38,
0,
Math.PI*2
);

ctx.fillStyle="#202526";
ctx.fill();

ctx.strokeStyle="#888";
ctx.lineWidth=2;
ctx.stroke();

for(
let i=0;
i<4;
i++
){

ctx.save();

ctx.rotate(i*Math.PI/2);

ctx.beginPath();

ctx.moveTo(0,0);

ctx.lineTo(30,-8);
ctx.lineTo(34,4);
ctx.lineTo(5,7);

ctx.closePath();

ctx.fillStyle="#999";
ctx.fill();

ctx.restore();

}

ctx.beginPath();

ctx.arc(
0,
0,
8,
0,
Math.PI*2
);

ctx.fillStyle="#ddd";
ctx.fill();

ctx.restore();

}

}


/* =========================
   CURSEUR
========================= */

function drawCursor(){

if(!pointer.down)
return;

if(currentTool==="pencil"){

ctx.beginPath();

ctx.arc(
pointer.x,
pointer.y,
7,
0,
Math.PI*2
);

ctx.fillStyle="#aaa";
ctx.fill();

}

if(currentTool==="eraser"){

ctx.beginPath();

ctx.arc(
pointer.x,
pointer.y,
38,
0,
Math.PI*2
);

ctx.strokeStyle="rgba(255,255,255,.4)";
ctx.lineWidth=2;

ctx.stroke();

}

}


/* =========================
   RENDU
========================= */

function render(){

ctx.fillStyle="#090b0c";
ctx.fillRect(
0,
0,
W,
H
);

drawParticles();
drawObstacles();
drawFans();
drawCursor();

}


/* =========================
   FPS
========================= */

let fpsFrames=0;
let fpsLast=performance.now();

function updateFPS(now){

fpsFrames++;

if(
now-fpsLast>=500
){

document.getElementById(
"fpsValue"
).textContent=
Math.round(
fpsFrames*
1000/
(now-fpsLast)
);

fpsFrames=0;
fpsLast=now;

}

}


/* =========================
   BOUCLE
========================= */

let running=false;

function loop(now){

if(!running)
return;

updateFPS(now);

pointer.vx*=.8;
pointer.vy*=.8;

interact();

liquidCohesion();

update();

render();

requestAnimationFrame(loop);

}


/* =========================
   POINTER DOWN
========================= */

canvas.addEventListener(
"pointerdown",
function(e){

if(!running)
return;

pointer.down=true;

pointerMove(
e.clientX,
e.clientY
);

if(currentTool==="pencil"){

startObstacle(
e.clientX,
e.clientY
);

}

else if(currentTool==="eraser"){

eraseObjects(
e.clientX,
e.clientY
);

}

else if(currentTool==="fan"){

const existing=
findFan(
e.clientX,
e.clientY
);

if(existing){

selectedFan=existing;

}
else{

selectedFan=
createFan(
e.clientX,
e.clientY
);

}

}

try{
canvas.setPointerCapture(
e.pointerId
);
}catch(err){}

},
{passive:false}
);


/* =========================
   POINTER MOVE
========================= */

canvas.addEventListener(
"pointermove",
function(e){

if(
!running||
!pointer.down
)
return;

pointerMove(
e.clientX,
e.clientY
);

if(
currentTool==="pencil"
){

addObstaclePoint(
e.clientX,
e.clientY
);

}

else if(
currentTool==="eraser"
){

eraseObjects(
e.clientX,
e.clientY
);

}

else if(
currentTool==="fan"&&
selectedFan
){

const dx=
e.clientX-
selectedFan.x;

const dy=
e.clientY-
selectedFan.y;

if(
dx*dx+
dy*dy>
100
){

selectedFan.angle=
Math.atan2(dy,dx);

}

}

},
{passive:false}
);


/* =========================
   POINTER UP
========================= */

function endPointer(){

if(
currentTool==="pencil"
)
finishObstacle();

selectedFan=null;

pointer.down=false;

pointer.vx=0;
pointer.vy=0;

}

canvas.addEventListener(
"pointerup",
endPointer
);

canvas.addEventListener(
"pointercancel",
endPointer
);


/* =========================
   CLEAR ALL
========================= */

document
.getElementById("clearAll")
.addEventListener(
"click",
function(){

obstacles.length=0;
fans.length=0;

drawingObstacle=null;
selectedFan=null;

obstacleGrid.clear();

}
);


/* =========================
   BOUTONS LIQUIDES
========================= */

document
.querySelectorAll(".liquid")
.forEach(
button=>{

button.addEventListener(
"click",
function(){

document
.querySelectorAll(".liquid")
.forEach(
b=>b.classList.remove("active")
);

this.classList.add("active");

current=
this.dataset.liquid;

createParticles();

}
);

}
);


/* =========================
   BOUTONS OUTILS
========================= */

document
.querySelectorAll(".tool")
.forEach(
button=>{

button.addEventListener(
"click",
function(){

document
.querySelectorAll(".tool")
.forEach(
b=>b.classList.remove("active")
);

this.classList.add("active");

currentTool=
this.dataset.tool;

selectedFan=null;

}
);

}
);


/* =========================
   DEMARRAGE
========================= */

document
.getElementById("startButton")
.addEventListener(
"click",
function(){

document
.getElementById("start")
.style.display="none";

createParticles();

running=true;

requestAnimationFrame(loop);

}
);

</script>

</body>
</html>

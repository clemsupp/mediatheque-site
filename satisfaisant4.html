<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d",{alpha:false});

let W=0;
let H=0;

function resize(){

W=innerWidth;
H=innerHeight;

canvas.width=W;
canvas.height=H;

}

resize();

window.addEventListener("resize",resize);


/* ================================
   LIQUIDES
================================ */

const liquids={

water:{
gravity:.17,
friction:.986,
push:1.5,
size:3,
color:"#3289a8",
light:"#a9edff",
dark:"#123f52",
alpha:.72
},

lava:{
gravity:.10,
friction:.992,
push:.65,
size:3.8,
color:"#d94d19",
light:"#ffd36a",
dark:"#5d1808",
alpha:.82
},

oil:{
gravity:.13,
friction:.993,
push:.75,
size:3.3,
color:"#726a45",
light:"#d5c98e",
dark:"#252215",
alpha:.72
},

milk:{
gravity:.18,
friction:.984,
push:1.15,
size:3.5,
color:"#d7d8d0",
light:"#ffffff",
dark:"#777a75",
alpha:.82
},

honey:{
gravity:.11,
friction:.996,
push:.48,
size:4,
color:"#d2951d",
light:"#ffe58a",
dark:"#633707",
alpha:.86
},

slime:{
gravity:.16,
friction:.989,
push:1.1,
size:3.6,
color:"#62b84c",
light:"#caff91",
dark:"#1d5b20",
alpha:.78
}

};

let current="water";
let currentTool="hand";


/* ================================
   PARTICULES
================================ */

const MAX_PARTICLES=3200;

let particles=[];

function createParticles(){

particles.length=0;

const l=liquids[current];

const startY=Math.max(145,H*.34);
const bottom=H-145;

const spacing=Math.max(
5,
Math.sqrt(
(W*(bottom-startY))/MAX_PARTICLES
)
);

for(
let y=startY;
y<bottom;
y+=spacing
){

for(
let x=10;
x<W-10;
x+=spacing
){

if(particles.length>=MAX_PARTICLES)
break;

particles.push({

x:x+(Math.random()-.5)*2,
y:y+(Math.random()-.5)*2,

vx:(Math.random()-.5)*.15,
vy:(Math.random()-.5)*.1,

size:l.size*(.75+Math.random()*.45)

});

}

if(particles.length>=MAX_PARTICLES)
break;

}

}


/* ================================
   POINTEUR
================================ */

const pointer={
x:0,
y:0,
px:0,
py:0,
vx:0,
vy:0,
down:false
};

function pointerMove(x,y){

pointer.px=pointer.x;
pointer.py=pointer.y;

pointer.x=x;
pointer.y=y;

pointer.vx=x-pointer.px;
pointer.vy=y-pointer.py;

}


/* ================================
   OBSTACLES
================================ */

let obstacles=[];
let drawingObstacle=null;

const PENCIL_STEP=14;

/*
GRILLE SPATIALE

Chaque obstacle est placé dans plusieurs
cases de la grille.

Une particule ne teste donc que les
obstacles proches d'elle.
*/

const GRID_SIZE=90;

let obstacleGrid=new Map();

function gridKey(x,y){

return (
Math.floor(x/GRID_SIZE)+
","+
Math.floor(y/GRID_SIZE)
);

}

function rebuildObstacleGrid(){

obstacleGrid.clear();

for(let oi=0;oi<obstacles.length;oi++){

const o=obstacles[oi];

const minGX=Math.floor(o.minX/GRID_SIZE);
const maxGX=Math.floor(o.maxX/GRID_SIZE);

const minGY=Math.floor(o.minY/GRID_SIZE);
const maxGY=Math.floor(o.maxY/GRID_SIZE);

for(
let gx=minGX;
gx<=maxGX;
gx++
){

for(
let gy=minGY;
gy<=maxGY;
gy++
){

const key=gx+","+gy;

let list=obstacleGrid.get(key);

if(!list){

list=[];
obstacleGrid.set(key,list);

}

list.push(oi);

}

}

}

}

function startObstacle(x,y){

drawingObstacle={
points:[{x:x,y:y}],
minX:x,
maxX:x,
minY:y,
maxY:y
};

}

function addObstaclePoint(x,y){

if(!drawingObstacle)
return;

const pts=drawingObstacle.points;

const last=pts[pts.length-1];

const dx=x-last.x;
const dy=y-last.y;

if(dx*dx+dy*dy<PENCIL_STEP*PENCIL_STEP)
return;

pts.push({
x:x,
y:y
});

if(x<drawingObstacle.minX)
drawingObstacle.minX=x;

if(x>drawingObstacle.maxX)
drawingObstacle.maxX=x;

if(y<drawingObstacle.minY)
drawingObstacle.minY=y;

if(y>drawingObstacle.maxY)
drawingObstacle.maxY=y;

}

function finishObstacle(){

if(!drawingObstacle)
return;

if(drawingObstacle.points.length>=2){

obstacles.push({

points:drawingObstacle.points,

minX:drawingObstacle.minX-10,
maxX:drawingObstacle.maxX+10,

minY:drawingObstacle.minY-10,
maxY:drawingObstacle.maxY+10,

width:14

});

rebuildObstacleGrid();

}

drawingObstacle=null;

}


/* ================================
   DISTANCE SEGMENT
================================ */

function pointSegmentDistanceSq(
px,py,
ax,ay,
bx,by
){

const dx=bx-ax;
const dy=by-ay;

const len2=dx*dx+dy*dy;

if(len2===0){

const ex=px-ax;
const ey=py-ay;

return ex*ex+ey*ey;

}

let t=
((px-ax)*dx+
(py-ay)*dy)/len2;

if(t<0)t=0;
else if(t>1)t=1;

const cx=ax+t*dx;
const cy=ay+t*dy;

const ex=px-cx;
const ey=py-cy;

return ex*ex+ey*ey;

}


/* ================================
   COLLISION OPTIMISEE
================================ */

function collideObstacles(p){

const gx=Math.floor(p.x/GRID_SIZE);
const gy=Math.floor(p.y/GRID_SIZE);

const checked=new Set();

for(let ox=-1;ox<=1;ox++){

for(let oy=-1;oy<=1;oy++){

const list=
obstacleGrid.get(
(gx+ox)+","+(gy+oy)
);

if(!list)
continue;

for(let li=0;li<list.length;li++){

const oi=list[li];

if(checked.has(oi))
continue;

checked.add(oi);

const o=obstacles[oi];

if(
p.x<o.minX ||
p.x>o.maxX ||
p.y<o.minY ||
p.y>o.maxY
)
continue;

const radius=p.size+o.width*.5;
const radius2=radius*radius;

const pts=o.points;

for(
let i=0;
i<pts.length-1;
i++
){

const a=pts[i];
const b=pts[i+1];

if(
p.x<
Math.min(a.x,b.x)-radius ||
p.x>
Math.max(a.x,b.x)+radius ||
p.y<
Math.min(a.y,b.y)-radius ||
p.y>
Math.max(a.y,b.y)+radius
)
continue;

const d2=
pointSegmentDistanceSq(
p.x,p.y,
a.x,a.y,
b.x,b.y
);

if(d2>=radius2)
continue;

const dx=b.x-a.x;
const dy=b.y-a.y;

const len=Math.hypot(dx,dy)||1;

const t=Math.max(
0,
Math.min(
1,
(
(p.x-a.x)*dx+
(p.y-a.y)*dy
)/(len*len)
)
);

const cx=a.x+t*dx;
const cy=a.y+t*dy;

let nx=p.x-cx;
let ny=p.y-cy;

const d=Math.hypot(nx,ny)||.001;

nx/=d;
ny/=d;

const penetration=radius-d;

p.x+=nx*(penetration+1.2);
p.y+=ny*(penetration+1.2);

const dot=
p.vx*nx+
p.vy*ny;

if(dot<0){

p.vx-=dot*1.8*nx;
p.vy-=dot*1.8*ny;

p.vx*=.70;
p.vy*=.70;

}

}

}

}

}

}


/* ================================
   VENTILATEURS
================================ */

let fans=[];

/*
Etat du ventilateur sélectionné.
*/

let selectedFan=null;

function createFan(x,y){

const fan={

x:x,
y:y,

/*
Angle initial vers la droite.
*/

angle:0,

/*
PUISSANCE ENORME
*/

power:11

};

fans.push(fan);

return fan;

}

function findFan(x,y){

for(
let i=fans.length-1;
i>=0;
i--
){

const f=fans[i];

const dx=f.x-x;
const dy=f.y-y;

if(
dx*dx+
dy*dy<
55*55
)
return f;

}

return null;

}


/* ================================
   SOUFFLE
================================ */

function applyFans(){

if(fans.length===0)
return;

for(
let fi=0;
fi<fans.length;
fi++
){

const f=fans[fi];

const cos=Math.cos(f.angle);
const sin=Math.sin(f.angle);

const range=480;
const width=185;

for(
let i=0;
i<particles.length;
i++
){

const p=particles[i];

const dx=p.x-f.x;
const dy=p.y-f.y;

const forward=
dx*cos+
dy*sin;

if(
forward<0 ||
forward>range
)
continue;

const side=
-dx*sin+
dy*cos;

const widthHere=
width+
forward*.20;

if(
Math.abs(side)>widthHere
)
continue;

const distance=
1-forward/range;

const sideFactor=
1-Math.abs(side)/widthHere;

/*
Très gros souffle.

La force maximale est volontairement
bien supérieure à la gravité.
*/

const force=
f.power*
distance*
distance*
sideFactor*
.115;

/*
Direction principale
*/

p.vx+=cos*force;
p.vy+=sin*force;

/*
Petite aspiration au départ
pour rendre le souffle plus naturel.
*/

if(forward<70){

const suck=
(1-forward/70)*
.018;

p.vx+=cos*suck;
p.vy+=sin*suck;

}

}

}

}


/* ================================
   PHYSIQUE
================================ */

function update(){

const l=liquids[current];

for(
let i=0;
i<particles.length;
i++
){

const p=particles[i];

p.vy+=l.gravity;

p.vx*=l.friction;
p.vy*=l.friction;

p.x+=p.vx;
p.y+=p.vy;


/* sol */

const bottom=H-135;

if(p.y>bottom){

p.y=bottom;

if(p.vy>0)
p.vy*=-.24;

p.vx*=.94;

}


/* plafond */

if(p.y<78){

p.y=78;

p.vy=Math.abs(p.vy)*.18;

}


/* murs */

if(p.x<p.size){

p.x=p.size;
p.vx=Math.abs(p.vx)*.3;

}

else if(p.x>W-p.size){

p.x=W-p.size;
p.vx=-Math.abs(p.vx)*.3;

}


/* obstacles */

if(obstacles.length)
collideObstacles(p);

}


/*
Le ventilateur est appliqué après
la gravité : le souffle peut donc
réellement compenser la gravité.
*/

applyFans();

}


/* ================================
   COHESION
================================ */

let physicsFrame=0;

function liquidCohesion(){

physicsFrame++;

if(physicsFrame%5!==0)
return;

const distanceMax=10;
const distanceMax2=100;

for(
let i=0;
i<particles.length;
i++
){

const p=particles[i];

for(
let j=i+1;
j<particles.length;
j++
){

const q=particles[j];

const dx=q.x-p.x;

if(Math.abs(dx)>distanceMax)
continue;

const dy=q.y-p.y;

if(Math.abs(dy)>distanceMax)
continue;

const d2=
dx*dx+
dy*dy;

if(
d2>distanceMax2 ||
d2<.1
)
continue;

const d=Math.sqrt(d2);

const target=6.5;

if(d<target){

const force=
(target-d)*.009;

const nx=dx/d;
const ny=dy/d;

p.vx-=nx*force;
p.vy-=ny*force;

q.vx+=nx*force;
q.vy+=ny*force;

}

}

}

}


/* ================================
   VAGUES
================================ */

let waves=[];
let droplets=[];

function addWave(x,y,power){

waves.push({
x:x,
y:y,
r:3,
life:1,
power:power
});

if(waves.length>18)
waves.shift();

}

function updateWaves(){

for(
let i=waves.length-1;
i>=0;
i--
){

const w=waves[i];

w.r+=4*w.power;
w.life-=.025;

if(w.life<=0)
waves.splice(i,1);

}

}


/* ================================
   SPLASH
================================ */

function splash(x,y,vx,vy){

const l=liquids[current];

const amount=
current==="honey"
?4
:8;

for(
let i=0;
i<amount;
i++
){

const a=
Math.random()*Math.PI*2;

const speed=
(1+Math.random()*3)*
l.push;

droplets.push({

x:x,
y:y,

vx:
Math.cos(a)*speed+
vx*.3,

vy:
Math.sin(a)*speed+
vy*.3-
2,

size:
1+Math.random()*2,

life:1

});

}

}

function updateDroplets(){

for(
let i=droplets.length-1;
i>=0;
i--
){

const d=droplets[i];

d.vy+=.14;

d.vx*=.985;
d.vy*=.985;

d.x+=d.vx;
d.y+=d.vy;

d.life-=.025;

if(
d.life<=0 ||
d.y>H
)
droplets.splice(i,1);

}

}


/* ================================
   GOMME
================================ */

function eraseObjects(x,y){

const radius=38;
const radius2=radius*radius;


/* obstacles */

for(
let i=obstacles.length-1;
i>=0;
i--
){

const o=obstacles[i];

if(
x<o.minX-radius ||
x>o.maxX+radius ||
y<o.minY-radius ||
y>o.maxY+radius
)
continue;

const pts=o.points;

let remove=false;

for(
let j=0;
j<pts.length-1;
j++
){

const a=pts[j];
const b=pts[j+1];

if(
pointSegmentDistanceSq(
x,y,
a.x,a.y,
b.x,b.y
)<=radius2
){

remove=true;
break;

}

}

if(remove)
obstacles.splice(i,1);

}

rebuildObstacleGrid();


/* ventilateurs */

for(
let i=fans.length-1;
i>=0;
i--
){

const f=fans[i];

const dx=f.x-x;
const dy=f.y-y;

if(
dx*dx+
dy*dy<
65*65
){

fans.splice(i,1);

if(selectedFan===f)
selectedFan=null;

}

}

}


/* ================================
   MAIN
================================ */

function interact(){

if(
!pointer.down ||
currentTool!=="hand"
)
return;

const l=liquids[current];

const radius=140;
const radius2=radius*radius;

const fx=
pointer.vx*
l.push;

const fy=
pointer.vy*
l.push;

for(
let i=0;
i<particles.length;
i++
){

const p=particles[i];

const dx=p.x-pointer.x;
const dy=p.y-pointer.y;

const d2=
dx*dx+
dy*dy;

if(d2<radius2){

const factor=
1-Math.sqrt(d2)/radius;

p.vx+=
fx*
factor*
.13;

p.vy+=
fy*
factor*
.13;

p.vx-=
dx*
factor*
.002;

p.vy-=
dy*
factor*
.002;

}

}

}


/* ================================
   DESSIN OBSTACLES
================================ */

function drawObstacles(){

ctx.lineCap="round";
ctx.lineJoin="round";

for(
const o of obstacles
){

const pts=o.points;

if(pts.length<2)
continue;

ctx.beginPath();

ctx.moveTo(
pts[0].x,
pts[0].y
);

for(
let i=1;
i<pts.length;
i++
){

ctx.lineTo(
pts[i].x,
pts[i].y
);

}

ctx.strokeStyle="#464b4c";
ctx.lineWidth=o.width;
ctx.stroke();

ctx.strokeStyle=
"rgba(255,255,255,.13)";

ctx.lineWidth=1.5;
ctx.stroke();

}


/* trait en cours */

if(drawingObstacle){

const pts=drawingObstacle.points;

if(pts.length>=2){

ctx.beginPath();

ctx.moveTo(
pts[0].x,
pts[0].y
);

for(
let i=1;
i<pts.length;
i++
){

ctx.lineTo(
pts[i].x,
pts[i].y
);

}

ctx.strokeStyle=
"rgba(150,160,160,.85)";

ctx.lineWidth=14;
ctx.stroke();

}

}

}


/* ================================
   DESSIN VENTILATEURS
================================ */

function drawFans(){

const now=performance.now();

for(
const f of fans
){

const x=f.x;
const y=f.y;

ctx.save();

ctx.translate(x,y);
ctx.rotate(f.angle);


/*
Zone du souffle
*/

ctx.beginPath();

ctx.moveTo(30,-90);
ctx.lineTo(450,-70);
ctx.lineTo(450,70);
ctx.lineTo(30,90);
ctx.closePath();

ctx.fillStyle=
"rgba(170,225,240,.055)";

ctx.fill();


/*
Lignes animées du vent
*/

for(
let i=0;
i<8;
i++
){

const yy=-60+i*17;

const offset=
Math.sin(
now*.007+i
)*18;

ctx.beginPath();

ctx.moveTo(55,yy);

ctx.quadraticCurveTo(
180,
yy+offset,
410,
yy
);

ctx.strokeStyle=
"rgba(180,230,240,.18)";

ctx.lineWidth=1.5;

ctx.stroke();

}


/*
Corps
*/

ctx.beginPath();

ctx.arc(
0,
0,
40,
0,
Math.PI*2
);

ctx.fillStyle="#1d2324";
ctx.fill();

ctx.strokeStyle="#7c8586";
ctx.lineWidth=2;

ctx.stroke();


/*
Pales
*/

for(
let i=0;
i<4;
i++
){

ctx.save();

ctx.rotate(
i*Math.PI/2+
now*.0028
);

ctx.beginPath();

ctx.moveTo(0,0);

ctx.quadraticCurveTo(
22,-12,
34,-3
);

ctx.quadraticCurveTo(
22,12,
0,5
);

ctx.closePath();

ctx.fillStyle="#a0aaab";

ctx.fill();

ctx.restore();

}


/*
Centre
*/

ctx.beginPath();

ctx.arc(
0,
0,
9,
0,
Math.PI*2
);

ctx.fillStyle="#e0e5e5";
ctx.fill();


/*
Petite flèche indiquant le souffle
*/

ctx.beginPath();

ctx.moveTo(58,0);
ctx.lineTo(45,-8);
ctx.lineTo(45,8);
ctx.closePath();

ctx.fillStyle=
"rgba(210,235,240,.7)";

ctx.fill();

ctx.restore();

}

}


/* ================================
   PARTICULES
================================ */

function drawParticles(){

const l=liquids[current];

ctx.fillStyle=l.color;
ctx.globalAlpha=l.alpha;

ctx.beginPath();

for(
let i=0;
i<particles.length;
i++
){

const p=particles[i];

ctx.moveTo(
p.x+p.size,
p.y
);

ctx.arc(
p.x,
p.y,
p.size,
0,
Math.PI*2
);

}

ctx.fill();

ctx.globalAlpha=1;


/* reflets */

ctx.fillStyle=l.light;
ctx.globalAlpha=.22;

ctx.beginPath();

for(
let i=0;
i<particles.length;
i+=6
){

const p=particles[i];

ctx.moveTo(
p.x+p.size*.3,
p.y
);

ctx.arc(
p.x-p.size*.3,
p.y-p.size*.3,
p.size*.3,
0,
Math.PI*2
);

}

ctx.fill();

ctx.globalAlpha=1;

}


/* ================================
   GOUTTES
================================ */

function drawDroplets(){

const l=liquids[current];

ctx.fillStyle=l.light;

for(
const d of droplets
){

ctx.globalAlpha=d.life;

ctx.beginPath();

ctx.arc(
d.x,
d.y,
d.size,
0,
Math.PI*2
);

ctx.fill();

}

ctx.globalAlpha=1;

}


/* ================================
   VAGUES
================================ */

function drawWaves(){

const l=liquids[current];

for(
const w of waves
){

ctx.beginPath();

ctx.arc(
w.x,
w.y,
w.r,
0,
Math.PI*2
);

ctx.strokeStyle=l.light;
ctx.globalAlpha=w.life*.16;
ctx.lineWidth=1.5;

ctx.stroke();

}

ctx.globalAlpha=1;

}


/* ================================
   SURFACE
================================ */

function drawSurface(){

const l=liquids[current];

const base=H-135;

ctx.beginPath();

ctx.moveTo(0,base);

for(
let x=0;
x<=W;
x+=14
){

let y=base;

for(
const w of waves
){

const dx=Math.abs(x-w.x);

if(dx<160){

y-=
Math.sin(
(1-dx/160)*
Math.PI
)*
w.power*
w.life*
8;

}

}

ctx.lineTo(x,y);

}

ctx.lineTo(W,H);
ctx.lineTo(0,H);
ctx.closePath();

ctx.fillStyle=l.dark;
ctx.globalAlpha=.18;

ctx.fill();

ctx.globalAlpha=1;

}


/* ================================
   CURSEUR
================================ */

function drawCursor(){

if(!pointer.down)
return;

if(currentTool==="pencil"){

ctx.beginPath();

ctx.arc(
pointer.x,
pointer.y,
7,
0,
Math.PI*2
);

ctx.fillStyle=
"rgba(190,190,190,.7)";

ctx.fill();

}

else if(currentTool==="eraser"){

ctx.beginPath();

ctx.arc(
pointer.x,
pointer.y,
38,
0,
Math.PI*2
);

ctx.strokeStyle=
"rgba(230,230,230,.45)";

ctx.lineWidth=2;

ctx.stroke();

}

}


/* ================================
   RENDU
================================ */

function render(){

ctx.fillStyle="#0b0f10";

ctx.fillRect(
0,
0,
W,
H
);

drawSurface();

/*
Les ventilateurs sont dessinés AVANT
les particules mais avec une zone visible.
*/

drawObstacles();

drawFans();

drawParticles();

drawDroplets();

drawWaves();

drawCursor();

}


/* ================================
   FPS
================================ */

let fpsFrames=0;
let fpsLast=performance.now();

const fpsValue=
document.getElementById("fpsValue");

function updateFPS(now){

fpsFrames++;

if(
now-fpsLast>500
){

fpsValue.textContent=
Math.round(
fpsFrames*
1000/
(now-fpsLast)
);

fpsFrames=0;
fpsLast=now;

}

}


/* ================================
   BOUCLE
================================ */

let running=false;

function loop(now){

if(!running)
return;

updateFPS(now);

pointer.vx*=.8;
pointer.vy*=.8;

interact();

liquidCohesion();

update();

updateWaves();

updateDroplets();

render();

requestAnimationFrame(loop);

}


/* ================================
   POINTER DOWN
================================ */

canvas.addEventListener(
"pointerdown",
function(e){

if(!running)
return;

pointer.down=true;

pointerMove(
e.clientX,
e.clientY
);


/*
MAIN
*/

if(currentTool==="hand"){

addWave(
e.clientX,
e.clientY,
1.2
);

splash(
e.clientX,
e.clientY,
pointer.vx,
pointer.vy
);

}


/*
CRAYON
*/

else if(
currentTool==="pencil"
){

startObstacle(
e.clientX,
e.clientY
);

}


/*
GOMME
*/

else if(
currentTool==="eraser"
){

eraseObjects(
e.clientX,
e.clientY
);

}


/*
VENTILATEUR
*/

else if(
currentTool==="fan"
){

const existing=
findFan(
e.clientX,
e.clientY
);

if(existing){

/*
On sélectionne le ventilateur.
*/

selectedFan=existing;

}else{

/*
Nouveau ventilateur.
*/

selectedFan=
createFan(
e.clientX,
e.clientY
);

}

}

try{
canvas.setPointerCapture(e.pointerId);
}catch(err){}

},
{passive:false}
);


/* ================================
   POINTER MOVE
================================ */

canvas.addEventListener(
"pointermove",
function(e){

if(
!running ||
!pointer.down
)
return;

pointerMove(
e.clientX,
e.clientY
);


/*
MAIN
*/

if(currentTool==="hand"){

if(
Math.abs(pointer.vx)+
Math.abs(pointer.vy)>3
){

addWave(
e.clientX,
e.clientY,
Math.min(
1.4,
(
Math.abs(pointer.vx)+
Math.abs(pointer.vy)
)/18
)
);

}

}


/*
CRAYON
*/

else if(
currentTool==="pencil"
){

addObstaclePoint(
e.clientX,
e.clientY
);

}


/*
GOMME
*/

else if(
currentTool==="eraser"
){

eraseObjects(
e.clientX,
e.clientY
);

}


/*
VENTILATEUR

Le ventilateur reste à sa position.

La direction est simplement celle
entre le ventilateur et la souris.

Donc :
ventilo en bas + souris au-dessus
= souffle vers le haut.
*/

else if(
currentTool==="fan" &&
selectedFan
){

const dx=
e.clientX-
selectedFan.x;

const dy=
e.clientY-
selectedFan.y;

if(
dx*dx+
dy*dy>
100
){

selectedFan.angle=
Math.atan2(dy,dx);

}

}

},
{passive:false}
);


/* ================================
   POINTER UP
================================ */

canvas.addEventListener(
"pointerup",
function(){

if(
currentTool==="pencil"
)
finishObstacle();

selectedFan=null;

pointer.down=false;

pointer.vx=0;
pointer.vy=0;

}
);

canvas.addEventListener(
"pointercancel",
function(){

if(
currentTool==="pencil"
)
finishObstacle();

selectedFan=null;

pointer.down=false;

}
);


/* ================================
   LIQUIDES
================================ */

document
.querySelectorAll(".liquid")
.forEach(button=>{

button.addEventListener(
"click",
function(){

document
.querySelectorAll(".liquid")
.forEach(b=>
b.classList.remove("active")
);

this.classList.add("active");

current=this.dataset.liquid;

createParticles();

}
);

});


/* ================================
   OUTILS
================================ */

document
.querySelectorAll(".tool")
.forEach(button=>{

button.addEventListener(
"click",
function(){

document
.querySelectorAll(".tool")
.forEach(b=>
b.classList.remove("active")
);

this.classList.add("active");

currentTool=this.dataset.tool;

selectedFan=null;

}
);

});


/* ================================
   START
================================ */

function startGame(){

document
.getElementById("start")
.style.display="none";

createParticles();

running=true;

requestAnimationFrame(loop);

}

</script>

</body>
</html>

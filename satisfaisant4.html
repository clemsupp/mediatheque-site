<body>
<div id="game">

<div id="top">
<div id="title">Liquide</div>

</div>

<canvas id="canvas"></canvas>

<div id="hint">
Main : pousse • Crayon : obstacle • Ventilo : place/oriente • Gomme : supprime
</div>

<button class="liquid active" data-liquid="water">Eau</button>
<button class="liquid" data-liquid="lava">Lave</button>

<div id="start">
<div class="box">
<h1>Liquide</h1>
<p>
Choisis ton liquide puis manipule-le avec ta souris.<br>
Dessine des obstacles et utilise des ventilateurs pour déplacer le liquide.
</p>
<button class="start" onclick="startGame()">Commencer</button>
</div>

</div>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d",{alpha:false});

let W=0,H=0;

function resize(){
W=innerWidth;
H=innerHeight;
canvas.width=W;
canvas.height=H;
}

resize();
window.addEventListener("resize",resize);


/* =========================
   LIQUIDES
========================= */

const liquids={

water:{
gravity:.17,
friction:.985,
push:1.5,
size:3,
color:"#3289a8",
light:"#a9edff",
dark:"#123f52",
alpha:.72
},

lava:{
gravity:.10,
friction:.992,
push:.65,
size:3.8,
color:"#d94d19",
light:"#ffd36a",
dark:"#5d1808",
alpha:.82
},

oil:{
gravity:.13,
friction:.993,
push:.75,
size:3.3,
color:"#726a45",
light:"#d5c98e",
dark:"#252215",
alpha:.72
},

milk:{
gravity:.18,
friction:.984,
push:1.15,
size:3.5,
color:"#d7d8d0",
light:"#ffffff",
dark:"#777a75",
alpha:.82
},

honey:{
gravity:.11,
friction:.996,
push:.48,
size:4,
color:"#d2951d",
light:"#ffe58a",
dark:"#633707",
alpha:.86
},

slime:{
gravity:.16,
friction:.989,
push:1.1,
size:3.6,
color:"#62b84c",
light:"#caff91",
dark:"#1d5b20",
alpha:.78
}

};

let current="water";
let currentTool="hand";

let particles=[];
let obstacles=[];
let fans=[];
let waves=[];
let droplets=[];


/* =========================
   PARTICULES
========================= */

const MAX_PARTICLES=3200;

function createParticles(){

particles.length=0;

const l=liquids[current];

const startY=Math.max(145,H*.34);
const bottom=H-145;

const spacing=Math.max(
5,
Math.sqrt(
(W*(bottom-startY))/MAX_PARTICLES
)
);

for(let y=startY;y<bottom;y+=spacing){

for(let x=12;x<W-12;x+=spacing){

if(particles.length>=MAX_PARTICLES)break;

particles.push({

x:x+(Math.random()-.5)*2,
y:y+(Math.random()-.5)*2,

vx:(Math.random()-.5)*.15,
vy:(Math.random()-.5)*.1,

size:l.size*(.75+Math.random()*.45)

});

}

if(particles.length>=MAX_PARTICLES)break;

}

}


/* =========================
   POINTEUR
========================= */

const pointer={
x:0,
y:0,
px:0,
py:0,
vx:0,
vy:0,
down:false
};

function pointerMove(x,y){

pointer.px=pointer.x;
pointer.py=pointer.y;

pointer.x=x;
pointer.y=y;

pointer.vx=x-pointer.px;
pointer.vy=y-pointer.py;

}


/* =========================
   CRAYON OPTIMISÉ
========================= */

let drawingObstacle=null;

/*
On garde seulement un point tous les ~12 pixels.
Cela évite d'avoir des centaines de segments
pour un seul trait.
*/

const PENCIL_STEP=12;

function startObstacle(x,y){

drawingObstacle={
points:[{
x:x,
y:y
}],

minX:x,
maxX:x,
minY:y,
maxY:y
};

}

function addObstaclePoint(x,y){

if(!drawingObstacle)return;

const pts=drawingObstacle.points;

const last=pts[pts.length-1];

const dx=x-last.x;
const dy=y-last.y;

if(dx*dx+dy*dy<PENCIL_STEP*PENCIL_STEP)
return;

pts.push({
x:x,
y:y
});

if(x<drawingObstacle.minX)drawingObstacle.minX=x;
if(x>drawingObstacle.maxX)drawingObstacle.maxX=x;
if(y<drawingObstacle.minY)drawingObstacle.minY=y;
if(y>drawingObstacle.maxY)drawingObstacle.maxY=y;

}

function finishObstacle(){

if(!drawingObstacle)return;

if(drawingObstacle.points.length>=2){

const o=drawingObstacle;

obstacles.push({

points:o.points,

minX:o.minX-12,
maxX:o.maxX+12,
minY:o.minY-12,
maxY:o.maxY+12,

width:14

});

}

drawingObstacle=null;

}


/* =========================
   COLLISION RAPIDE
========================= */

function pointSegmentDistanceSq(
px,py,
ax,ay,
bx,by
){

const dx=bx-ax;
const dy=by-ay;

const len2=dx*dx+dy*dy;

if(len2===0){

const ex=px-ax;
const ey=py-ay;

return ex*ex+ey*ey;

}

let t=
((px-ax)*dx+
(py-ay)*dy)/len2;

if(t<0)t=0;
else if(t>1)t=1;

const cx=ax+t*dx;
const cy=ay+t*dy;

const ex=px-cx;
const ey=py-cy;

return ex*ex+ey*ey;

}


/*
Seulement les obstacles proches de la particule
sont testés.
*/

function collideObstacles(p){

for(let oi=0;oi<obstacles.length;oi++){

const obstacle=obstacles[oi];

/* énorme gain de performance */

if(
p.x<obstacle.minX ||
p.x>obstacle.maxX ||
p.y<obstacle.minY ||
p.y>obstacle.maxY
)continue;

const pts=obstacle.points;

const radius=p.size+obstacle.width*.5;
const radius2=radius*radius;

for(let i=0;i<pts.length-1;i++){

const a=pts[i];
const b=pts[i+1];

if(
p.x<Math.min(a.x,b.x)-radius ||
p.x>Math.max(a.x,b.x)+radius ||
p.y<Math.min(a.y,b.y)-radius ||
p.y>Math.max(a.y,b.y)+radius
)continue;

const d2=pointSegmentDistanceSq(
p.x,p.y,
a.x,a.y,
b.x,b.y
);

if(d2>=radius2)continue;

const dx=b.x-a.x;
const dy=b.y-a.y;

const len=Math.hypot(dx,dy)||1;

const nx=-dy/len;
const ny=dx/len;

const d=Math.sqrt(d2)||.001;

const penetration=radius-d;

/* déterminer le côté réel du trait */

let t=
((p.x-a.x)*dx+
(p.y-a.y)*dy)/(len*len);

if(t<0)t=0;
else if(t>1)t=1;

const cx=a.x+t*dx;
const cy=a.y+t*dy;

let rx=p.x-cx;
let ry=p.y-cy;

const rl=Math.hypot(rx,ry)||1;

rx/=rl;
ry/=rl;

/* correction */

p.x+=rx*(penetration+1);
p.y+=ry*(penetration+1);

/* rebond */

const dot=p.vx*rx+p.vy*ry;

if(dot<0){

p.vx-=dot*1.75*rx;
p.vy-=dot*1.75*ry;

p.vx*=.72;
p.vy*=.72;

}

}

}

}


/* =========================
   GOMME
========================= */

function eraseObjects(x,y){

const radius=34;
const radius2=radius*radius;


/* obstacles */

for(let i=obstacles.length-1;i>=0;i--){

const o=obstacles[i];

if(
x<o.minX-radius ||
x>o.maxX+radius ||
y<o.minY-radius ||
y>o.maxY+radius
)continue;

const pts=o.points;

let removed=false;

for(let j=0;j<pts.length-1;j++){

const a=pts[j];
const b=pts[j+1];

if(
pointSegmentDistanceSq(
x,y,
a.x,a.y,
b.x,b.y
)<=radius2
){

obstacles.splice(i,1);
removed=true;
break;

}

}

if(removed)continue;

}


/* ventilateurs */

for(let i=fans.length-1;i>=0;i--){

const f=fans[i];

const dx=f.x-x;
const dy=f.y-y;

if(dx*dx+dy*dy<55*55){

fans.splice(i,1);

}

}

}


/* =========================
   VENTILATEURS
========================= */

let fanAction=null;

function createFan(x,y){

const fan={

x:x,
y:y,

angle:0,

/* BEAUCOUP PLUS PUISSANT */

power:3.8

};

fans.push(fan);

return fan;

}

function findFan(x,y){

for(let i=fans.length-1;i>=0;i--){

const f=fans[i];

const dx=f.x-x;
const dy=f.y-y;

if(dx*dx+dy*dy<48*48)
return f;

}

return null;

}


/* =========================
   SOUFFLE PUISSANT
========================= */

function applyFans(){

for(let fi=0;fi<fans.length;fi++){

const f=fans[fi];

const cos=Math.cos(f.angle);
const sin=Math.sin(f.angle);

const range=420;
const width=155;

for(let i=0;i<particles.length;i++){

const p=particles[i];

const dx=p.x-f.x;
const dy=p.y-f.y;

/*
projection dans la direction du vent
*/

const forward=
dx*cos+
dy*sin;

if(forward<0||forward>range)
continue;

const side=
-dx*sin+
dy*cos;

const widthAtDistance=
width+
forward*.18;

if(Math.abs(side)>widthAtDistance)
continue;

const distanceFactor=
1-forward/range;

const sideFactor=
1-Math.abs(side)/widthAtDistance;

/*
souffle très puissant
*/

const force=
f.power*
distanceFactor*
distanceFactor*
sideFactor*
.19;

p.vx+=cos*force;
p.vy+=sin*force;

/*
petite turbulence
*/

const turbulence=
sideFactor*
distanceFactor*
.018;

p.vx+=-sin*turbulence;
p.vy+=cos*turbulence;

}

}

}


/* =========================
   DESSIN VENTILATEURS
========================= */

function drawFans(){

const now=performance.now();

for(const f of fans){

const x=f.x;
const y=f.y;

ctx.save();

ctx.translate(x,y);
ctx.rotate(f.angle);


/* souffle */

ctx.beginPath();

ctx.moveTo(25,-75);
ctx.lineTo(390,-58);
ctx.lineTo(390,58);
ctx.lineTo(25,75);

ctx.closePath();

ctx.fillStyle="rgba(170,220,230,.045)";
ctx.fill();


/* lignes du vent */

for(let j=0;j<7;j++){

const yy=-54+j*18;

ctx.beginPath();

ctx.moveTo(48,yy);

const moving=
Math.sin(now*.006+j)*15;

ctx.quadraticCurveTo(
170,
yy+moving,
360,
yy
);

ctx.strokeStyle="rgba(180,225,235,.16)";
ctx.lineWidth=1.5;
ctx.stroke();

}


/* corps */

ctx.beginPath();

ctx.arc(
0,
0,
36,
0,
Math.PI*2
);

ctx.fillStyle="#202728";
ctx.fill();

ctx.strokeStyle="#697071";
ctx.lineWidth=2;
ctx.stroke();


/* pales */

for(let i=0;i<4;i++){

const a=
i*Math.PI/2+
now*.0025;

ctx.save();

ctx.rotate(a);

ctx.beginPath();

ctx.moveTo(0,0);

ctx.quadraticCurveTo(
19,-10,
31,-3
);

ctx.quadraticCurveTo(
19,10,
0,4
);

ctx.closePath();

ctx.fillStyle="#899293";
ctx.fill();

ctx.restore();

}


/* centre */

ctx.beginPath();

ctx.arc(
0,
0,
8,
0,
Math.PI*2
);

ctx.fillStyle="#d0d7d8";
ctx.fill();


ctx.restore();


/* petite base */

ctx.beginPath();

ctx.arc(
x-Math.cos(f.angle)*28,
y-Math.sin(f.angle)*28,
6,
0,
Math.PI*2
);

ctx.fillStyle="#555d5e";
ctx.fill();

}

}


/* =========================
   MAIN
========================= */

function interact(){

if(!pointer.down||currentTool!=="hand")
return;

const l=liquids[current];

const radius=140;
const radius2=radius*radius;

const fx=pointer.vx*l.push;
const fy=pointer.vy*l.push;

for(let i=0;i<particles.length;i++){

const p=particles[i];

const dx=p.x-pointer.x;
const dy=p.y-pointer.y;

const d2=dx*dx+dy*dy;

if(d2<radius2){

const factor=
1-Math.sqrt(d2)/radius;

p.vx+=fx*factor*.13;
p.vy+=fy*factor*.13;

p.vx-=dx*factor*.002;
p.vy-=dy*factor*.002;

}

}

}


/* =========================
   PHYSIQUE
========================= */

function update(){

const l=liquids[current];

/*
Une seule étape physique.
Le test de proximité des obstacles
évite les gros ralentissements.
*/

for(let i=0;i<particles.length;i++){

const p=particles[i];

p.vy+=l.gravity;

p.vx*=l.friction;
p.vy*=l.friction;

p.x+=p.vx;
p.y+=p.vy;


/* sol */

const bottom=H-135;

if(p.y>bottom){

p.y=bottom;

if(p.vy>0)
p.vy*=-.25;

p.vx*=.94;

}


/* plafond */

if(p.y<78){

p.y=78;

p.vy=Math.abs(p.vy)*.2;

}


/* murs */

if(p.x<p.size){

p.x=p.size;

p.vx=Math.abs(p.vx)*.3;

}

else if(p.x>W-p.size){

p.x=W-p.size;

p.vx=-Math.abs(p.vx)*.3;

}


/* obstacles */

if(obstacles.length)
collideObstacles(p);

}


/* ventilateurs */

if(fans.length)
applyFans();

}


/* =========================
   COHESION
========================= */

let physicsFrame=0;

function liquidCohesion(){

physicsFrame++;

if(physicsFrame%4!==0)
return;

const distanceMax=10;
const distanceMax2=distanceMax*distanceMax;

for(let i=0;i<particles.length;i++){

const p=particles[i];

for(let j=i+1;j<particles.length;j++){

const q=particles[j];

const dx=q.x-p.x;

if(Math.abs(dx)>distanceMax)
continue;

const dy=q.y-p.y;

if(Math.abs(dy)>distanceMax)
continue;

const d2=dx*dx+dy*dy;

if(d2>distanceMax2||d2<.1)
continue;

const d=Math.sqrt(d2);

const target=6.5;

if(d<target){

const force=(target-d)*.009;

const nx=dx/d;
const ny=dy/d;

p.vx-=nx*force;
p.vy-=ny*force;

q.vx+=nx*force;
q.vy+=ny*force;

}

}

}

}


/* =========================
   VAGUES
========================= */

function addWave(x,y,power){

waves.push({
x:x,
y:y,
r:3,
life:1,
power:power
});

if(waves.length>18)
waves.shift();

}

function updateWaves(){

for(let i=waves.length-1;i>=0;i--){

const w=waves[i];

w.r+=4*w.power;
w.life-=.025;

if(w.life<=0)
waves.splice(i,1);

}

}


/* =========================
   ECLABOUSSURES
========================= */

function splash(x,y,vx,vy){

const l=liquids[current];

const amount=current==="honey"?4:9;

for(let i=0;i<amount;i++){

const a=Math.random()*Math.PI*2;

const speed=
(1+Math.random()*3)*l.push;

droplets.push({

x:x,
y:y,

vx:Math.cos(a)*speed+vx*.3,
vy:Math.sin(a)*speed+vy*.3-2,

size:1+Math.random()*2,

life:1

});

}

}

function updateDroplets(){

for(let i=droplets.length-1;i>=0;i--){

const d=droplets[i];

d.vy+=.14;

d.vx*=.985;
d.vy*=.985;

d.x+=d.vx;
d.y+=d.vy;

d.life-=.025;

if(d.life<=0||d.y>H)
droplets.splice(i,1);

}

}


/* =========================
   PARTICULES
========================= */

function drawParticles(){

const l=liquids[current];

ctx.fillStyle=l.color;
ctx.globalAlpha=l.alpha;

ctx.beginPath();

for(let i=0;i<particles.length;i++){

const p=particles[i];

ctx.moveTo(
p.x+p.size,
p.y
);

ctx.arc(
p.x,
p.y,
p.size,
0,
Math.PI*2
);

}

ctx.fill();

ctx.globalAlpha=1;


/* lumière */

ctx.fillStyle=l.light;
ctx.globalAlpha=.22;

ctx.beginPath();

for(let i=0;i<particles.length;i+=6){

const p=particles[i];

ctx.moveTo(
p.x+p.size*.3,
p.y
);

ctx.arc(
p.x-p.size*.3,
p.y-p.size*.3,
p.size*.3,
0,
Math.PI*2
);

}

ctx.fill();

ctx.globalAlpha=1;

}


/* =========================
   GOUTTES
========================= */

function drawDroplets(){

const l=liquids[current];

ctx.fillStyle=l.light;

for(let i=0;i<droplets.length;i++){

const d=droplets[i];

ctx.globalAlpha=d.life;

ctx.beginPath();

ctx.arc(
d.x,
d.y,
d.size,
0,
Math.PI*2
);

ctx.fill();

}

ctx.globalAlpha=1;

}


/* =========================
   OBSTACLES
========================= */

function drawObstacles(){

ctx.lineCap="round";
ctx.lineJoin="round";

for(const o of obstacles){

const pts=o.points;

if(pts.length<2)
continue;

ctx.beginPath();

ctx.moveTo(
pts[0].x,
pts[0].y
);

for(let i=1;i<pts.length;i++)
ctx.lineTo(
pts[i].x,
pts[i].y
);

ctx.strokeStyle="#464b4c";
ctx.lineWidth=o.width;
ctx.stroke();

ctx.strokeStyle="rgba(255,255,255,.12)";
ctx.lineWidth=1.5;
ctx.stroke();

}


/* trait en cours */

if(drawingObstacle){

const pts=drawingObstacle.points;

if(pts.length>=2){

ctx.beginPath();

ctx.moveTo(
pts[0].x,
pts[0].y
);

for(let i=1;i<pts.length;i++)
ctx.lineTo(
pts[i].x,
pts[i].y
);

ctx.strokeStyle="rgba(140,150,150,.85)";
ctx.lineWidth=14;
ctx.stroke();

}

}

}


/* =========================
   VAGUES
========================= */

function drawWaves(){

const l=liquids[current];

for(const w of waves){

ctx.beginPath();

ctx.arc(
w.x,
w.y,
w.r,
0,
Math.PI*2
);

ctx.strokeStyle=l.light;
ctx.globalAlpha=w.life*.16;
ctx.lineWidth=1.5;

ctx.stroke();

}

ctx.globalAlpha=1;

}


/* =========================
   SURFACE
========================= */

function drawSurface(){

const l=liquids[current];

const base=H-135;

ctx.beginPath();

ctx.moveTo(0,base);

for(let x=0;x<=W;x+=12){

let y=base;

for(const w of waves){

const dx=Math.abs(x-w.x);

if(dx<160){

y-=
Math.sin(
(1-dx/160)*Math.PI
)*
w.power*
w.life*
8;

}

}

ctx.lineTo(x,y);

}

ctx.lineTo(W,H);
ctx.lineTo(0,H);
ctx.closePath();

ctx.fillStyle=l.dark;
ctx.globalAlpha=.18;
ctx.fill();

ctx.globalAlpha=1;

}


/* =========================
   CURSEUR
========================= */

function drawToolCursor(){

if(!pointer.down)
return;

if(currentTool==="hand")
return;

if(currentTool==="pencil"){

ctx.beginPath();

ctx.arc(
pointer.x,
pointer.y,
7,
0,
Math.PI*2
);

ctx.fillStyle="rgba(180,180,180,.65)";
ctx.fill();

}

if(currentTool==="eraser"){

ctx.beginPath();

ctx.arc(
pointer.x,
pointer.y,
34,
0,
Math.PI*2
);

ctx.strokeStyle="rgba(220,220,220,.45)";
ctx.lineWidth=2;

ctx.stroke();

}

}


/* =========================
   RENDU
========================= */

function render(){

ctx.fillStyle="#0c1011";

ctx.fillRect(
0,
0,
W,
H
);

drawSurface();
drawObstacles();
drawFans();
drawParticles();
drawDroplets();
drawWaves();
drawToolCursor();

}


/* =========================
   FPS
========================= */

let fpsFrames=0;
let fpsLast=performance.now();

const fpsValue=
document.getElementById("fpsValue");

function updateFPS(now){

fpsFrames++;

if(now-fpsLast>500){

const fps=
Math.round(
fpsFrames*1000/
(now-fpsLast)
);

fpsValue.textContent=fps;

fpsFrames=0;
fpsLast=now;

}

}


/* =========================
   BOUCLE
========================= */

let running=false;

function loop(now){

if(!running)
return;

updateFPS(now);

pointer.vx*=.8;
pointer.vy*=.8;

interact();

liquidCohesion();

update();

updateWaves();

updateDroplets();

render();

requestAnimationFrame(loop);

}


/* =========================
   POINTER DOWN
========================= */

canvas.addEventListener(
"pointerdown",
function(e){

if(!running)
return;

pointer.down=true;

pointerMove(
e.clientX,
e.clientY
);


if(currentTool==="hand"){

addWave(
e.clientX,
e.clientY,
1.2
);

splash(
e.clientX,
e.clientY,
pointer.vx,
pointer.vy
);

}


else if(currentTool==="pencil"){

startObstacle(
e.clientX,
e.clientY
);

}


else if(currentTool==="eraser"){

eraseObjects(
e.clientX,
e.clientY
);

}


else if(currentTool==="fan"){

const existing=
findFan(
e.clientX,
e.clientY
);

if(existing){

/*
On prend le ventilateur.
La rotation se fera simplement
en bougeant la souris.
*/

fanAction={
fan:existing
};

}
else{

const fan=
createFan(
e.clientX,
e.clientY
);

fanAction={
fan:fan
};

}

}

try{
canvas.setPointerCapture(e.pointerId);
}catch(err){}

},
{passive:false}
);


/* =========================
   POINTER MOVE
========================= */

canvas.addEventListener(
"pointermove",
function(e){

if(!running||!pointer.down)
return;

pointerMove(
e.clientX,
e.clientY
);


if(currentTool==="hand"){

if(
Math.abs(pointer.vx)+
Math.abs(pointer.vy)>3
){

addWave(
e.clientX,
e.clientY,
Math.min(
1.4,
(
Math.abs(pointer.vx)+
Math.abs(pointer.vy)
)/18
)
);

}

}


else if(currentTool==="pencil"){

addObstaclePoint(
e.clientX,
e.clientY
);

}


else if(currentTool==="eraser"){

eraseObjects(
e.clientX,
e.clientY
);

}


else if(
currentTool==="fan" &&
fanAction
){

const f=fanAction.fan;

/*
On déplace le curseur autour du ventilateur.
La direction du curseur devient
directement la direction du souffle.
*/

const dx=
e.clientX-f.x;

const dy=
e.clientY-f.y;

if(dx*dx+dy*dy>64){

f.angle=
Math.atan2(dy,dx);

}

}

},
{passive:false}
);


/* =========================
   POINTER UP
========================= */

canvas.addEventListener(
"pointerup",
function(){

if(currentTool==="pencil")
finishObstacle();

fanAction=null;

pointer.down=false;

pointer.vx=0;
pointer.vy=0;

}
);

canvas.addEventListener(
"pointercancel",
function(){

if(currentTool==="pencil")
finishObstacle();

fanAction=null;

pointer.down=false;

}
);


/* =========================
   LIQUIDES
========================= */

document.querySelectorAll(".liquid")
.forEach(button=>{

button.addEventListener(
"click",
function(){

document
.querySelectorAll(".liquid")
.forEach(b=>
b.classList.remove("active")
);

this.classList.add("active");

current=this.dataset.liquid;

createParticles();

}
);

});


/* =========================
   OUTILS
========================= */

document.querySelectorAll(".tool")
.forEach(button=>{

button.addEventListener(
"click",
function(){

document
.querySelectorAll(".tool")
.forEach(b=>
b.classList.remove("active")
);

this.classList.add("active");

currentTool=this.dataset.tool;

}
);

});


/* =========================
   START
========================= */

function startGame(){

document.getElementById("start").style.display="none";

createParticles();

running=true;

requestAnimationFrame(loop);

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,maximum-scale=1.0">
<meta name="HandheldFriendly" content="true">
<title>Liquide</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#090b0c;
touch-action:none;
user-select:none;
-webkit-user-select:none;
-webkit-touch-callout:none;
}

body{
font-family:Arial,sans-serif;
color:#eee;
}

#game{
position:relative;
width:100%;
height:100%;
overflow:hidden;
background:
radial-gradient(circle at 50% 35%,#1b2224 0%,#101416 48%,#080a0b 100%);
}

canvas{
position:absolute;
inset:0;
width:100%;
height:100%;
display:block;
touch-action:none;
}

#top{
position:absolute;
top:0;
left:0;
right:0;
height:72px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 24px;
z-index:20;
background:rgba(8,10,11,.75);
border-bottom:1px solid rgba(255,255,255,.07);
backdrop-filter:blur(8px);
-webkit-backdrop-filter:blur(8px);
pointer-events:none;
}

#title{
font-family:Georgia,serif;
font-size:23px;
}

#back{
pointer-events:auto;
text-decoration:none;
color:#ddd;
background:#191c1d;
border:1px solid rgba(255,255,255,.12);
border-radius:6px;
padding:9px 14px;
font-size:13px;
}

#hint{
position:absolute;
top:89px;
left:50%;
transform:translateX(-50%);
z-index:10;
font-size:12px;
color:#666;
white-space:nowrap;
pointer-events:none;
}

#controls{
position:absolute;
bottom:17px;
left:17px;
z-index:30;
display:flex;
gap:6px;
padding:7px;
background:rgba(10,12,13,.8);
border:1px solid rgba(255,255,255,.08);
border-radius:10px;
}

.liquid{
border:1px solid rgba(255,255,255,.1);
background:#181b1c;
color:#999;
border-radius:6px;
padding:8px 11px;
font-size:12px;
cursor:pointer;
}

.liquid.active{
background:#315b57;
color:#fff;
border-color:#4d7772;
}

#fps{
position:absolute;
right:17px;
bottom:17px;
z-index:30;
font-size:11px;
color:#555;
background:rgba(10,12,13,.7);
padding:8px 10px;
border-radius:7px;
pointer-events:none;
}

#start{
position:absolute;
inset:0;
z-index:100;
display:flex;
align-items:center;
justify-content:center;
background:rgba(7,9,10,.91);
}

.box{
width:min(92%,480px);
padding:38px;
background:#15191a;
border:1px solid rgba(255,255,255,.08);
border-radius:12px;
text-align:center;
box-shadow:0 25px 70px rgba(0,0,0,.5);
}

.box h1{
font-family:Georgia,serif;
font-size:42px;
font-weight:normal;
margin-bottom:15px;
}

.box p{
color:#818687;
font-size:14px;
line-height:1.8;
margin-bottom:26px;
}

.start{
border:0;
background:#315b57;
color:#fff;
padding:14px 30px;
border-radius:6px;
font-size:14px;
cursor:pointer;
}

@media(max-width:650px){

#top{
height:64px;
padding:0 15px;
}

#title{
font-size:19px;
}

#hint{
top:78px;
font-size:11px;
}

#controls{
left:8px;
right:8px;
bottom:8px;
overflow-x:auto;
}

.liquid{
white-space:nowrap;
}

#fps{
display:none;
}

}
</style>
</head>

<body>

<div id="game">

<div id="top">
<div id="title">Liquide</div>
<a id="back" href="index.html">← Jeux</a>
</div>

<canvas id="canvas"></canvas>

<div id="hint">
Maintiens et glisse pour déplacer le liquide
</div>

<div id="controls">

<button class="liquid active" data-liquid="water">Eau</button>
<button class="liquid" data-liquid="lava">Lave</button>
<button class="liquid" data-liquid="oil">Huile</button>
<button class="liquid" data-liquid="milk">Lait</button>
<button class="liquid" data-liquid="honey">Miel</button>
<button class="liquid" data-liquid="slime">Slime</button>

</div>

<div id="fps">FPS : <span id="fpsValue">0</span></div>

<div id="start">

<div class="box">

<h1>Liquide</h1>

<p>
Choisis un liquide puis maintiens et fais glisser
ta souris ou ton doigt pour le manipuler.
</p>

<button class="start" onclick="startGame()">
Commencer
</button>

</div>

</div>

</div>

<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d",{alpha:false});

let W=0;
let H=0;

function resize(){

W=innerWidth;
H=innerHeight;

canvas.width=W;
canvas.height=H;

}

resize();
addEventListener("resize",resize);


/* =========================================================
   LIQUIDES
========================================================= */

const liquids={

water:{
gravity:.17,
friction:.985,
push:1.5,
size:3,
color:"#3289a8",
light:"#a9edff",
dark:"#123f52",
alpha:.72
},

lava:{
gravity:.10,
friction:.992,
push:.65,
size:3.8,
color:"#d94d19",
light:"#ffd36a",
dark:"#5d1808",
alpha:.82
},

oil:{
gravity:.13,
friction:.993,
push:.75,
size:3.3,
color:"#726a45",
light:"#d5c98e",
dark:"#252215",
alpha:.72
},

milk:{
gravity:.18,
friction:.984,
push:1.15,
size:3.5,
color:"#d7d8d0",
light:"#ffffff",
dark:"#777a75",
alpha:.82
},

honey:{
gravity:.11,
friction:.996,
push:.48,
size:4,
color:"#d2951d",
light:"#ffe58a",
dark:"#633707",
alpha:.86
},

slime:{
gravity:.16,
friction:.989,
push:1.1,
size:3.6,
color:"#62b84c",
light:"#caff91",
dark:"#1d5b20",
alpha:.78
}

};

let current="water";


/* =========================================================
   PARTICULES
========================================================= */

/*
   Beaucoup moins de particules que l'ancienne version.
   Le rendu reste dense grâce à leur taille.
*/

const MAX_PARTICLES=1450;

let particles=[];

function createParticles(){

particles.length=0;

const l=liquids[current];

const spacing=Math.max(
7,
Math.sqrt((W*(H*.42))/MAX_PARTICLES)
);

const startY=Math.max(155,H*.45);
const bottom=H-25;

for(let y=startY;y<bottom;y+=spacing){

for(let x=18;x<W-18;x+=spacing){

if(particles.length>=MAX_PARTICLES)break;

particles.push({

x:x+(Math.random()-.5)*2,
y:y+(Math.random()-.5)*2,

vx:(Math.random()-.5)*.15,
vy:(Math.random()-.5)*.1,

size:l.size*(.75+Math.random()*.45)

});

}

if(particles.length>=MAX_PARTICLES)break;

}

}


/* =========================================================
   SOURIS
========================================================= */

const pointer={
x:0,
y:0,
px:0,
py:0,
vx:0,
vy:0,
down:false
};

function pointerMove(x,y){

pointer.px=pointer.x;
pointer.py=pointer.y;

pointer.x=x;
pointer.y=y;

pointer.vx=x-pointer.px;
pointer.vy=y-pointer.py;

}


/* =========================================================
   INTERACTION
========================================================= */

function interact(){

if(!pointer.down)return;

const l=liquids[current];

const radius=125;
const radius2=radius*radius;

const forceX=pointer.vx*l.push;
const forceY=pointer.vy*l.push;

for(let i=0;i<particles.length;i++){

const p=particles[i];

const dx=p.x-pointer.x;
const dy=p.y-pointer.y;

const d2=dx*dx+dy*dy;

if(d2<radius2){

const factor=1-Math.sqrt(d2)/radius;

p.vx+=forceX*factor*.11;
p.vy+=forceY*factor*.11;

/* aspiration légère autour du doigt */

p.vx-=dx*factor*.002;
p.vy-=dy*factor*.002;

}

}

}


/* =========================================================
   PHYSIQUE
========================================================= */

function update(){

const l=liquids[current];

/*
   Limitation de la physique :
   on ne fait pas de comparaison entre toutes
   les particules.
*/

for(let i=0;i<particles.length;i++){

const p=particles[i];


/* gravité */

p.vy+=l.gravity;


/* viscosité */

p.vx*=l.friction;
p.vy*=l.friction;


/* vitesse */

p.x+=p.vx;
p.y+=p.vy;


/* sol */

const bottom=H-17;

if(p.y>bottom){

p.y=bottom;

if(p.vy>0){

p.vy*=-.25;

}

p.vx*=.94;

}


/* plafond */

if(p.y<75){

p.y=75;

p.vy=Math.abs(p.vy)*.2;

}


/* murs */

if(p.x<p.size){

p.x=p.size;
p.vx=Math.abs(p.vx)*.3;

}

else if(p.x>W-p.size){

p.x=W-p.size;
p.vx=-Math.abs(p.vx)*.3;

}

}

}


/* =========================================================
   RÉALISME : ATTRACTION LOCALE
========================================================= */

/*
   On ne calcule cette partie qu'une frame sur deux.
   Cela économise énormément de puissance.
*/

let physicsFrame=0;

function liquidCohesion(){

physicsFrame++;

if(physicsFrame%2!==0)return;

const l=liquids[current];

const distanceMax=12;
const distanceMax2=distanceMax*distanceMax;

/*
   Seulement quelques voisins proches.
*/

for(let i=0;i<particles.length;i++){

const p=particles[i];

for(let j=i+1;j<particles.length;j++){

const q=particles[j];

const dx=q.x-p.x;

if(Math.abs(dx)>distanceMax)continue;

const dy=q.y-p.y;

if(Math.abs(dy)>distanceMax)continue;

const d2=dx*dx+dy*dy;

if(d2>distanceMax2||d2<.1)continue;

const d=Math.sqrt(d2);

const target=7.5;

if(d<target){

const force=(target-d)*.012;

const nx=dx/d;
const ny=dy/d;

p.vx-=nx*force;
p.vy-=ny*force;

q.vx+=nx*force;
q.vy+=ny*force;

}

}

}

}


/* =========================================================
   VAGUES
========================================================= */

let waves=[];

function addWave(x,y,power){

waves.push({

x:x,
y:y,
r:3,
life:1,
power:power

});

if(waves.length>18){

waves.shift();

}

}

function updateWaves(){

for(let i=waves.length-1;i>=0;i--){

const w=waves[i];

w.r+=4*w.power;
w.life-=.025;

if(w.life<=0){

waves.splice(i,1);

}

}

}


/* =========================================================
   GOUTTES
========================================================= */

let droplets=[];

function splash(x,y,vx,vy){

const l=liquids[current];

const amount=current==="honey"?4:8;

for(let i=0;i<amount;i++){

const a=Math.random()*Math.PI*2;
const speed=(1+Math.random()*3)*l.push;

droplets.push({

x:x,
y:y,

vx:Math.cos(a)*speed+vx*.3,
vy:Math.sin(a)*speed+vy*.3-2,

size:1+Math.random()*2,

life:1

});

}

}

function updateDroplets(){

for(let i=droplets.length-1;i>=0;i--){

const d=droplets[i];

d.vy+=.14;

d.vx*=.985;
d.vy*=.985;

d.x+=d.vx;
d.y+=d.vy;

d.life-=.025;

if(d.life<=0||d.y>H){

droplets.splice(i,1);

}

}

}


/* =========================================================
   RENDU PARTICULES
========================================================= */

function drawParticles(){

const l=liquids[current];

/*
   Pas de gradient individuel :
   les gradients par particule étaient une grosse
   source de ralentissement.
*/

ctx.fillStyle=l.color;

ctx.globalAlpha=l.alpha;

ctx.beginPath();

for(let i=0;i<particles.length;i++){

const p=particles[i];

ctx.moveTo(p.x+p.size,p.y);

ctx.arc(
p.x,
p.y,
p.size,
0,
Math.PI*2
);

}

ctx.fill();

ctx.globalAlpha=1;


/* petite lumière uniquement sur une fraction */

ctx.fillStyle=l.light;
ctx.globalAlpha=.25;

ctx.beginPath();

for(let i=0;i<particles.length;i+=4){

const p=particles[i];

ctx.arc(
p.x-p.size*.3,
p.y-p.size*.3,
p.size*.32,
0,
Math.PI*2
);

}

ctx.fill();

ctx.globalAlpha=1;

}


/* =========================================================
   DESSIN GOUTTES
========================================================= */

function drawDroplets(){

const l=liquids[current];

ctx.fillStyle=l.light;

for(let i=0;i<droplets.length;i++){

const d=droplets[i];

ctx.globalAlpha=d.life;

ctx.beginPath();

ctx.arc(
d.x,
d.y,
d.size,
0,
Math.PI*2
);

ctx.fill();

}

ctx.globalAlpha=1;

}


/* =========================================================
   DESSIN VAGUES
========================================================= */

function drawWaves(){

const l=liquids[current];

for(let i=0;i<waves.length;i++){

const w=waves[i];

ctx.beginPath();

ctx.arc(
w.x,
w.y,
w.r,
0,
Math.PI*2
);

ctx.strokeStyle=
l.light;

ctx.globalAlpha=w.life*.16;

ctx.lineWidth=1.5;

ctx.stroke();

}

ctx.globalAlpha=1;

}


/* =========================================================
   SURFACE
========================================================= */

function drawSurface(){

const l=liquids[current];

const base=H-12;

ctx.beginPath();

ctx.moveTo(0,base);

for(let x=0;x<=W;x+=12){

let y=base;

for(let i=0;i<waves.length;i++){

const w=waves[i];

const dx=Math.abs(x-w.x);

if(dx<160){

const strength=1-dx/160;

y-=Math.sin(strength*Math.PI)
*w.power
*w.life
*8;

}

}

ctx.lineTo(x,y);

}

ctx.lineTo(W,H);
ctx.lineTo(0,H);
ctx.closePath();

ctx.fillStyle=l.dark;
ctx.globalAlpha=.2;

ctx.fill();

ctx.globalAlpha=1;

}


/* =========================================================
   CURSEUR
========================================================= */

function drawPointer(){

if(!pointer.down)return;

const l=liquids[current];

ctx.beginPath();

ctx.arc(
pointer.x,
pointer.y,
18,
0,
Math.PI*2
);

ctx.strokeStyle=l.light;
ctx.globalAlpha=.12;
ctx.lineWidth=1;

ctx.stroke();

ctx.globalAlpha=1;

}


/* =========================================================
   RENDU COMPLET
========================================================= */

function render(){

/*
   Fond simple.
   Pas de gros gradient à chaque frame.
*/

ctx.fillStyle="#0c1011";

ctx.fillRect(0,0,W,H);


/* zone liquide */

drawSurface();

drawParticles();

drawDroplets();

drawWaves();

drawPointer();

}


/* =========================================================
   FPS
========================================================= */

let fpsFrames=0;
let fpsLast=performance.now();

const fpsValue=document.getElementById("fpsValue");

function updateFPS(now){

fpsFrames++;

if(now-fpsLast>500){

const fps=Math.round(
fpsFrames*1000/(now-fpsLast)
);

fpsValue.textContent=fps;

fpsFrames=0;
fpsLast=now;

}

}


/* =========================================================
   BOUCLE PRINCIPALE
========================================================= */

let running=false;

function loop(now){

if(!running)return;

updateFPS(now);

pointer.vx*=.8;
pointer.vy*=.8;

interact();

liquidCohesion();

update();

updateWaves();

updateDroplets();

render();

requestAnimationFrame(loop);

}


/* =========================================================
   TOUCH / SOURIS
========================================================= */

canvas.addEventListener("pointerdown",function(e){

if(!running)return;

pointer.down=true;

pointerMove(e.clientX,e.clientY);

addWave(
e.clientX,
e.clientY,
1.2
);

splash(
e.clientX,
e.clientY,
pointer.vx,
pointer.vy
);

try{
canvas.setPointerCapture(e.pointerId);
}catch(err){}

});


canvas.addEventListener("pointermove",function(e){

if(!running)return;

if(!pointer.down)return;

pointerMove(
e.clientX,
e.clientY
);

if(
Math.abs(pointer.vx)+
Math.abs(pointer.vy)>3
){

addWave(
e.clientX,
e.clientY,
Math.min(
1.4,
(Math.abs(pointer.vx)+Math.abs(pointer.vy))/18
)
);

}

});


canvas.addEventListener("pointerup",function(){

pointer.down=false;

pointer.vx=0;
pointer.vy=0;

});


canvas.addEventListener("pointercancel",function(){

pointer.down=false;

});


/* =========================================================
   CHANGEMENT DE LIQUIDE
========================================================= */

document.querySelectorAll(".liquid").forEach(button=>{

button.addEventListener("click",function(){

document.querySelectorAll(".liquid")
.forEach(b=>b.classList.remove("active"));

this.classList.add("active");

current=this.dataset.liquid;

createParticles();

});

});


/* =========================================================
   DÉMARRAGE
========================================================= */

function startGame(){

document.getElementById("start").style.display="none";

createParticles();

running=true;

requestAnimationFrame(loop);

}

</script>

</body>
</html>
